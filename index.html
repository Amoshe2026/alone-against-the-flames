<script id="gamedata" type="application/json">{"nodes": {"1": {"text": "太阳高悬天空，无情地释放着热量。当你来到奥斯本药店门口的汽车站时，感觉自己都要被烤熟了。你放下沉重的行李箱，摘下帽子，终于得到片刻休息。你往脸上扇了扇风。在你的家乡，夏天总是漫长；但这个夏天格外令你空虚。\n你望向街对面，街对面是肮脏的肉店，挂着褪色遮阳篷的杂货店，还有破旧的烟草店。人们路过你时，用不信任的表情盯着你看，打量着你的衣着和行李。但住在这里是你父母的主意，和你无关。当你还是个小孩时，对南下去普罗维登斯还很开心：那里有白墙小屋，还有绿树掩映的教堂。也许阿卡姆的这份新工作可以带给你你需要的改变。\n但你在这世界上认识的所有人都住在这里。你在阿卡姆一个人也不知道，一个灵魂也不认识。你最后问了自己一遍，自己的选择到底是不是正确的。\n答案已经很清楚了。你所谓的朋友没有一个人来为你送行，你现在孤身一人。无论阿卡姆有什么挑战等待着你，那都将是新的生活、光彩夺目的生活。\n一辆灰色的小长途车开了过来，嘎啷嘎啷地响着停下。你戴回帽子，提起你的行李箱。", "acts": [{"t": "go", "to": 263, "label": "继续"}]}, "2": {"text": "你勇敢地抵抗，但这男人的块头和决心还是压服了你。最后他打出一记重拳，你摔倒在地，眼前顿时一片黑暗。过了一会儿，你朦朦胧胧地感觉到你的两腿被人抬着，后背刮蹭地面，就像被人拖着走一样。\n（译注：如果你的HP归零）你可以回复1点耐久值。", "acts": [{"t": "go", "to": 108, "label": "继续"}], "eff": [{"k": "hp", "v": "+1"}]}, "3": {"text": "一上午的辛劳让你饥肠辘辘。你漫步在烬头村的街道上寻找食物。这里根本没有你家乡常见的那种忙碌咖啡厅，也没有任何能称作饭馆的地方。\n当你开始觉得你必须要去杂货店买补给的时候，梅·莱德贝特从马路另一头走来，身后跟着个小女孩。这一定是露丝了。她一注意到你，就小跑起来，超过她妈妈，一边向你跑来一边朝你微笑。现在的露丝和昨天晚上那个害羞的小孩可完全不同。\n她跑到你身边就停下来，伸开胳膊，做了一个庆祝的手势。她仰视着你的眼睛。突然，她脸上的微笑不见了，好像一瞬间长大了几岁一样。\n“节日开始之前就走吧，”她小声嘘道。“走吧！”她用力眨眨眼，然后逃回妈妈身边去了。\n梅走过来搂住她女儿的肩膀，微笑道：“你的进展怎么样？找到交通方式了吗？”\n你吃了一惊，向她解释了现在的糟糕情形。\n“我去村会堂找过了文特斯先生。他一直是下午才在。你现在饿了吧？到我家里随便吃点东西吧。房门没有锁。”\n你瞟了露丝一眼，她现在像松鼠一样躲在她妈妈身后。她的眼神恳求你保持沉默。", "acts": [{"t": "go", "to": 9, "label": "如果你要问露丝她说的是什么意思"}, {"t": "go", "to": 15, "label": "如果你要问梅露丝说的是什么意思"}, {"t": "go", "to": 22, "label": "如果你一言不发"}]}, "4": {"text": "过了一会儿，你听到了房子里传来脚步声。然后，随着推开门闩的声音，木门打开了。一名卷发松散，身穿粗糙便服的女人看见了你。她的眼睛注视着你的旅行衣和旅行箱。她说话的时候带着一点点爱尔兰口音。\n“你好。我能认为你是在寻找过夜的房间吗？”\n你克制自己愁苦的表情，问她要价多少。就你目前所见，这个村子并没有给你多少选择的空间。\n“哦，价格绝对公道。”她说，“一看你就累坏了。我叫梅。进来吧，我们喝杯茶慢慢聊。”\n莱德贝特的家感觉相当逼仄，天花板很低，摆设也十分简单。但屋子整理得很不错，壁炉里还有一团令人愉悦的炉火在噼啪作响。茶水的芳香柔和舒缓，杯子让你的手指也暖了起来。\n“你是来烬头村参加节日的吗？”梅问道。", "acts": [{"t": "go", "to": 14, "label": "要解释西拉斯和长途车的事"}, {"t": "go", "to": 21, "label": "要询问有关节日的事"}]}, "5": {"text": "这些野兽成扇形面对你排开阵势，你的胸中升起黑暗的绝望。其中一只像箭一般冲向你，做出撕咬的动作，嘶嘶地吐着气。你提腿就踹过去。它缩回头，充满仇恨地低吼。它们围成一圈，等待着突袭的时机，浓重的麝香气充斥着的你的鼻腔……\n这些动物在你身边猛烈燃烧起来。\n它们在你的注视下像蜡烛一样烧着，红紫色的火苗舔舐着它们的皮毛，反常的烈焰销蚀一切，火、肉、油交织在一起。它们骇人的目光透过这火幕死死盯着你，它们狩猎的号子在哭嚎中扭曲成痛苦的挽歌。\n这些野兽的嚎叫萦绕在你的耳畔，你转身逃跑，在漆黑的年轻树林中摸索着。浓烟让你透不过气，你的视野模糊游移。你两脚一软——\n失去1D3点理智值。", "sp": "san_1d3_13", "tail": "前往[13]。", "refs": [13]}, "6": {"text": "你漫步在烬头村的街道上，可是并没有特别想去的地方。这村子建在一片相对平坦的高地上，视野开阔，景色壮丽。向北看去，白山山脉朦胧的峰顶高耸入云；向南眺望，温尼伯索基湖粼粼的湖水天水相接。\n这个村子只需要不到五分钟就能从一头走到另一头。你来到西面的盘山路。还有一条路通向南边，再转向东，从另一侧的山脊下坡延伸出去。村子西南角有一片开阔的草地，包围着一座坍圮的教堂，它的墓地正位于悬崖的最高点。还有三条大道，朝东北方向交汇到一座刻有浮雕的黑色金属建筑物。它十分突兀，直指蓝天。", "acts": [{"t": "go", "to": 16, "label": "去本地杂货店询问交通方式"}, {"t": "go", "to": 84, "label": "找到村会堂"}, {"t": "go", "to": 115, "label": "沿着道路下坡，查看东盘山路"}, {"t": "go", "to": 57, "label": "调查巨大的金属建筑物"}, {"t": "go", "to": 34, "label": "探索教堂"}, {"t": "go", "to": 96, "label": "寻找拥有交通工具的当地居民"}], "hub": {"targets": ["16", "84", "115", "57", "34", "96"], "need": 4, "to": 3}}, "7": {"text": "当你来到南边通往下山处的道路时，你看见四个村民手持农具和棍棒挡住了去路。你改变方向前往西盘山路。当你在另一边村口也看见了几乎同样的光景时，你的心凉透了。你被困住了。难道……你还知道其他出村的办法吗？", "sp": "secret_100", "tail": "要尝试靠口才通过把守村口的人群，前往[119]。要尝试化装通过，前往[125]。", "refs": [107, 119, 125]}, "8": {"text": "司机叼着烟，看着你把箱子拖到长途汽车的后面去。行李架装在车顶上，十分不便。你握紧了沉重的箱子。", "sp": "siz_cmp", "tail": "如果你的“体型”是40，前往[23]。如果你的“体型”高于40，前往[38]。", "refs": [23, 38]}, "9": {"text": "你蹲下来问露丝她说的是什么意思。露丝说：“节日很可怕，又亮、又热，到处都是火！”她的脸、她的声音都很幼稚。这转变过于突然，令人不安。你怀疑小孩子都是捉摸不透的生物。梅眼神转了转，弄乱了女儿的头发。露丝注视着地面。", "acts": [{"t": "go", "to": 22, "label": "继续"}]}, "10": {"text": "第一名舞者说：“你的牺牲，会让村子重生；”第二名舞者说：“你为了我们大家，直升云霄；”第三名舞者说：“我已经放松锁链，在火焰高到能藏住你之前，千万不要逃跑。”你瞪着第三名舞者。在漆黑的面庞下面你能清晰地辨认出露丝·莱德贝特惊恐的五官。她们迂回地跳着舞远去，消失在房子后面。", "acts": [{"t": "go", "to": 18, "label": "继续"}]}, "11": {"text": "村会堂俯瞰着村子北面较低的山脊。你沿着锡尔伯里街走到它门前，一路上都在注意着道路尽头那座令人压抑的黑色金属建筑物。会堂的百叶窗打开了，还有些窗户半掩着。门上没有门环，但你推开前门时，门顶上挂着的小铃铛发出了清脆的响声。进屋以后，你右手边有一扇紧闭的门，上面写着“私用”。左手边则是一条通路，通往一个敞亮的房间。你几步就走了过去。许多长凳沿墙整齐排列，两扇窗户之间挂着一块布告板。", "acts": [{"t": "go", "to": 17, "label": "要检查布告板"}, {"t": "go", "to": 24, "label": "要去敲紧闭的门"}]}, "12": {"text": "你一个滑步溜出工坊。工匠紧随其后，你将门板甩到他的脸上。他踉跄后退，用手捂住鼻子，你趁机逃跑了。只要你愿意，你还可以继续调查；但离开村庄可能更加明智。你可以在「闪避」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 120, "label": "继续"}], "eff": [{"k": "tick", "v": "闪避"}]}, "13": {"text": "你的脸上感受到暖意，身下还多出了床垫。你对着阳光眨眨眼睛，眼前飘进一个模糊的人影。“你醒啦。我是梅。梅·莱德贝特。”你动动身体，剧痛传遍全身。你感觉自己遍体鳞伤，脑袋也一阵阵地疼痛。你终于看清了梅。“你还活着真是走运。后半夜有个农夫发现你躺在路上。他给你处理了一下，用马车把你拉了回来。听说你当时在什么树林的中间？今天你就放轻松点儿吧。过一会儿我再来照看你。”农夫和马车当然早就不见踪影了。你又小睡了一会儿。你在失去意识的时候接受了急救，可以回复1点耐久值。", "acts": [{"t": "go", "to": 64, "label": "继续"}], "eff": [{"k": "hp", "v": "+1"}]}, "14": {"text": "梅摇了摇头，你瞥见她绿色的双眼里闪过一丝积攒已久的愤怒。“他总是开太快，就好像那条路是他自己家的一样。几年前他撞死过一匹母马，那可是相当地可怕。你也看见那辆车成了什么模样。车上的那些毛病都够吓着你了。”她抿了一口茶，视线掠过你，注视着房间的角落。“然而，我们既然住在这里，就实在不能得罪这个人。他是我们联系外面大世界的唯一方式，而且他心眼并不坏。我觉得人在同一条路上走十五年，会变得粗心大意。你该原谅他才是。”梅又沉默了好一会儿。然后，她的目光再次转回你。“但你来这儿不是听我唠叨的，你肯定也饿了。我可以给你凑一点炖菜。你觉得如何？”你又问了一遍她要价多少，梅讲了个相当便宜的价钱，你毫不犹豫地接受了。这间房子虽小但舒适，炖菜熟烂又丰盛。吃过饭以后，离你平常睡觉的时间还有几个小时。", "acts": [{"t": "go", "to": 31, "label": "要和梅多聊聊天"}, {"t": "go", "to": 75, "label": "要到外面转转，确认自己的方位"}, {"t": "go", "to": 63, "label": "要提前上床早睡觉"}]}, "15": {"text": "你问梅为什么露丝要自己离开村子。她狠狠瞪了女儿一眼。露丝注视着地面。梅说：“露丝不喜欢我们家里进客人。但她要明白，我们的生活并不是事事如意。有时我们必须做些不那么喜欢的事，但它们一样很重要。”梅对你摇摇头，向房子的方向点点头。你在她的绿色眸子间捕捉到一丝情绪。", "acts": [{"t": "go", "to": 22, "label": "继续"}]}, "16": {"text": "杂货店坐落在大街的拐角，过了杂货店就是南边的下坡。店主是位体形硕大但动作敏捷的女人，肩膀宽阔，穿着浆硬过的围裙。她死死盯着你这陌生的面孔。“坐车？这里每星期会来两辆长途车。没坐上？唔唔。每隔一星期的星期二会有卡车来给我送货，但他也要下星期才来。”她耸耸肩。\n看起来烬头村很乐意和外面的世界保持距离。\n你的钱足够在这里买到一两件便宜的日常用品。在你的调查员角色卡上把它们记下来。注意现在是1927年！商店里没有武器，只有一把积满尘土的狩猎小刀，如果想要，你可以买下它。", "acts": [{"t": "go", "to": 25, "label": "继续"}]}, "17": {"text": "你走过房间，地板在你脚下吱嘎作响。你感觉到脚下略微有些弹力。这个房间可能是给村里的孩子们做体操房用的。\n看起来，村里的大人们使用一块布告板，孩子们用另一块布告板。大人用的板子看上去很破旧，满是手写的字体，内容则是日用品的广告，还有一张泛黄的电报价目表。板上没有和节日相关的东西。\n孩子们的布告板上则写着托儿所的每周时间安排，还有一些明显由孩子们自己画出来的图画。这些画虽然五颜六色，但内容却支离破碎。你尽力分辨，也只能分辨他们在描绘焰火，或者是《创世纪》中约瑟的故事。有一张画少了一枚图钉，倒吊在板上。上面画着一只巨鸟正在攻击烬头村。不过也有可能只是小画家还没有掌握透视的精妙之处。", "acts": [{"t": "check", "skill": "侦查", "diff": "regular", "ok": 30, "fail": 37}]}, "18": {"text": "等到你抵达灯塔脚下，立刻有十个村民围了上来。他们以极其协调一致的动作夹住你的全身，抬着你走上黝黑的铁阶梯，来到高处的平台上。你一眼看到中央的架子，不禁颤抖不止：那早已因烈火而扭曲的撑架，现在明显牢牢拴上了铁链。他们将你捆到铁链上，但目光绝不和你交会。\n村民开始歌唱，那歌声节奏优美而古奥，由奇异的音节雕琢而成。另一组人扛着三具盖着红布的人体，也登上了灯塔。他们带着敬意，将扛上来的东西在你的脚边摆放成三角形。尔后他们就退下台阶，只剩下你独自和死者一起，被柴薪的海洋淹没。", "acts": [{"t": "go", "to": 33, "label": "继续"}]}, "19": {"text": "你堵住梅的去路，坚持要知道她到底在做什么。你看见她的眼中流露出深深的恐惧。\n她说：“这什么都不是，只是些帮助你睡眠的东西。我是为了你好。你看，明天对于你是多么重要的一天……”\n你乘胜追击，要求她做出完整的解释。\n她说：“行行好，理解我一下吧。我还要照顾我女儿，我都已经没有丈夫了。”\n她扭身离开你，逃回她的房间去了。\n你可以在「恐吓」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 58, "label": "要用椅子堵住门再小睡一会"}, {"t": "go", "to": 52, "label": "要彻夜不眠"}]}, "20": {"text": "工匠抽动鼻子，想把充血的鼻腔清干净。他的意识似乎时断时续。你逼近他威胁道，除非他说出尸体的事情，否则严加拷打。\n“只是……村民，”他用刺耳的声音说道。“自然……死亡了。我们……节日要用。”\n他闭上了眼睛，头垂到一边。你可以把他关在工坊里，然后考虑下一步的目的地。", "acts": [{"t": "go", "to": 120, "label": "继续"}]}, "21": {"text": "“嗯，我觉得人们大概只可能是因为节日才会来烬头村。我以为你来这里也是来研究节日或者来拍照片的。不过，节日不是明天晚上，而是后天晚上。我想对于过路客来说，这很奇怪。”\n梅又为你满上了茶水。壶嘴和茶杯相碰，发出清脆的铿声。\n“你知道吗，我们有一座灯塔。每年的这个晚上我们都要举行火把游行，点燃悬崖上的灯塔。你以前肯定没见识过这类仪式。他们说这样可以保佑村庄全年平安无事。这是庆典。是庆典……”她沉吟了一会儿，眨了眨眼。\n“但你来这儿不是听我唠叨的，你肯定也饿了。我可以给你凑一点炖菜。你觉得如何？”\n你又问了一遍她要价多少，梅讲了个相当便宜的价钱，你毫不犹豫地接受了。这间房子虽小但舒适，炖菜熟烂又丰盛。吃过饭以后，离你平常睡觉的时间还有几个小时。", "acts": [{"t": "go", "to": 31, "label": "要和梅多聊聊天"}, {"t": "go", "to": 75, "label": "要到外面转转，确认自己的方位"}, {"t": "go", "to": 63, "label": "要提前上床早睡觉"}]}, "22": {"text": "你别过莱德贝特母女，向她们家走去。房门一下就打开了。在低矮的厨房里，你用干硬的面包和剩下的炖菜凑合了一顿午餐。厨房里有扇小窗户，可以望见群山。这一上午你的唯一收获就是——烬头村并没有什么可以吸引外界游客的东西。但现在白昼还剩下差不多五个小时。你可以准备一点干粮，带上自己行李里仅有的必需品，继续出发，希望能在天黑之前抵达下一个村庄。你也可以去文特斯先生那里寻求帮助。", "acts": [{"t": "go", "to": 28, "label": "如果你稍作准备出村去"}, {"t": "go", "to": 11, "label": "如果你转而造访村会堂"}]}, "23": {"text": "你折腾了几秒钟，司机走上前你给你搭了把手，嘴里还叼着烟。“小不点，包可够大的。”他说道。你觉得你最好简单地感谢一下他作为回应。", "acts": [{"t": "go", "to": 233, "label": "继续"}]}, "24": {"text": "你抬手敲门，但还没敲响，门就打开了。门后的中年绅士下意识地后退了一步，扶正他的眼镜。你连忙道歉，并做了自我介绍。他镇定下来，注视着你。“我知道了。我是克莱德·文特斯。您说您是来做客？然后就来找我了？嗯！要不要来点儿咖啡？我下午这个时间一般会喝一杯。”他的邀请相当真诚，这是个好机会，你可以把脑海里积攒的问题都问出来。", "acts": [{"t": "go", "to": 43, "label": "继续"}]}, "25": {"text": "你已经能大概摸清自己在烬头村的位置了。你想继续深入调查吗？你可以从以下几个选项中再选择一项。不要重复之前的选择。", "acts": [{"t": "go", "to": 3, "label": "你已经试过四个选项——动身离开烬头村（推进时间）", "cond": 4}, {"t": "go", "to": 16, "label": "在本地杂货店询问交通方式"}, {"t": "go", "to": 84, "label": "找到村会堂"}, {"t": "go", "to": 115, "label": "沿着道路下坡，查看东盘山路"}, {"t": "go", "to": 57, "label": "调查巨大的金属建筑物"}, {"t": "go", "to": 34, "label": "探索教堂"}, {"t": "go", "to": 96, "label": "寻找拥有交通工具的当地居民"}], "hub": {"targets": ["16", "84", "115", "57", "34", "96"], "need": 4, "to": 3}}, "26": {"text": "你在晨光中浑浑噩噩地醒了过来。太阳已经升得很高，但你感到自己一点也没有休息好。你发现自己的思绪被房间里的各种细节占据了：门框上的木材纹路，还有衣橱上一个有缺口的把手。\n当你翻身下床时，腹部却一阵绞痛，脚下不稳，差点扑倒在地。可能你是生了什么病？你眨眨眼，小心翼翼地直起腰来。房间里的空气芳香馥郁。你凝视窗外，直到你感觉自己已经稳住，可以离开了。", "acts": [{"t": "go", "to": 64, "label": "继续"}], "eff": [{"k": "penalty", "v": true}]}, "27": {"text": "门吱呀一声打开，将你的思绪猛然拉回现实。门口的人握着熊熊燃烧的火把，橘黄的光芒涌进房间。两个身躯庞大的村民走进来，一把将你抓住。至少，你认为他们是村民。他们穿着厚实的黑色长袍，脸上手上全都涂成漆黑，只有左眼的位置画着一个红三角。你想尽力拖延，但他们架起你的胳膊，把你从床上连根拔起。似乎整个村子都聚集到门外围观你。每个人都涂着黑脸，画着红三角装饰图案。火把噼啪作响，火星喷溅而出。你奋力挣扎，但明白身体抵抗徒劳无益。你被游行队伍押到中央大街，拐了个弯，直冲灯塔而去。", "acts": [{"t": "go", "to": 117, "label": "继续"}]}, "28": {"text": "你带上钱、水还有几块三明治，还礼貌地给梅·莱德贝特留了一张字条，解释情况并许诺你会尽快回来取行李。天空飘浮着斑驳的云朵，但并没有马上要下雨的迹象。\n在几个村民的注视下，你走下南边的道路，顺着它转到东边。那黑色的金属建筑物突兀地挺立在山崖上。你走过烬头村外低矮的棚屋时，不禁打了个寒战。\n你受够了烬头村鄙陋闭塞的街道，在开阔的环境和成就感中恢复了精力。但是一小时以后，空旷的道路带来的新鲜感渐渐消失了。你刚刚进入第一片树林，就听到北面传来一阵轻快而怪异的呼啸。", "acts": [{"t": "check", "skill": "博物学", "diff": "regular", "ok": 35, "fail": 41}]}, "29": {"text": "村子北边十分繁忙，你在那里大概隐蔽不了多久。你向教堂的方向前进，然后沿着房子背面向村东头前进。你右边出现了一段断崖。有一部分地面非常狭窄，你必须扶住屋墙作支撑。\n如果要前进，比较你的“体型”和“敏捷”。", "sp": "cliff_squeeze", "tail": "你可以选择放弃这条路，前往[120]。如果你的“敏捷”较高，前往[42]。如果你的“体型”较高，进行一次“敏捷”检定。如果你成功了，前往[42]。如果你失败了，前往[36]。", "refs": [36, 42, 120]}, "30": {"text": "午后的阳光照射到地面上，你发现了一些有意思的东西。窗户下面的地板比房间中央的地板要新。窗框也有最近曾经更换过的痕迹。也许是雨水漏进来，木头被腐蚀了。\n你可以在「侦查」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 37, "label": "继续"}], "eff": [{"k": "tick", "v": "侦查"}]}, "31": {"text": "梅开始说起她在烬头村的生活。“我妹妹每次来信都会问我有没有过够这种日子。她住在纽约。然后她就开始讲自己晚上走回家时有多么害怕！我也该问问你。”\n你说到你希望在阿卡姆开始新生活。梅好像没有听进去你的话。\n“这里的确是小地方没错，但也就是说我们有真正的群体性。所有人的脸都是熟脸，所有人都一起工作。我们不排斥任何人，当然，要刨掉那些自己选择离开群体的人。我现在已经不好再住到别的地方了。", "acts": [{"t": "check", "skill": "魅惑", "diff": "regular", "ok": 39, "fail": 51}]}, "32": {"text": "梅的眼中升起怒火，厉声喝道：“你敢在女人的家里打人吗？这街上可住着十八个人。只要我喊一声，所有人都会跑过来。”\n她从客房夺路而出，回到她的卧室。你考虑继续追究这个问题，但最终决定放弃。", "acts": [{"t": "go", "to": 58, "label": "要用椅子堵住门再小睡一会"}, {"t": "go", "to": 52, "label": "要彻夜不眠"}]}, "33": {"text": "看来整个村子的人都围到了灯塔前，看你怎么烧死。你能隔着脸上的颜料认出梅·莱德贝特，还有——对，那个巴士司机西拉斯，就站在她旁边。这场骗局竟如此庞大无耻，令你心惊胆寒。\n一个男人登上高台，在全场寂静之下扬起手臂。他的眼镜遮挡着脸上的红三角。\n“现在，我们像往年一样，在今夜再度聚集到这里。我们要感谢将村庄从虚空之火中拯救的人。您将代替我们，被从天而降者带走。您的牺牲将给我们的街道带来生机，为我们的田野送去丰收。它将保佑我们的孩子和老人度过安稳的一年。我们向您致敬。”他俯首示意。\n举火者从灯塔四周迈进，将手中的火把举到高台的边缘上。一圈小小的火苗开始沿着高台四周闪烁起来。火光明灭之中，村民们的歌唱逐渐变得低沉，化作超脱尘世的韵律。", "acts": [{"t": "go", "to": 44, "label": "要用尽剩余的气力挣脱锁链"}, {"t": "go", "to": 40, "label": "要静观其变"}]}, "34": {"text": "你穿过街道，走向教堂。当你向左张望时，视线正好落到巨大的金属建筑物上。它的位置令你有点在意。你转身回去重新端详。没错！烬头村的中央大街笔直地朝那建筑物而去。太精确了，怎么看也不像是巧合。\n你继续前进，来到教堂的阴影下。这建筑物的状态相当凄惨。尖塔的顶已经没了，残破的木板上粗糙不平的裂痕标志着它早已不见踪影，正下方的地板也已经塌陷。貌似尖顶在掉下去的时候，也把主楼的房顶给砸坏了。只有后半边是完整无缺的。曾经涂覆在教堂墙上的白漆，现在也泛黄剥落了。\n在后半边探索似乎足够安全。古旧的长椅排列在内墙两侧，几乎完全被霉斑覆盖。窗户也破得差不多了。你猜测这教堂大概已经废弃二十年了。但这里还有些其他有趣的东西。你可以获得一颗奖励骰；额外投一颗十位骰，分别计算结果后取最低值。", "acts": [{"t": "check", "skill": "骑术", "diff": "regular", "ok": 46, "fail": 25}]}, "35": {"text": "那是郊狼的嗥叫，在这个地区很常见。狼嗥听上去很吓人，尤其是晚上的时候，但郊狼懂得躲避人类。你可以毫无惧色地前进。你可以在「博物学」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 54, "label": "继续"}], "eff": [{"k": "tick", "v": "博物学"}]}, "36": {"text": "泥土随着你的踩踏下陷，断崖的边缘崩落了。你开始下坠，感觉自己的脏腑都在倾斜。", "acts": [{"t": "check", "skill": "攀爬", "diff": "regular", "ok": 48, "fail": 55}]}, "37": {"text": "你身后的门发出吱嘎的响声。一个戴眼镜的中年绅士出现在门前：“有什么需要吗？”你解释说，梅·莱德贝特建议自己来这里。“啊。好吧。我是克莱德·文特斯。我不知道我能不能帮上您的忙，但……您要不要来点儿咖啡？我下午总爱喝一杯。”他用手指向身后敞开的大门。这看起来是次值得把握的机会，而且你也有点渴了。", "acts": [{"t": "go", "to": 43, "label": "继续"}]}, "38": {"text": "司机继续享受他的烟卷，饶有兴致地看着你和箱子拼命。你咬咬牙，终于把第二个行李举起来，放到了位。兴许阿卡姆的人会比他有礼貌点儿。", "acts": [{"t": "go", "to": 233, "label": "继续"}]}, "39": {"text": "随着时间流逝，梅乐观的态度变成了沉吟。“生活也不是一帆风顺的。你知道吗，我是个寡妇。我手头有点儿钱，当然也欢迎像你这样的旅行者做客。只要我们住在这里就不会挨饿，但我觉得我是不可能再嫁出去了。村里的每个男人我都认识。我太了解他们了，你懂我的意思吧。”\n她撇了撇嘴，打了个呵欠，伸手拢了几下头发。\n“不早了，我该睡觉了。你想几点钟吃早饭？”\n在你的调查员角色卡上「魅惑」左边的小方框里打勾。如果你成功完成了本次冒险，你有机会通过这次和梅的经历，学到一些东西。", "acts": [{"t": "go", "to": 63, "label": "继续"}], "eff": [{"k": "tick", "v": "魅惑"}]}, "40": {"text": "火焰蜿蜒爬过薪柴，一边延烧一边升腾。烟雾开始弥漫，村民的身影已经难于辨认。你身边的三具人体也被点燃，红色的火焰里带着黑烟。浓烟钻进了你的肺，你开始咳嗽，努力压抑涌上心头的强烈恐惧。\n如果你学过奇怪的咒语又想尝试的话，现在就抓住时机。", "sp": "spell_window", "tail": "否则前往[65]。", "refs": [50, 65, 80, 90]}, "41": {"text": "你犹豫不决。你是在镇子里长大的，只熟悉城里。你可从来没和野生动物打过交道。独自走进未知的树林是不是不太明智呢？", "acts": [{"t": "go", "to": 54, "label": "要决意前行"}, {"t": "go", "to": 47, "label": "要回到烬头村确保安全"}]}, "42": {"text": "泥土随着你的踩踏下陷，石头从断崖边缘崩落。你小心翼翼地扶住墙壁，慢慢前行。最后你终于找到了一个观察灯塔的好位置。", "acts": [{"t": "go", "to": 61, "label": "继续"}]}, "43": {"text": "你走进标着“私用”的门。村会堂的这一边和公用空间形成了鲜明的对比。房间布置非常紧凑，书架和文件柜整齐地排成几排。有一个角落留作小型的食品储藏处，可能同时还兼作盥洗室。\n在文特斯先生填满咖啡壶时，你上下审视了他一番。他的头发虽然稀薄，却打了头油，仔细地梳成背头。他的外套简朴素雅，纵然样式有点过时，但做工着实精良。换作其他人独自工作的话，可能早就图个舒服解开蝴蝶领结了。\n在对面墙边的桌子上，你发现了像是电报机的装置。", "acts": [{"t": "go", "to": 56, "label": "要立即询问电报的事"}, {"t": "go", "to": 49, "label": "要先和文特斯先生先聊聊"}]}, "44": {"text": "你已经精疲力竭，你的肉体本应无从撼动黑铁打造的锁链。但你感觉到它们松动了一点点。这铁链的其中一节有弱点。", "acts": [{"t": "go", "to": 53, "label": "如果你成功了"}, {"t": "go", "to": 40, "label": "如果你失败了"}]}, "45": {"text": "你一个激灵醒了过来，手上和毯子角力，随时准备攻击——\n莱德贝特家的客房寂静无声，洒满晨光。这里除了你，根本没有其他人。你放开毯子，等着砰砰乱跳的心脏逐渐平复。", "acts": [{"t": "go", "to": 64, "label": "继续"}]}, "46": {"text": "这里面充斥着泥土和发霉的气息。但你察觉到一缕与之不同的气息：是马的气味。你四下里搜寻，在阴暗的角落里找到了残留的蹄印，还有些干燥的马粪。这座废弃的教堂曾经被用作马棚——而且还是不久之前。这些马现在去了哪里？", "acts": [{"t": "go", "to": 25, "label": "继续"}]}, "47": {"text": "又有一阵呼啸响起，回应着前一阵呼啸。你想象自己在林子里被群狼逼入绝境，扑倒在地，衣不蔽体，皮开肉绽；狼王踱到你的面前，尖牙闪着寒光，对你垂涎三尺。它无情的大嘴直取你的喉咙——\n回村的路好像比出村时长得多。你尽量不去回头看走过的路。在你上坡时，日头渐渐下沉。你的时间还够，还可以去村会堂碰运气。", "acts": [{"t": "go", "to": 11, "label": "继续"}]}, "48": {"text": "你挥动手臂，手指紧紧地握住了屋墙上的一处凸起。你依靠它支撑全身的重量，直到脚再次触碰到坚固的地面才松开手。你向下张望，断崖大概有二十英尺深。你差点就没命了。\n你可以在「攀爬」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 61, "label": "继续"}], "eff": [{"k": "tick", "v": "攀爬"}]}, "49": {"text": "咖啡壶开始咕噜噜地响起来，你和文特斯先生互相说着客套话。\n“住在这里吗？这是一种交易，和生活中的其他东西一样。”他的视线落在你身后的高架子上。“我当然也希望能拥有真正的图书馆。但是我也有自知之明。我不过是个半吊子。而城里……”他的脸嫌恶地皱了皱。“人太多了。人人都在跑，在嚷。我们烬头村这个地方得天独厚，必须有人负起责任来维护它。以前我父亲就这么做的，现在这责任落到我头上了。”他抬抬下颏，端正了坐姿。\n“今天晚上，夕阳落山时，出去看看村子四周的美景吧。我们和平地住在这片地方，正处在群星之路的中途。我们不是荣幸之至吗？这难道值不上我们要忍受的艰辛吗？”\n他若有所思地看着你。现在是个问电报的好时机。", "acts": [{"t": "go", "to": 56, "label": "继续"}]}, "50": {"text": "当你回忆阿博加斯特的咒语时，火焰在逐渐逼近。脚下的热量在累积，你难以整理思绪。你不断地咳嗽，几乎说不出一句完整的话，但你并没有停止诵读。最终你读到了最重要的一节，即便你的衣服已经烧着，你仍连呼三遍：\nPh'ngluimglw'nafhCthughaFomalhautn'ghaghaanaf'lthagn!Iä!Cthugha!", "acts": [{"t": "go", "to": 270, "label": "继续"}]}, "51": {"text": "随着时间流逝，梅的话语多少有些变成了疲累的游览指导，你听起来感觉有些好笑。\n“当然了，如果天气好，这里的景色真的相当壮观。每个方向的视野都清晰无阻。如果你是画家，你会感觉像回了家一样。如果你的口味更喜欢工艺品，锡尔伯里街上还有工坊。走到头右转就是了。他们不是为了游客干活的，你懂吧？但你可以看见真正在工作的工匠。真正的独具匠心。然后，如果你想吃新鲜出炉的面包……”\n你觉得不好意思去说自己不久还要继续上路。你让梅继续讲下去，直到她打起呵欠。\n“你还要听我瞎唠吗？不早了，我该睡觉了。你想几点钟吃早饭？", "acts": [{"t": "go", "to": 63, "label": "继续"}]}, "52": {"text": "你瞪着窗外，看太阳从地平线升起，给村子笼罩上病态的橙色。这一夜格外漫长，你身体僵硬、心烦意乱，不停地搓着眼睛。\n几分钟以后，你听到梅在厨房忙碌，还有前门打开又关上的声音。额外投一颗十位骰，分别计算结果后取最高值。这不影响幸运、理智和伤害检定。", "sp": "tough_52", "tail": "进行一次“体质”检定。如果你失败了，今天你的技能检定受到一颗惩罚骰。额外投一颗十位骰，分别计算结果后取最高值。这不影响幸运、理智和伤害检定。现在前往[64]。", "refs": [64]}, "53": {"text": "当火舌跳动着，沿着薪柴向你靠近时，你紧闭双眼，一下下拽着链子。它又松动了一点点，然后——啪嚓！铁链的一角掉了下去。即使火焰正在烧焦你的脚踝，你仍然在捆链里蠕动，挣松束缚。\n高台上的人盯着你的动作。然后他从人群中喊出两个年轻人，用手直指向你。\n你刚刚抖落铁链，从铁架上获得自由，两个年轻人就登上了炽热的平台。火焰蔓延上他们的裤子。当他们的披风开始起火时，他们一猛子扎入火中，向你扑来。", "acts": [{"t": "go", "to": 109, "label": "如果你成功了"}, {"t": "go", "to": 123, "label": "如果你失败了"}]}, "54": {"text": "第二声嗥叫回应着前一声，但听起来距离远一些。你在树林中沿着道路穿行。两侧的树枝斜伸到路的上方。树叶的颜色颇为美丽，有金色，有棕褐色，还有鲜艳的深红色。落叶在你的脚下喀吱作响。\n大约半小时以后，你走出了树丛。道路懒洋洋地转了一个弯，绕过前面的山麓，进入另一片树林。有一条崎岖的小径，似乎是穿越树林的近道。", "acts": [{"t": "go", "to": 60, "label": "如果你想上山辨认别的村庄"}, {"t": "go", "to": 85, "label": "如果你尝试小径"}, {"t": "go", "to": 103, "label": "如果你继续沿着道路走确保安全"}]}, "55": {"text": "你弓身向上扑，寻找支撑点，手指在墙壁上乱抓。还没有一秒种的工夫，你再次下坠，结结实实地摔到了岩石地面上——\n你撞上地面时受到2D6点伤害。", "sp": "fall_2d6", "tail": "如果这次伤害的数值大于等于你最大耐久值的一半，前往[67]。否则，前往[73]。", "refs": [67, 73]}, "56": {"text": "“电报？呣呣。虽然我们很珍惜自己的独立，但有时也需要联络……您想发消息吗？我得说声对不起。这条电报线已经坏了两个星期了。我已经报修了，但因为问题出在乡下，他们当然不会快到哪里去。我希望后天能有人来修。它对您造成的失望，我深表歉意。长途车应该，大概，三天以后到？但我觉得他会往西走。也许您能遇上辆马车？附近农民可能……”\n你解释说，你已经问过几个村民了，但完全没有用。\n文特斯给你倒上一杯冒着热气的咖啡。这杯深色热饮散发着醇厚的香气。“我跟您说，维修队来了以后我会叫他们把你捎走。这样行不行？他们也许会要一两美元的车马费……”\n后天？这可不太理想。不过你终于得到了一次真正的机会。", "acts": [{"t": "go", "to": 180, "label": "要谢过文特斯先生并离开"}, {"t": "go", "to": 62, "label": "要询问他的藏书室"}]}, "57": {"text": "你沿着中央大街走着，这是三条大街居中的一条，朝着那奇怪的金属建筑物笔直而去。当你走出周围建筑物的阴影时，展现在你面前的是从北方一直延伸到东南方的壮丽全景。深秋的最后一抹色彩将山丘的轮廓染成睡意朦胧的金色。\n相比之下，这座建筑物则是用熟铁铸成，外面烤成漆黑。它上边是一个巨大的弧形平台，大致和你的头顶一般高。再上边的撑架蛇行汇聚到中心点。它们似乎在很久以前有某种雕刻，但现在已经扭曲熔化，早就无法辨识。\n一位老绅士走过，用一双红肿的老眼看着你。“你来参加节日的吗？”他问道。“这就是灯塔。明天晚上他们点亮它的时候，你在二十里外都能看得见。”他愉悦地点了点头，然后拄着手杖继续走他的路。\n你还发现建筑物的附近堆着许多成捆成捆的木头。也许这次节日会是一次有趣的消遣，但你真的应该尽快赶往阿卡姆了。", "acts": [{"t": "check", "skill": "侦查", "diff": "regular", "ok": 69, "fail": 25}]}, "58": {"text": "你被房外街道上的脚步声吵醒了。一晚上的休息为你带来了新的目标。今天，你要凭借自己的努力面对烬头村。\n如果你受过伤，你可以回复1点耐久值。", "acts": [{"t": "go", "to": 64, "label": "继续"}], "eff": [{"k": "hp", "v": "+1"}]}, "59": {"text": "你被一阵绝望的叫喊惊醒了。司机猛打方向盘，长途车跌出了路沿，你感觉自己从座位上往下滑。太迟了，你撞上了前面的座位。你滚落到走道上，肋骨磕上对面座位的棱角。你大口喘着粗气。长途车发出一声闷响，停了下来。\n你的司机从座位上跳到了马路上。在你晕乎乎地趴在走道上的时候，你听见了一连串挑拨的咒骂。\n司机爬回车里，看到你趴在走道上。他看上去很担心，扶你坐回座位上。现在你才看到发生了什么事。一辆福特森拖拉机停在了路中央，你的司机刚才必须紧急转弯躲避这只铁皮拦路虎。\n“对不住，”他说，“两边都是地，他只能停路上。你没事吧？”\n你觉得自己没受什么大伤。可是，要有一块色彩斑斓的瘀伤在你身上留几天了。司机往后倒了倒车，绕开了拖拉机，对农民怒目而视。\n你在这次事件中损失了1点HP。在你的调查员角色卡上标记出损失，但要记住初始值。你回复时最多可以回到这个值。如果你的耐久值归零，你就会失去意识，甚至死亡。", "acts": [{"t": "go", "to": 71, "label": "继续"}], "eff": [{"k": "hp", "v": "-1"}]}, "60": {"text": "平缓的坡度使人误入歧途，等于你抵达山顶的时候，额头都湿透了。你停了一会儿喘口气，又向东面望去。前方的山谷是郁郁葱葱的树林，不过你可以瞧见一条狭窄的水流。但仍旧没有村庄的迹象。地平线上似乎有什么东西——也许是座尖塔？但肯定又要走八九个小时才能到达。\n你回头看向烬头村。山顶的村庄漆黑一片，只有落日的余晖映衬出它的大概轮廓。", "acts": [{"t": "check", "skill": "考古学", "diff": "regular", "ok": 66, "fail": 72}]}, "61": {"text": "你静悄悄地趴在草丛里，观察着灯塔周围的活动。村民们扛来了更多的柴火，把它们整齐地捆扎成束。还有一组人负责把柴火束送给站在灯塔平台上的两个男人。他们在建造一种三角形的结构，看上去像是巨大的篝火。\n你越看，越因这些劳作者的举止而震惊。这是他们的节日。你本希望看到欢乐的气氛和轻松愉快的交谈，但他们表情有些是顺从、冷漠，也有些是赤裸裸的恐惧。\n你观察了足有半个钟头才溜走。", "acts": [{"t": "go", "to": 120, "label": "继续"}]}, "62": {"text": "你对他架子上那些书册做了简单而讨好的评论。文特斯高兴地涨红了脸。\n他说：“哎，这当然不是我私人的收藏。这是属于全村的。但最新的书的确是我精挑细选过的。我挂上‘私用’的牌子，是防止别人在集会时随便进出。但这里其实还是公用的。”你扫了一眼书架。书架上是零散但为数不少的数学与科学书、还说得过去的文史书，还有一架文学书。他还在角落里藏了几本通俗小说和破烂的《幻丽诡谭》杂志。“恐怕质量和人气并不总是相配。”文特斯带着歉意对你微笑道。", "acts": [{"t": "go", "to": 68, "label": "要花点时间在图书馆里研究研究"}, {"t": "go", "to": 180, "label": "要趁天色还早时离开"}]}, "63": {"text": "当梅站起身的时候，你听到身后传来撞门的声音。你扭头往回看，却只能看见关得严严实实的木门。梅咂了咂嘴。“是我们家的小女主人。她准是在偷听我们说话。露丝！出来和客人打个招呼。”一阵短暂的沉默之后，门吱嘎一声开了。门后的人披着乱蓬蓬的头发，穿着粗糙的睡衣；她的一双大眼睛透过门缝盯着你。“你该说什么？”她眨了眨眼。“很高兴见到你。”“现在回去睡觉。”门又合上了。“我女儿露丝。今年夏天就十岁了。她是个既快乐又痛苦的孩子。不用担心，她会和我一起睡，不会打扰你的。那么，该说晚安了。”你走进你的房间躺下。房间里有点冷，但你实在太疲倦了，压根没有考虑生火。床上铺着洁净的床单，躺下不久就暖和起来。你在城市里生活了那么久，感觉外面的寂静很奇怪，但很快就睡着了。", "acts": [{"t": "go", "to": 154, "label": "继续"}]}, "64": {"text": "莱德贝特家的厨房空空荡荡，不过桌上摆出了面包和鸡蛋充当早餐。还有一张梅写的纸条，说她要带露丝出门几个小时。", "acts": [{"t": "go", "to": 70, "label": "如果你昨天夜里卷入了一场战斗，并想进一步勘查其后果"}, {"t": "go", "to": 78, "label": "否则"}]}, "65": {"text": "火舌舔上你的双腿。你的眼中充满泪水。你被烟幕笼罩了；也许是你的想象，但你认为你感觉到铁链有一点点松动。你用尽全力挣扎，全然不顾铁链在你的手腕上拴得有多么牢固。\n你因为火焰受到1D6点耐久值伤害。如果你的耐久值因此归零，你就会失去意识，被烈焰烧死！【剧终】。", "acts": [{"t": "check", "skill": "力量", "diff": "regular", "ok": 93, "fail": 77}], "eff": [{"k": "dmg", "v": "1D6"}]}, "66": {"text": "太阳的位置令你困惑。它让你想起你看过的一本杂志上的东西；一篇关于英国巨石阵的文章，貌似？你查看自己的位置、北面群山的位置，闭上眼睛，根据你早上探索的结果，在心底描绘烬头村的布局。金属建筑物如同钥匙一般，坐落在它的峭壁之上。是的，这完全有可能。\n当然，你并没有得到确切的方位，也无法查找天文表，所以不能肯定。但如果你的猜测正确的话，烬头村中央大街的位置正好能让夏至日的晨光照过金属建筑物，直接投射到大街中央。\n这也许只是大胆的猜测。但是你觉得它还有些道理。\n你可以在「考古学」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 79, "label": "继续"}], "eff": [{"k": "tick", "v": "考古学"}]}, "67": {"text": "你以奇怪的角度落地，身上有哪里断掉了。你摸摸身下面，手指上沾上了湿湿的东西。你视野边缘的黑幕在徐徐关闭。你受到了重伤。", "sp": "heavy_wound", "tail": "进行一次“体质”检定。如果你成功了，前往[82]。如果你失败了，或者你的耐久值已经归零，前往[92]。", "refs": [82, 92]}, "68": {"text": "文特斯很高兴你能花掉整个下午的时间读书，找了一把直挺但舒适的椅子让你坐。你有足够的时间顺着一条线索做深入的研究。", "acts": [{"t": "go", "to": 74, "label": "要研读本地历史相关的内容"}, {"t": "go", "to": 81, "label": "要研读节日相关的内容"}, {"t": "go", "to": 88, "label": "要研读科学书籍"}, {"t": "go", "to": 94, "label": "要研读怪诞小说"}]}, "69": {"text": "当你从这座铁铸的建筑走开时，你注意到这村子的布局有些怪异。所有的木屋都集中在村西和村西南。而到了接近灯塔的村东和村东北，建筑则变成了深色的砖房和土房。这是不是说明村庄是从灯塔开始，逐渐向西扩张的呢？\n你可以在「侦查」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 25, "label": "继续"}], "eff": [{"k": "tick", "v": "侦查"}]}, "70": {"text": "你如惊弓之鸟一般来到你和阿博加斯特被袭击的地方。你对战斗的记忆暧昧不明，但有几个生动的影像你记得非常清楚。\n一开始你认为这里没什么值得看的东西：没有被扔掉的武器，也没有倒在地上的人。但仔细检验之下，你还是找到了凝固发黏的斑块，还有草丛上熏黑的线条。\n若是村里有警察局，你早就考虑去了。但有些迹象让你意识到，事态的发展已经超出了你的判断。", "acts": [{"t": "go", "to": 78, "label": "继续"}]}, "71": {"text": "你的行程重新开始了。司机转弯时变得更加小心。他转过头看了你好几次。\n“刚才对不住，”他说，“那货比猪还蠢。我叫西拉斯。你的名字是？”\n刚才的事件里，西拉斯和农民的责任至少要对半分。但是，当他开车带你穿过这前不着村、后不着店的地方时，和他对抗可能并不明智。\n为你的角色起一个名字，把它记在自己的调查员角色卡上。你还可以加上你的年龄；对本冒险来说，你的角色年龄应当在23到36岁之间。\n长途车开上了一条窄一些的路，这条路迂回上升，穿过树林。西拉斯的话变得多了起来。\n“去阿卡姆吗，哈？都没听说过这地方。就去过一次波士顿。不喜欢。人太多，太闹腾。你家在那里吗？有特别的人等你吗？”\n下午的时间在缓慢地流逝。你觉得向西拉斯透露自己的新生活也没有什么坏处。“工作哈？你干哪行？", "sp": "career", "tail": "从以下选项中选择你角色的职业：如果你是文物学家，前往[102]。如果你是医生，前往[226]。如果你是记者，前往[239]。如果你是私家侦探，前往[249]。如果你是教授，前往[265]。", "refs": [102, 226, 239, 249, 265]}, "72": {"text": "你一想到自己的行李箱还丢在山上，由一个24小时之前还素不相识的女人保管着的时候，就感到一阵自我怀疑。他们手上有你一切财物，只有你孑然一身站在这里。但你却觉得有一点点喜悦，尽管这次莽撞探险没有地图，也没有多少补给，夜色降临之时仍在继续前往未知的地方。你的生命第一次失去了庇护。这危险的自由带给你的无疑是快乐。西拉斯", "acts": [{"t": "go", "to": 79, "label": "继续"}]}, "73": {"text": "你一下撞到地面上。肺里的空气直冲出你的喉咙，鲜血渗出你的头顶。", "sp": "hp_zero", "tail": "如果你的耐久值已经归零，前往[92]。否则，前往[82]。", "refs": [82, 92]}, "74": {"text": "这里并没有单独记述本地历史的书籍，你只能从大量薄薄的专述卷册中拼凑出大概的模样。\n有些暗示表明，阿布纳基人，或者阿贝纳基人曾经将烬头村所在的山头当成祭祀场所。这个土著民族名字的意思是“黎明之地的人民”。这个民族每年“在树叶的颜色变成日落最浓的颜色时”会上山举行仪式。有些文章涉及到当地的太阳崇拜，但并没有可信的证据证明仪式属于太阳崇拜。\n后来此地卷入了乔治王战争（译注：1744—1748年英法争夺北美殖民地的战争），1746年英国殖民军在被瓦巴纳基联盟袭击后发动了反击，阿布纳基人也是攻击目标。英国人见人就杀，土著幸存者所剩无几，被永远驱离了这片地区。\n烬头村建立的时间没有确凿的记载，但独立战争之后不久山上就有人定居的记录了。", "acts": [{"t": "go", "to": 99, "label": "继续"}]}, "75": {"text": "当你说你打算出门散步时，梅皱起了眉头：“路上你要小心。烬头村四面都是悬崖，我们也没有你们城里那种贼亮的路灯。拿上这盏灯，注意脚下。”\n你刚走出门，就知道了她说这话的含义。天空浓云密布，只有几缕黯淡的月光透过云层照下来。没有这把沉重的提灯，你就要彻底摸黑走路了。你没法靠今晚就了解村子的全貌。\n梅的家门口是一条被低矮阴暗的住宅包围的窄巷。但到了巷子出口，街道就宽敞多了。你的右方延伸出一条大街。一块简陋的牌子上写着街道的名字：“锡尔伯里街”。而在左边，顺着灯光可以看见歪歪扭扭的简易篱笆桩，篱笆桩后就看不见地面，只有一片黑暗。你走近了几步，可还是什么也看不见。下面的冷气吹拂着你的脸。这时，本能驱使你向四周张望。", "acts": [{"t": "go", "to": 86, "label": "继续"}]}, "76": {"text": "这种粉末散发的独特气味，令你联想到以前你的一位老教授做过的关于危险草药的演示实验。虽然原料可能不只一种，但你相当肯定这种粉末含有莨菪，具有催眠和致幻的作用。你扑灭了这一小堆粉末，把它分散撒到壁炉的各处。你可以在自己「科学(植物学)」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 58, "label": "要小睡一会"}, {"t": "go", "to": 52, "label": "要彻夜不眠"}], "eff": [{"k": "tick", "v": "科学(植物学)"}]}, "77": {"text": "铁链又松动了一点。你觉得你快要挣脱它了，只要再多一点时间——但同时，你也感觉到自己的双腿在烤焦，火焰攀上了你的夹克，冲刷着你的脸。你意识到，你已经没时间了。你在灯塔上被烧死了。为何不重新尝试呢？选择不同的选项，你也许就能逃脱甚至智胜烬头村的村民了。【剧终】", "end": {"kind": "death", "title": "在灯塔上被烧死"}}, "78": {"text": "你悄悄在烬头村巡回，在不引人注意的地方停下来观察村民们。天色尚早，这个时候的村庄却显得挺忙碌。村民打着呵欠沿路往返穿梭，把整束整束的薪柴搬到他们称作灯塔的地方。你看见已经有两个人影登上灯塔上层，正在整理薪柴。节日的篝火是最引人注目的。但你打算要留在这里看篝火吗？你现在怀疑这里有什么不对劲。村民们正忙于其他事，所以你可以做一些秘密的调查。你也可以毫不留恋，直接出村。", "acts": [{"t": "go", "to": 83, "label": "搜索梅·莱德贝特的卧室"}, {"t": "go", "to": 126, "label": "独自前往村会堂"}, {"t": "go", "to": 219, "label": "仔细勘查工匠的工坊"}, {"t": "go", "to": 29, "label": "窥探灯塔前的活动"}, {"t": "go", "to": 7, "label": "沿东盘山路下山，溜之大吉"}]}, "79": {"text": "你回到道路上，继续向东走。至少，你希望自己仍然在向东走。道路的转弯使人难以辨认方向，而且天色也渐渐暗下来，云彩遮住了星光。看起来天黑之前你无法抵达下个村庄了，而且你的腿脚也已经疲劳。空气已经带上了凉意。", "acts": [{"t": "check", "skill": "聆听", "diff": "hard", "ok": 240, "fail": 234}]}, "80": {"text": "你清清嗓子，开始吟诵你在奇怪书本上找到的仪式，尽力将怪异的音节念得正确。你的脸上翻腾着热浪，明白火焰越来越逼近，但你放下自己的恐慌，集中精力完成吟唱。\n当你说出这些奇怪的字眼时，你发现村民的歌唱改变了，他们也在吟诵咒语。你的内心一震。他们发的声音和你毫无二致！\n火焰爬上你的衣服，你疼痛难忍，苦状万分。你抬头想探出无情的火焰，这一瞬看到的东西使你忘记了自己的痛苦。因为群星自身在坠落——它们从天而降，像雨点一样落到烬头村。\n朦胧中你感觉村民又开始吟诵另外一段咒语。但你的身体已经猛烈燃烧起来，有那么一瞬间，你觉得自己也化作了星辰。尔后，一切都融入白炽之中。\n你在灯塔上被烧死了。\n为何不重新尝试呢？选择不同的选项，你也许就能逃脱甚至智胜烬头村的村民了。\n【剧终】", "end": {"kind": "death", "title": "在灯塔上被烧死"}}, "81": {"text": "没有出版资料论述烬头村的节日，你并不觉得奇怪。文特斯到处拨找，找到了一盒专题文章，这些文章手写在泛黄的纸上，署名是阿尼奥洛夫斯基博士(Dr.Aniolowski)。“我认为这是我父亲的熟人，”文特斯说。\n这篇手稿读起来有些吃力，你读得很慢。阿尼奥洛夫斯基推测，这个节日来源于凯尔特移民带来的原始宗教仪式，这些人还在庆祝古老的五朔节、萨温节、圣布里吉德节和秋收节(Lughnasadah)。还有一些讨论是关于季节的辩论，和一些与烬头村的“校准”有关的间接引文。\n文章正要开始讨论现代的仪式时，在第28页末尾戛然而止，句子都断开了。你问文特斯还有没有后面的页数。\n他说：“没有。后面的可能放错了。也许还在这间藏书室里，但……”他耸耸肩，“我必须花时间做一次彻底的盘点。", "acts": [{"t": "go", "to": 99, "label": "继续"}]}, "82": {"text": "五分钟以后，你才勉强站起身来，一瘸一拐地挪到悬崖边上倚着。你的身影从棚屋后面露出来。两个路过的村民发现了你，跑过来帮忙。他们一人架住你一只胳膊，走回了烬头村高原。你受伤太重，连挣扎的力气都没有。\n一名村妇带你到一间屋子里，处理你的伤口。湿毛巾冰凉的触感让你舒服了一些。但男人们一直站在在旁边守着。村妇处理完后，他们走出房间，锁上了门。\n你抵挡不住疲惫的侵袭。", "acts": [{"t": "go", "to": 108, "label": "继续"}]}, "83": {"text": "尽管梅很热情，可你还是不能相信她。你大大方方地又折回了她的房子。难道还有其他地方能去吗？\n房间里仍然空无一人。你敲敲卧室门，等了一会儿。里面没有动静。你小心地推开了门。\n莱德贝特自己的卧室和你干净的客房形成了鲜明的对比。地板上到处都堆着脏衣服，乱烘烘的被褥上散落着课本和廉价小说。你还看到床沿下面丢着一个陈旧破烂的洋娃娃。", "acts": [{"t": "check", "skill": "侦查", "diff": "regular", "ok": 95, "fail": 89}]}, "84": {"text": "村会堂背靠着锡尔伯里街东头的悬崖。这是你到烬头村以来看见的最大的一座建筑物了。但它现在大门紧闭，还上着锁。你围着它走了一圈，从百叶窗的缝隙向里窥视。看上去里面有一间大厅，大概是用作村民集会；还有较小的配楼，用作办公室和档案室。有一扇窗户被砖头砌死了。你回到大门口后也看不到门口有任何开放时间表。\n一个灰衣女人经过说：“文特斯先生上午不开门，每年这时候都是。下午再来吧。”\n你问办公室里能不能拍电报。\n“不知道。”她耸耸肩，“我们要拍给谁？”\n你得之后才能再来尝试。", "acts": [{"t": "go", "to": 25, "label": "继续"}]}, "85": {"text": "你开始沿小径行走，进展还不错。有几棵爬满青苔的树桩标示着路线，你怀疑这条小径的路线是精心选取的。可是大概十分钟以后，树枝越靠越近，辨认道路向前走变得越来越困难。正当你认为你能看见前方道路出口的时候，你脚底踩了个空。", "acts": [{"t": "check", "skill": "幸运", "diff": "regular", "ok": 91, "fail": 97}]}, "86": {"text": "一个漆黑如墨的身影站在马路中央，大约在你身后20码的位置。它正盯着你。你突然感觉，它会冲向你，然后把你从悬崖边丢下去。太令人不安了。\n黑影看自己被发现，冲进了一条小道。", "acts": [{"t": "go", "to": 100, "label": "要返回莱德贝特的房子确保安全"}, {"t": "go", "to": 121, "label": "要直面黑影"}]}, "87": {"text": "你转过一块庄稼地，发现这男人已经消失了。山脊延伸到西面的远方，边缘最外面连接着一片危险的断崖。你跟丢了他。", "sp": "chase_87", "tail": "你可以进行一次困难「侦查」检定。如果你成功了，前往[181]。否则，放弃追逐前往[160]。", "refs": [160, 181, 187]}, "88": {"text": "你挑出来的科学书籍相当枯燥，后来你换了一本天文书。书里夹着一张太平洋天文学会（旧金山）发放的宣传页，认为太阳系的第四颗行星——火星上可能存在生命。人们普遍认为，尽管这颗行星不像地球一样有湖泊海洋之类的永久水体，但它有随着季节变化而消长的极地冰盖。不仅如此，火星南半球的暗区还有其他的季节变化，颜色会从绿色变成褐色，这可能是植被存在的迹象。虽然大家意见各不一致，但火星仍可能有生命。也许威尔斯的小说并不是那么地牵强附会。\n“您是天文学家吗？”文特斯赞许地点点头。“想要观察夜空，烬头村是理想的地点。这几天，连北落师门也可以看到。从飞马座的右边向下找，您就能在地平线上看到它。我希望我也有一架望远镜。\n（译注：赫伯特·乔治·威尔斯，英国科幻作家。）", "acts": [{"t": "go", "to": 99, "label": "继续"}]}, "89": {"text": "你仔细搜索莱德贝特的抽屉。抽屉里只有一张结婚照还算有点意思。梅的丈夫瘦长结实，脸型方正。虽然他们的姿势很正式，但你还是能看出他们之间的爱意。你突然对自己的闯入感到后悔。而且梅任何时候都有可能回来。\n如果你希望孤注一掷，重新投掷「侦查」检定。）", "sp": "push_89", "tail": "如果你成功了，前往[95]。如果你失败了，前往[101]。如果你不想冒险继续，前往[120]。   （译注：如果你刚才的「侦查」检定掷出大失败，不能孤注一掷。前往[120]。", "refs": [95, 101, 120]}, "90": {"text": "你清清嗓子，开始吟诵你在奇怪书本上找到的仪式，尽力将怪异的音节念得正确。你的脸上翻腾着热浪，明白火焰越来越逼近，但你放下自己的恐慌，集中精力完成吟唱。\n当你说出这些奇怪的字眼时，你发现村民的歌唱改变了，他们也在吟诵咒语。你的手心和太阳穴发出一阵阵奇异的刺痛。\n你正在施放法术。你在本法术中最多可以消耗10点魔法值。如果你的魔法值不足10点，可以在耗尽魔法值之后继续消耗耐久值——但你不能消耗到使耐久值归零。", "sp": "spell_mp", "tail": "决定消耗的点数以后，前往[198]。", "refs": [198]}, "91": {"text": "根须绊住了你的脚踝，你一个趔趄摔倒了。茂密的草丛起到了缓冲作用，你没受什么伤，重新爬了起来。下次有机会的话，你的夹克需要用硬毛刷和海绵好好护理一下。\n你在前方又发现了道路。小径省下的路程并没有你想象的那样多。", "acts": [{"t": "go", "to": 79, "label": "继续"}]}, "92": {"text": "看来悬崖折断了你的身体。你逐渐感觉不到疼痛，意识渐渐远去。\n你跌下烬头村的悬崖后，因伤出血过多而死！\n为何不重新尝试这次冒险呢？不同的选择可能会改变你的故事。\n【剧终】", "end": {"kind": "death", "title": "坠崖 · 失血过多"}}, "93": {"text": "绝望赐予你力量，你猛力拉扯着你觉得铁链上最薄弱的环节。它断了！你丢下铁链，跌跌撞撞地走过一具红布覆盖的尸体，离开围观的村民。你咳嗽不止，头发和眉毛在冒烟。\n你因为火焰受到1D6点耐久值伤害。如果你的耐久值因此归零，你就会失去意识，被烈焰烧死！【剧终】。", "acts": [{"t": "go", "to": 137, "label": "否则"}], "eff": [{"k": "dmg", "v": "1D6"}]}, "94": {"text": "当你拿着破破烂烂的杂志坐下来时，文特斯挑起了一只眉毛，但什么也没说。《幻丽诡谭》上的故事尽是些异想天开：什么轨道上的监牢、囚禁中年妇女的恶魔，还有靠无线电波往来星际的机械蜘蛛。\n你看其中一篇科幻小说入了迷：这篇文章讲了难以捉摸的高跷人大步穿越月球表面下冒着蒸汽的沼泽，沼泽中漂浮的迷人大脑引诱着它们。这荒诞奇异的文章让你愉悦放松，把你当前的困境都丢进了字缝。\n如果你之前损失过理智值，你可以回复1点。", "acts": [{"t": "go", "to": 99, "label": "继续"}], "eff": [{"k": "san", "v": "+1"}]}, "95": {"text": "你在地板上看见了和床腿相对应的拖痕。你费了很大劲才把床拉开。床下铺着一块地毯，地毯的下方是一扇活板门。你打开了它。门下面阴暗的空间大概是地窖。", "acts": [{"t": "go", "to": 114, "label": "要下到地窖"}, {"t": "go", "to": 120, "label": "如果你宁愿放弃"}]}, "96": {"text": "在锡尔伯特街北边，离莱德贝特家不远处，有一座开阔的大院。有节奏的锤击声，好像在告诉你已经到了目的地。\n这座院子是你在烬头村见到的最忙碌的地方。它的周围是一圈工坊。有些是砖石建筑，有些只是简陋的棚屋。有个铁匠停下了他的锤子，将一块发着红光的东西急速塞进凉水桶里。还有个织布工，从织布机上抬起头对你眨了眨眼，就继续摆弄他的梭子。一个陶工、一个雕工和一个木匠各自在自己的位置上工作，互相开着友善的玩笑。\n你在这些工匠之中穿行，和他们谈论他们的工作。最后你提到了出售的问题。他们中有些人会让西拉斯偶尔捎些包裹，有些则完全将产品留给村民使用。你完全没得到关于其他交通方式的消息。", "acts": [{"t": "check", "skill": "心理学", "diff": "regular", "ok": 106, "fail": 25}]}, "97": {"text": "根须绊住了你的脚踝，你重重地扑倒在地。你痛苦地喘息，手臂针刺一般地疼痛。一条枯枝刺破了你的前臂，削出一道约莫三寸长的口子，鲜血滴到草上。\n你在树丛中发现了道路。也许你应该坚持沿道路走，而不是前往未知的地域。\n失去1D3点耐久值。你可以用普通六面骰来投掷：只需要将结果除以二，小数进位。这算是挺严重的伤，但幸运的是它并不足以让你失去意识。\n你可以尝试一次「急救」检定。如果你成功了，回复1点耐久值并在「急救」技能左边的小方框里打勾。", "sp": "first_aid_97", "tail": "然后前往[79]。", "refs": [79]}, "98": {"text": "正当你考虑下一步该去哪里的时候，你看见了一个光头还缺了一只耳朵的村民专注地盯着你。你本能地调转方向。很快，你就见到了其他人从你的面前和两侧冒出：机警的少年、凶神恶煞的中年主妇，还有扛着棍子的男人。他们并不像一开始那样好奇地盯着你，但他们始终监视着你，而且还在逐渐接近。你不能指望同时制服这四个人。", "acts": [{"t": "go", "to": 158, "label": "要尝试绕着建筑物跑使他们跟丢"}, {"t": "go", "to": 164, "label": "要直接逃跑"}]}, "99": {"text": "下午的时间在流逝。你还没彻底完成研读，文特斯就看看窗外，站起身来。他清了清嗓子。", "acts": [{"t": "check", "skill": "信用评级", "diff": "regular", "ok": 111, "fail": 105}]}, "100": {"text": "你沿着狭窄的街道往回逃，拽着油灯不住地摇晃。你回到门前，急速地咚咚敲门。梅看你这么快就回来了也很惊讶。\n她说：“你要是不适应这里的气氛，很快就会累趴的。”\n你关门之前又往回瞥了一眼。那漆黑的身影站在街道尽头的墙边，仍然紧盯着你。可是，是它吗？黑暗会欺骗你的眼睛。你把沉重的门闩插到了顶。\n梅坐回自己的椅子，但她现在眼皮开始打架，打起了呵欠。“不早了，我想我该睡觉了。你想几点钟吃早饭？", "acts": [{"t": "go", "to": 63, "label": "继续"}]}, "101": {"text": "忽然一片阴影笼罩了你。“那么，”梅·莱德贝特说，“你明白的。”\n你试图站起身。但一大群村民从她身后蜂拥而出，瞬间围住了你。你奋力挣扎，但他们的人数占绝对优势，你无从抵抗。很快你就被制服了。", "acts": [{"t": "go", "to": 108, "label": "继续"}]}, "102": {"text": "你说道，自己刚刚在亲戚的远方朋友强烈推荐下，得到了“阿卡姆珍本舆图行”的助理职位。收到录用通知函的时候的那份兴奋，只要想一想那些必须来店一游的文物，你就能回忆起来三分。你心里一阵痒痒；你恨不得马上就开始工作。\n“书，哈？”西拉斯没有再继续对话。你感觉他不像是喜欢读书的人。\n你的「信用评级」技能是20%。\n你的本职技能是：「估价」，「艺术/手艺」（选择一个专业领域），「历史」，「图书馆使用」，「外语」（选择一种），「侦查」，还有「魅惑」、「话术」、「恐吓」、「说服」四项中其中一项。你还可以选择除了「克苏鲁神话」以外的其他任意一项技能作为个人专长。将以下数值分配到各项本职技能当中，写到旁边的大方格里：70%，60%，60%，50%，50%，50%，40%，40%。分配时忽略调查员角色卡上已写出的初始值。", "sp": "career_antiquarian", "tail": "然后前往[128]。", "refs": [128]}, "103": {"text": "你没法保证小径会重新返回你现在走的路。尽管可能绕远，但你还是觉得沿着路走更好。可是你走的时候，总是不安地回头看西沉的太阳。\n十五分钟以后，你经过一片自然形成的空地时，眼睛的余光发现有什么大东西在动。它在三十码外的一棵树下徘徊，和你差不多高，通体漆黑，还长着一对小圆耳朵。你看它的时候，它用后腿站了起来。是一头熊！它似乎对树上挂着的果子特别感兴趣。", "acts": [{"t": "go", "to": 110, "label": "如果你想进一步观察熊"}, {"t": "go", "to": 116, "label": "如果你无动于衷"}, {"t": "go", "to": 122, "label": "如果你慎重行事，慢慢退却"}]}, "104": {"text": "你喝下了杯里的东西。杯里是清凉解渴的水，你咕咚咕咚喝光了它。她见杯子已空，就离开了。你向她讲话，但她已经走出去，关上了门。\n此后，你试图呐喊。你的声音肯定已经传到了外面，但毫无效果。似乎整个村子都无动于衷。", "acts": [{"t": "go", "to": 205, "label": "继续"}]}, "105": {"text": "“恐怕我天黑前有些差事要干，所以今天图书室必须关门了。如果您特别有需要的话，我希望您明天下午再来？”\n你和文特斯先生一起离开了房子，等着他锁上门。你感谢他请你喝咖啡，还有查阅藏书室的书。他走进小巷消失了。你希望明天下午之前你已经离开村子了，但知道这里有一个可以专注的地方总是一件好事。", "acts": [{"t": "go", "to": 180, "label": "继续"}]}, "106": {"text": "有一间工坊是关着门的。当你漫步走近这里时，工匠们会从应答如流变得紧张不安——几乎是强迫的。真有趣。\n你可以在你的「心理学」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 25, "label": "继续"}], "eff": [{"k": "tick", "v": "心理学"}]}, "107": {"text": "是悬崖边的阶梯！你折回村子里。无论你走到哪儿，都有人监视着你。最后，你返回莱德贝特的房子，打了个大大的呵欠。独自呆了一会儿之后，你顺着小巷溜走，在建筑物背后寻找路径。\n你终于找到了位置，把脚伸出崖边，试探着阶梯，尽量不去思考你身下有20英尺深的落差。你抓住悬崖上冰冷的岩石。一步、两步……有人在附近的房子外巡逻，你扭过头去躲避他们的视线。\n六十秒以后，你的脚终于触碰到了地面。附近的棚屋已经全都毁坏了。你轻声慢步走向东边的盘山路。", "acts": [{"t": "go", "to": 152, "label": "继续"}]}, "108": {"text": "窄窗透进的光逐渐变暗，你明白下午已经过去，夜晚即将到来。你的手被反绑在背后，甚至无法在粗糙的床上躺下。一个陌生女人走进来。她脸上满是皱纹，眼睛空洞无神。她并没有把视线朝向你，只是端出一个杯子碰到你嘴边。", "acts": [{"t": "go", "to": 104, "label": "要接受饮料"}, {"t": "go", "to": 113, "label": "要拒绝"}]}, "109": {"text": "你用滑步躲开了年轻人的抓捕。火焰顺着他们的肩膀流淌，引燃了他们的头发。你的面前笼罩着烟雾，腿上在燃烧。你必须立刻离开灯塔。\n你因为火焰受到1D6点耐久值伤害。如果你的耐久值因此归零，你就会失去意识，被烈焰烧死！【剧终】。", "acts": [{"t": "go", "to": 137, "label": "否则"}], "eff": [{"k": "dmg", "v": "1D6"}]}, "110": {"text": "你鬼鬼祟祟地靠近熊，想要在树后保持隐蔽。", "acts": [{"t": "check", "skill": "潜行", "diff": "extreme", "ok": 143, "fail": 129, "fumble": 149}]}, "111": {"text": "他笑道：“我很高兴留您在这里再看半个小时左右。如果没有借书卡，不要带走这里的书。”\n你感谢文特斯的信任，继续读了一会儿。在光线逐渐昏暗时，你在闭塞的房间里开始打呵欠。现在也许该换本书读了。", "acts": [{"t": "check", "skill": "侦查", "diff": "regular", "ok": 118, "fail": 124}]}, "112": {"text": "你敏锐的眼睛在崖壁上搜索了几分钟以后有了发现。这里有一串突出的岩石，中间还夹杂看上去像是人工开凿的豁口。它们连起来就是一道巧妙的隐藏梯子，可以爬下悬崖。无疑，昨晚那个黑影正是使用它来安全下落的。\n你沿着底下的岩盘观察，但只能看见一些土褐色的小棚屋，在你右手边稍远的地方。若不是你马上要永远离开烬头村的话，这倒可以算是个有趣的发现。\n你发现了一个秘密。如果有朝一日你需要爬上或爬下东北方的这段悬崖，这段文字可以为你提供一条线索。到那时，如果你想尝试这道梯子，在你所在的条目号上加100，前往对应的条目。如果新条目看上去不符合剧情，你必须返回原来的条目并继续。\n回复1点理智值。你可以在自己「侦查」技能左边的小方框里打勾。", "sp": "secret_100_found", "tail": "现在前往[192]。", "refs": [107, 187, 192, 212]}, "113": {"text": "你扭过脸去，当她再次尝试的时候，你用头去撞她的手，把杯子打翻在地。清澈的液体洒在地面上。\n老妪轻轻耸耸肩，转身离开了房间。你在她身后呐喊，但她无动于衷。\n你很快就口渴了。", "acts": [{"t": "go", "to": 205, "label": "继续"}]}, "114": {"text": "日光几乎无法照亮下面，但大白天打灯又太容易招人怀疑。你挤进地板下面，四处张望。\n你的第一印象是梅在这里堆放垃圾，因为有各种尺寸的箱子又脏又乱地摞成好几堆。过了几秒钟，你才弄清这些全都是旅行用的行李箱，或者公文包。一共有二十个左右。\n这些东西的含义令你如同挨了当头一棒。但你仍然控制住自己，开始检查行李标签。你数了八个或者九个不同的名字，就再也数不下去了。你连忙爬回卧室，用颤抖的手指关上活板门，将床推回原位。", "acts": [{"t": "go", "to": 120, "label": "继续"}]}, "115": {"text": "空气很是清新，沿路走下山坡令人精神鼓舞。你看到烬头村周围的低地上铺展着庄稼地，在庄稼之中还有些牲畜，但看不到马匹。接下来的旅途你要徒步而行吗？\n再走远一些，道路迂回越过山脊，开始下坡。这里有几间散乱的棚屋，有人在居住的迹象。它们之间的距离相当远。\n在你端详这些棚屋的时候，一扇门打开了，出来一个上了年纪的男人。他身穿一件破烂脏污的外套，但多了一块布；他把这块布扯过头顶，像头巾一样裹起头部。他正这样做的时候看见了你，愣住了。", "acts": [{"t": "check", "skill": "幸运", "diff": "regular", "ok": 127, "fail": 135}]}, "116": {"text": "你屏息凝神看着这头熊。它停下来环视空地。", "acts": [{"t": "check", "skill": "幸运", "diff": "regular", "ok": 136, "fail": 129}]}, "117": {"text": "中央大街上的队伍缓慢而肃穆，除了你骨软筋麻，还在抓着你的人手中挣扎。\n当你看见三具披着红布的人体被扛在前面的时候，你打了个寒战。灯塔靠得越来越近，越来越高大，令人畏惧的轮廓如同乌黑的三角形直刺星空。披红布的人体开始发出低沉的嗡嗡声——你的头脑中不由自主地浮现出“送丧人”这个词。他们手中的火把冒着烟，呛得你直咳嗽。你能感受到脸上的热量。\n当你被押到灯塔前的空旷地时，三个舞者分开人群走出来：都是年轻女孩，手中挥着燃烧的火球，划出壮观的弧线，在夜空中形成数道圆圈。她们依次接近你，用涂黑的手指触碰你的前额。每人在你的左脸颊、右脸颊和前额各亲吻一次，然后在你耳边低语。你的鼻孔里充满了煤油的气味。", "acts": [{"t": "check", "skill": "外貌", "diff": "regular", "ok": 10, "fail": 148}]}, "118": {"text": "你搜寻书架，试图挪开三卷本的《沃波尔简明安第斯人语法》。它纹丝不动，进一步检查之下，你发现这三本书其实是黏在一起，贴在了墙上。这是不是什么隐蔽地加固书架的办法呢？\n你听到大厅里响起了脚步声，本能地离开了这个奇特的发现。\n你可以在自己「侦查」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 124, "label": "继续"}], "eff": [{"k": "tick", "v": "侦查"}]}, "119": {"text": "南边的一群似乎比西边的一群好对付一些。你大步走上前去，说灯塔那边需要他们。他们看上去十分怀疑。你提出由你替他们把守道路，伸手要去拿干草叉。第一个人说：“不，你和我们一起走。”他皱起了猿猴一般的眉毛。", "acts": [{"t": "check", "skill": "话术", "diff": "extreme", "ok": 132, "fail": 139}]}, "120": {"text": "你对烬头村感到越来越不安，今天尤为惶恐。", "acts": [{"t": "go", "to": 98, "label": "你已经试过三个选项——动身离开烬头村（推进时间）", "cond": 3}, {"t": "go", "to": 83, "label": "搜索梅·莱德贝特的卧室"}, {"t": "go", "to": 126, "label": "独自前往村会堂"}, {"t": "go", "to": 219, "label": "仔细勘查工匠的工坊"}, {"t": "go", "to": 29, "label": "窥探灯塔前的活动"}, {"t": "go", "to": 7, "label": "沿东盘山路下山，溜之大吉"}], "hub": {"targets": ["83", "126", "219", "29", "7"], "need": 3, "to": 98}}, "121": {"text": "你接近这身影一步，它就后退一步。一步，两步。它溜进了两座房子之间的小巷。", "acts": [{"t": "check", "skill": "追踪", "diff": "regular", "ok": 141, "fail": 130}]}, "122": {"text": "你听说过熊并没有攻击性，但你现在孤身一人，别人要走几里路才能来救你，为什么要冒险呢？你轻声慢步地挪走了。熊对你完全没表现出兴趣。", "acts": [{"t": "go", "to": 79, "label": "继续"}]}, "123": {"text": "他们把你推回了火堆。狂热和恐惧蒙蔽了他们的双眼。即使火焰在他们身上蔓延、在你的衣服上肆虐，即使热度越来越强烧灼着你的皮肉，即使浓烟令你窒息视野模糊，他们仍然在火焰中紧紧压着你。你的尖叫和他们的混合在一起，直到火焰完成自己的使命。\n你在和两个年轻人的僵持之中被烧死了。\n为何不重新尝试呢？选择不同的选项，你也许就能逃脱甚至智胜烬头村的村民了。\n【剧终】", "end": {"kind": "death", "title": "在火焰中僵持而死"}}, "124": {"text": "门打开了，文特斯重新回到了藏书室。他露出浅浅的满意笑容，视线落到站在书架前面的你身上。他吃吃地笑道：“已经没有想看的了？我们当然也接受捐赠。现在恐怕到关门的时间了。”\n你和文特斯先生一起离开了房子，等着他锁上门。你感谢他请你喝咖啡，还有查阅藏书室的书。他沿着锡尔伯里街离开了。", "acts": [{"t": "go", "to": 180, "label": "继续"}]}, "125": {"text": "你在梅·莱德贝特家的另一头看到一根晾衣绳，上面有些松垮垮皱巴巴的衣服。能用的衣服并不算多，但你把自己的衣服塞起来充当临时的帽子，走路也改成弓腰驼背地拖着脚走。\n你跛着脚走到村子南边的出口，一路上再没有人打量你。那些守卫还守在原地，审视着出入的人。但他们看上去已经开始厌烦了。", "acts": [{"t": "check", "skill": "乔装", "diff": "hard", "ok": 146, "fail": 139}]}, "126": {"text": "你远远离开街道，绕过北边的崖壁，从后面接近了村会堂。它离灯塔不远，你没法在不引人注意的情况下从正门进去。你检查周围的窗户。东边面朝灯塔的窗户被砖砌死了。\n最西边的窗户有一扇百叶窗很松弛，你能打开它，潜进会堂，关上身后的窗子。你跳进村民集会室，悄声慢行；透过昏暗的光线，听着外面村民兴奋的讨论。对面的门上写着“私用”。你没听到门对面有声音，于是推动了门把手。", "acts": [{"t": "go", "to": 133, "label": "继续"}]}, "127": {"text": "这男人仰望村子的方向，视野扫过悬崖的顶部。一瞬间，你看到了他的脸。似乎有什么东西让你不安。然后他转过身，沿着路走远。但这时，他扬起一只手，慢慢地向你招手示意。", "acts": [{"t": "go", "to": 142, "label": "如果你要跟上这个奇怪的人"}, {"t": "go", "to": 160, "label": "如果觉得这不明智"}]}, "128": {"text": "你发现，西拉斯自从和拖拉机发生冲突之后，再没有停站。长途车沿着山坡盘曲上行。但是，当道路攀上了山顶，山下绝佳的美景一览无余地展现在你面前时，你的思绪被打断了。\n色彩斑斓的树叶，铺成了深秋的调色板；一条溪流从谷底蜿蜒流过，又将这调色板打破成两半。远方白山山脉在朦胧的云雾之中若隐若现。极目远眺，视野之中没有一座村庄，甚至连一座小木屋都见不到。你能看到鸟儿在树冠之上翱翔，还能勉强捕捉到两只白尾鹿在水边流连的身影。\n也许你搬家到大城市去是个错误。在这繁盛的大自然当中，你能不能独自生存下去呢？\n你在大多数技能上都有着基础的能力，分别列在调查员角色卡的各项技能名称后面的括号里。比如，你的「攀爬」技能基础是20%，\n「闪避」技能基础值等于你“敏捷”的一半。\n选择四项本职技能以外的技能（同样不可以选择「克苏鲁神话」）。这是你的个人兴趣技能。将这四项技能每项增加20点。\n这个时候你可以为每个技能计算半值和五分之一值，和你对属性的计算方法一致。记得舍去小数。如果你懒得计算，可以不去填，到必要时再计算。或者如果你使用交互PDF角色卡的话，你会发现它已经将所有计算都完成了！", "sp": "interests", "tail": "现在前往[144]。", "refs": [144]}, "129": {"text": "好像有什么东西让熊受了惊。它背朝着你，甩着屁股，蹒跚走进了森林。你等了五分钟，这头熊仍没回来。但对熊这种奇妙的动物，仅仅观察这么一小会儿也是值得的。", "acts": [{"t": "go", "to": 79, "label": "继续"}]}, "130": {"text": "这黑影跑得很快，步伐几乎是悄无声息。你拽着一盏沉重的灯，又身处不熟悉的环境，受到了相当的阻碍。你走出小巷，进了一片满是尘土的院子，再也找不到你追的那个身影的一点痕迹。你四处扒拉了几分钟，但那个身影早就不见了。\n外面有着这样险恶的东西，再在陌生黑暗的街道上散步，显然太不明智了。你返回莱德贝特的房子。梅让你进了屋，坐回到椅子上。很快她开始打起呵欠。“不早了，我想我该睡觉了。你想几点钟吃早饭？", "acts": [{"t": "go", "to": 63, "label": "继续"}]}, "131": {"text": "你在烬头村的街道上闲逛。你觉得你似乎已经了解了这里的每一个角落，每一扇房门。因为根本就没什么角落也没多少房子。当你走到一片开阔地时，头顶的星空毫无保留地展现在你的面前。你家乡有路灯，即便天气晴朗也会妨碍人们观察星空。但在这里，在这片高耸的黑暗里，熟悉的星星之中仿佛布满了散碎的钻石，在闪烁着微光。\n你被这样的奇景吸引，驻足观察了几分钟。当你的视线回到地面上时，你注意到有一个漆黑的身影贴在房子后面。一块松动的石头飞掠过你的身后。还有另一个黑影在小巷里盯着你。", "acts": [{"t": "go", "to": 157, "label": "要返回莱德贝特的房子确保安全"}, {"t": "go", "to": 163, "label": "要直面这些黑影"}]}, "132": {"text": "你的急切令他们信服，一个村民把干草叉递给了你。你走到路中央，拿着草叉摆出哨兵的姿势。几个村民向灯塔慢慢挪过去，还回头看了几次。\n等到他们挪出了视线，你立刻丢掉笨重的叉子，顺东盘山路俯冲而下。", "acts": [{"t": "go", "to": 152, "label": "继续"}]}, "133": {"text": "房间里排满了书籍。角落里是狭小的盥洗室和食品储藏处。你快速搜索了一遍房间的其他部分，但没什么发现，所以你又回到了书架前。光线很暗，你难以看清书脊上的字。这里有什么有用的东西吗？如果你以前检查过这些书架，你可以获得一颗奖励骰。如有需要，可以参阅第二卷第14页获取说明。", "acts": [{"t": "check", "skill": "侦查", "diff": "regular", "ok": 147, "fail": 140}]}, "134": {"text": "长途车突突地响着，在乡间缓慢挪动。车里的气氛令人窒息，每当车转弯的时候，你的肚子里就一阵翻腾。不过司机身边的窗户是开着的，你换了几个座，找到了一个可以让微风吹到脸上的位置。没多久你就放松下来，开始享受旅程，观察着长途车经过的富有古趣的小小村落。在一个村庄，一位体格粗壮的女人上了车，对你礼貌地点点头。到了下一个村庄，她就下车了。\n道路升高了一些，穿越一片又一片的玉米地和果园。树叶正在变色，把树木装点成鲜红、金黄，灿烂缤纷，富有生机。当你快要打起瞌睡的时候，司机开始快速通过一个急弯。\n将你的“体型”和“体质”加到一起并除以10，舍去小数。这是你耐久值(HP)的初始值。在你的调查员角色卡上记下这个值。你的当前耐久值可能增减，但它不太可能超过初始值。\n你还拥有一个幸运值。投掷3颗六面骰子。我们称它为“3D6”。将3D6的结果乘以5得到你的幸运值，将它记在你的角色卡上。投掷1D100。这表示投掷两颗十面骰子，一颗骰子结果为十位，另一颗为个位（必须先指定一颗骰子作十位骰，参见第4页的“角色扮演骰子”获得详细信息）。但《克苏鲁的呼唤》是神秘和恐怖主题的游戏。可能降临到你角色身上的可怕灾难，也是乐趣的一部分。如果每次检定都能通过，你得到的乐趣也未见得比你可能会失败时来得多。", "sp": "dex_start", "tail": "现在你必须要进行一次敏捷检定。如果你投出来的结果等于或小于你的“敏捷”，你的检定就成功了。如果结果大于你的“敏捷”，你的检定就失败了。你可以试图略过检定的过程，直接假设你总能通过检定。如果你通过了“敏捷”检定，前往[261]。如果你没有通过“敏捷”检定，前往[59]。", "refs": [59, 261]}, "135": {"text": "这个怪男人拔腿就跑，沿着山路逃离你。他的步伐一瘸一拐，但步速简直激烈得像发了狂。", "acts": [{"t": "go", "to": 150, "label": "如果你要追逐他"}, {"t": "go", "to": 160, "label": "如果你有更重要的事情要做"}]}, "136": {"text": "这头熊把爪子放上树干，爬上了树，动作敏捷得惊人。它在树杈上稳住身形，开始从枝叶上扯下黑色的果子——大概是李子？——塞进嘴里。\n你看了大概十分钟，这头熊似乎吃腻了，从树上落回地面。它朝空地四周望望，打了个呵欠，甩开屁股迈进了森林当中。\n观察熊是次非常有教育意义的经历。你可以在你的「博物学」技能上永久增加1点。", "acts": [{"t": "go", "to": 79, "label": "继续"}], "eff": [{"k": "skill", "v": ["博物学", 1]}, {"k": "tick", "v": "博物学"}]}, "137": {"text": "你从灯塔另一边的大火中一跃而下。你看见下方陡峭的断崖时心脏瞬间开始狂跳，但你在离悬崖几寸远的地方安全降落了。你打着滚，扑灭了燃烧的衣服。你的肺像已经烧焦了一样，全身没有一处不在灼痛。村民们还在高声歌唱。你端详一下灯塔周围，汹涌的浓烟之中，他们似乎并没注意到你已经不在了。大多数人都在仰望天空。\n你以最快的速度匍匐离开，躲到最近的房子后面寻求掩护。", "acts": [{"t": "go", "to": 156, "label": "继续"}]}, "138": {"text": "过了一会儿，梅回到厨房开始洗涮。要想和露丝说话，你需要让梅离开一会儿。你一边帮她刷盘子，一边考虑计策。没多久，你就想到了一个主意，问起了西拉斯和他村子里的朋友。\n梅眯起眼睛说：“他认识村那头的特洛伊，我不好说他们是朋友；他俩更像是一对欢喜老冤家。但他昨天晚上可能是在特洛伊家过的夜。”\n你问梅可不可以见见特洛伊，问问他西拉斯有没有提到过返回的计划。梅听着半信半疑，问道：“现在就去？”\n现在，不要查看自己的角色卡，决定自己如何让梅信服：是让梅感情用事？还是解释说再耽搁下去自己的事业就会受到影响？或者是让她草率遵从你的决定？请根据自己的选择，分别进行「魅惑」、「说服」或者「话术」检定。", "sp": "skill_trio", "tail": "如果你成功了，前往[145]。如果你失败了，前往[151]。", "refs": [145, 151]}, "139": {"text": "村民可没你想得那么傻。他们捉住你，把你带回了村子中心。", "acts": [{"t": "go", "to": 108, "label": "继续"}]}, "140": {"text": "你发现，在两册书中间，夹着一张烬头村周边的详尽地图。它画出了森林、等高线、东西两条盘山路。虽然地图上没有画出其他村庄，但如果你今天决意离开，它可能也会有用处。\n灯塔四周活动的哐哐声似乎越来越响，每当有说话声离房门太近，你都会下意识地退缩。差不多是原路返回，沿着窗户溜走的时候了。", "acts": [{"t": "go", "to": 120, "label": "继续"}]}, "141": {"text": "这黑影跑得很快，步伐几乎是悄无声息。但你的直觉让你对它紧追不舍。它溜进一片满是尘土的院子，猛然转向拐进了铁栅栏。你步步逼近，它急忙冲进角落里。\n一阵微风吹过，提醒你这里离悬崖边已经很近了。在你奋力追逐时，提灯上闪烁的光芒照亮了悬崖长着草的边缘。你放慢了步伐，留意脚下，以防意外踏入下方的虚空。注视者和你拉开了一点距离，但它没有冲回街巷的迷宫，而是走向了悬崖。你继续逼近。\n漆黑的身影摆了摆头，又一次盯着你。你感觉到短暂的不安，因为它的脸好像有哪里不对劲。\n然后它从悬崖边上跳了下去。\n你的下巴都要被惊掉了。你来到悬崖边，提灯在风中摇晃。昏暗的光照着你身下的崖壁。你是不是把别人吓得跳崖了？你的直觉告诉你不是。但你也没法解释刚才到底发生了什么。如果你失败了，失去1D2点理智值。你可以使用普通六面骰来投掷：1、2、3表示失去1点理智值，4、5、6表示失去2点理智值。你沿路返回莱德贝特的房子，手里抓着的提灯不住地颤抖。当梅注意到你的不安时，她什么也没说。你疲惫至极。", "sp": "san_141", "tail": "进行一次“理智”检定。前往[63]。", "refs": [63]}, "142": {"text": "你绕着庄稼地跟随这个男人。他向上看了一眼，往两块岩石之间一迈步，居然消失了！仔细观察就会发现，有一道狭窄的通道通往悬崖。光线很微弱，刚刚能看清悬崖下有一个自然形成的小山洞。你如果进去，会和这男人很不舒服地贴在一起。", "acts": [{"t": "go", "to": 191, "label": "要跟着他进去"}, {"t": "go", "to": 160, "label": "要保持距离"}]}, "143": {"text": "这头熊把爪子放上树干，爬上了树，动作敏捷得惊人。它在树杈上稳住身形，开始从枝叶上扯下黑色的果子——大概是李子？——塞进嘴里。\n你看了大概十分钟，这头熊似乎吃腻了，从树上落回地面。它朝空地四周望望，打了个呵欠，甩开屁股迈进了森林当中。\n观察熊是次特殊的经历。你可以在你的「博物学」技能上永久增加2点。", "acts": [{"t": "go", "to": 79, "label": "继续"}], "eff": [{"k": "skill", "v": ["博物学", 2]}]}, "144": {"text": "长途车咯吱咯吱地继续行驶，西拉斯又一言不发了。你身后的天色逐渐变暗，随着日落西山，云彩也被染上了一层粉红色。终于，你看到了受人欢迎的景象：坡顶上坐落着一个小村庄。这里和你在照片上见过的奥西皮并不一样。但你也许可以说服西拉斯停一下车，让你伸展伸展腿脚。\n过了几分钟，发动机突然急促地停止，打断了你的沉思。西拉斯皱起眉头，拉了一下变速杆。长途车踉踉跄跄地继续上坡。西拉斯用你察觉不到的声音骂了一句，咬紧牙关，和轮子开始死磕。你们似乎在一点一点地往上挪动，终于抵达了第一座房子，一座粗糙红石头砌成的低矮住宅。西拉斯费力地把车停在路边的一块小空地上。他爬下自己的座位，走到发动机舱那里。如果你选用「汽车驾驶」，你投出的结果需要小于等于技能值。如果你选用「心理学」你需要一次困难成功。这个检定的结果需要小于等于技能值的一半（右上角小方格里的数值）。你只能选择一项技能来检定一次。", "sp": "drive_or_psy", "tail": "你必须选择使用「汽车驾驶」或「心理学」进行一次检定。如果你在「汽车驾驶」的检定成功，前往[174]。如果你在「心理学」的检定获得困难成功，前往[162]。如果你的检定失败，前往[194]。", "refs": [162, 174, 194]}, "145": {"text": "“好吧……我想我几分钟以后就回来。”梅抓起一件外套，走进夜色之中。你等了一会儿，到看不见她以后，才开始敲卧室的门。没有人回答，一片沉默。脚步声从地面传来，门开了几寸宽的一道缝。露丝的两只眼睛透过门缝向外张望，从左边看到右边。你告诉她她妈妈出门了，问她在烦恼什么。这双眼一下就盯住了你。\n她低声说：“是明天，每年都会有的。他们带走了我大。如果他们得手了，也会带走你的。”\n她坚定的目光令你不寒而栗。你反复追问。她到底说的是什么？\n“所有人。每个人。你刚一来，他们就在看着你。你被盯上了。”她的声音十分空洞。“过几年，等我再大一些……他们也会带走我。”\n你听到门外传过来脚步声。露丝眨了一下眼睛，随即碰上了卧室的大门。你回头去晾干碗碟。梅走进来，脱下她的外套。\n“和这男人讲话是白费时间，”她不忿地嘟哝着回到了卧室里。\n你可以在所用技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 157, "label": "继续"}]}, "146": {"text": "你拖着脚走过去的时候，一个守卫对你点点头。你的本能要你赶快逃离，保持这种缓慢的步伐相当费力。但你一直没有加速，直到走上东边的盘山路，才将身上的伪装丢进了烂泥坑。\n你可以在「乔装」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 152, "label": "继续"}], "eff": [{"k": "tick", "v": "乔装"}]}, "147": {"text": "你检查书脊的时候，注意到了书架和北墙之间的距离。从外面看，窗户边缘和墙之间估计足有三四尺。书架覆盖了整面用砖砌住的窗户。\n进一步检查之下，你发现了用粘在书架上的书套制成的巧妙机关。当你向左拉机关的时候，就会有一整段书架向外敞开。灯塔四周活动的哐哐声似乎越来越响，每当有说话声离房门太近，你都会下意识地退缩。", "acts": [{"t": "go", "to": 153, "label": "要调查书架后面"}, {"t": "go", "to": 120, "label": "要关上书架，趁着还早赶快逃离"}]}, "148": {"text": "第一名舞者说：“你的牺牲，会让村子重生；”第二名舞者说：“你为了我们大家，直升云霄；”第三名舞者说：“愿你在这白热之中获得至福。”她们迂回地跳着舞远去，消失在房子后面。", "acts": [{"t": "go", "to": 18, "label": "继续"}]}, "149": {"text": "你在靠近熊的时候失去了平衡，被一棵小树绊倒了。小树树干折断，发出了步枪开火一般的劈裂声。熊扭过头来，用漆黑的眼珠锁定了你。它以惊人的速度向你疾驰而来。这巨兽猛冲起来相当吓人。", "acts": [{"t": "go", "to": 155, "label": "要逃开熊"}, {"t": "go", "to": 173, "label": "要坚守不动"}]}, "150": {"text": "你脱离道路开始追逐这人，感受着野草抓着你的脚。他沿着山脊飞奔，试图躲进一块巨石后面；这巨石正支撑着悬崖之上那座金属建筑物。这个男人的“敏捷”是38。他掷出小于等于19点为困难成功，小于等于7点为极难成功。比较你们两人的成功等级。极难成功胜过困难成功，困难成功胜过常规（普通）成功，常规成功胜过失败。如果成功等级相同，技能值高的人胜出。", "sp": "opposed_man", "tail": "要逮住这个男人，你必须进行一次对抗检定，用你的“敏捷”对抗他的“敏捷”。先进行这个男人的“敏捷”检定，再做你的“敏捷”检定。如果你在对抗检定中胜出，前往[172]。如果你在对抗检定中落败，前往[87]。", "refs": [87, 172]}, "151": {"text": "梅打了个呵欠，摇摇头：“我觉得明天早上去找他才好。我现在必须要管教下露丝。她今天太不让人省心。”她哐当一声把卧室门关上了。", "acts": [{"t": "go", "to": 157, "label": "继续"}]}, "152": {"text": "落日低垂，你向东离开村庄，前往树林中寻求庇护。灯塔戳破地平线，轮廓雄伟壮观。你用最快地速度赶路，直到头上出现了树荫，你才走到路边，稍事休息。\n差不多两小时以后太阳落山了。黑暗的森林也许很吓人，但成功逃离烬头村让你下定决心。你头也不回地走在黑夜中。\n不久之后，你听到了哒哒的马蹄声，向你飞快地接近。马一共有两匹。你激动不已——但它们是从你身后过来的。", "acts": [{"t": "check", "skill": "潜行", "diff": "regular", "ok": 211, "fail": 216}]}, "153": {"text": "你侧身挤进书架后面的暗室。这是个小小的壁龛，大小仅容一人，两边各有一个隐蔽的书架。这种亮度下你没办法看清书名。", "acts": [{"t": "go", "to": 165, "label": "要冒险把悬崖边的窗户打开一点点"}, {"t": "go", "to": 159, "label": "要抓上几本书就离开"}]}, "154": {"text": "你梦见了壁炉里的炉火；跳动的火舌之中，闪烁着明亮耀眼的色彩。最开始火苗很小很小，几乎要用显微镜才看得见，但它越烧越大，越烧越大，最后变成了瞬息万变的炼狱火海，它溢出壁炉，顺着地板延烧，爬上了你的床单……\n你在惊吓之中醒了过来。阳光透过窗帘照进屋里。你起床检查壁炉，眨眨眼驱赶睡意。壁炉是冷的。\n你之前如果受过伤害，睡过这一晚之后可以回复1点耐久值。", "acts": [{"t": "go", "to": 166, "label": "继续"}], "eff": [{"k": "hp", "v": "+1"}]}, "155": {"text": "你慌忙在树丛间攀爬，强行抑制恐惧感，想要回到道路上。熊的“敏捷”是58。它掷出小于等于29点为困难成功，小于等于11点为极难成功。比较你们两方的成功等级。极难成功胜过困难成功，困难成功胜过常规（普通）成功，常规成功胜过失败。如果成功等级相同，技能值高的一方胜出。", "sp": "opposed_bear", "tail": "想要从熊掌下逃脱，你必须用你的“敏捷”和熊的“敏捷”进行一次对抗检定。先进行熊的“敏捷”检定，再做你的“敏捷”检定。如果你在对抗检定中胜出，前往[161]。如果你在对抗检定中落败，前往[167]。", "refs": [161, 167]}, "156": {"text": "所有村民都聚集在灯塔边，马路空荡无人，你可以轻声慢步地远离火场。他们结束之前，你必须离开村子。当你转过街角前往南边的道路时，吟诵似乎在加速。当你来到杂货店的时候，你终于遇到了来烬头村以来第一桩幸运的事。杂货店的墙边停着一辆自行车！你在普罗维登斯曾经学过骑车。你坐上鞍座。你烧伤的皮肉在拒绝着触碰。", "acts": [{"t": "go", "to": 168, "label": "要等等看灯塔会发生什么"}, {"t": "go", "to": 185, "label": "要立即骑车出村"}]}, "157": {"text": "客房里熟悉的陈设似乎愈加狭小。干净的床铺、小巧的衣橱和穿衣镜却令你联想到牢房。你留在烬头村还有什么可做？你的新生活离这里还远得很。你躺在床上，瞪着天花板上的一处裂缝。你回想这一天经历的事情，思考你发现的微末细节。高海拔和新鲜的空气令你倦怠。但你在这里还有安全感吗？", "acts": [{"t": "go", "to": 224, "label": "如果你就这样睡觉"}, {"t": "go", "to": 230, "label": "如果你还不睡"}]}, "158": {"text": "你像箭一样地冲进小巷，突然转弯，拐到完全不同的方向。你身后脚步声响个不停。烬头村狭窄凌乱的小巷头一次为你提供了方便。你尝试迂回奔向南边的东盘山路。", "sp": "sneak_158", "tail": "进行一次「潜行」检定。如果你成功了，你可以在「潜行」技能左边的小方框里打勾，然后前往[7]。如果你失败了，前往[170]。", "refs": [7, 170]}, "159": {"text": "你抓上几本能带走的书，溜出了房子，来到工坊后身的阴影下开始查看这些书。\n其中两三本书用你看不懂的文字书写，你很失望。还有一本看上去像是埃及符号。还有一本细长的手写书，好像是从《翡翠石板》上抄写的东西。但最吸引人的是一本小开本、黑封面的奇怪诗集，封面写着《阿撒托斯及其他》，作者是爱德华·德比，1919年在波士顿出版。你必须藏起其他的大型书，但这本书你可以随身携带。\n德比的诗集需要研读约一星期才能完全掌握。如果你度过此次冒险，你可以阅读[171]得到关于它的更多信息。", "acts": [{"t": "go", "to": 120, "label": "继续"}]}, "160": {"text": "你回到路上，继续你最重要的任务：离开烬头村，前往奥西皮。山脊上的视野很好，你可以从这里看到道路延伸的方向。它随着山峦弯曲，在林地里消失了一段，又再次浮现，继续向远方伸展。当它向第二片林地连接过去的时候，你终于看不到它了。你觉得往最少里说，整个距离都至少有六七英里。一路上既无村庄，又无车马。\n走过去碰碰运气也许值得尝试。天气还很好。但你在尝试之前，还需要不少补给。", "acts": [{"t": "go", "to": 25, "label": "继续"}]}, "161": {"text": "你甩掉了熊，回到道路上，心脏咚咚地锤打着你的胸腔。你又奔跑了几分钟，直到你确认它不再理会你，才停了下来。", "acts": [{"t": "go", "to": 79, "label": "继续"}]}, "162": {"text": "你觉得西拉斯的行动有些不真实。他在演戏。也许他并不像他的行动显示的那样处理不了这次故障，也许这次故障整个儿都是假的。\n如果这是个诡计，为了让你花钱花时间在路上的商店买东西的话，西拉斯会因为你空荡的钱包而非常失望的。\n在你的调查员角色卡上「心理学」左边的小方框里打勾。如果你成功完成了本次冒险，你有机会通过这次和西拉斯的经历，学到一些东西。", "acts": [{"t": "go", "to": 194, "label": "继续"}], "eff": [{"k": "tick", "v": "心理学"}]}, "163": {"text": "你追上一个黑影，大声呼喊。它滑进了阴影之中。等到你转过墙角，它已经不见踪影。你压住怒火，去追另一个黑影。在你接近时，它也融入黑暗。但第一个黑影又从你身后的阴暗院子里浮现出来。\n你可以这样持续追一整晚，但这些监视者对村子的了解比你多得多。你可能已经让他们明白你不会轻易被吓倒了。你疲惫地返回了莱德贝特的房子。", "acts": [{"t": "go", "to": 157, "label": "继续"}]}, "164": {"text": "这些人比你更熟悉村子。你瞅准他们当中最大的空档，一头钻过去。他们紧随其后。你朝南边的路跑过去。你跑到的时候，发现四个村民正在东盘山路口中央把守，明显是守卫。你换个方向，跑向残破的教堂，不住地喘着粗气。\n你从破窗户里溜进教堂，猫腰穿过划分空间的古旧木板，移向另一边的门。这扇门相当完整，长满青苔，而且锁着。\n追你的人有两个已经从窗户爬进了教堂，另外两个从正门进来。\n“投降吧。”男人用棍子嘭嘭地敲击着手掌。“放弃抵抗对你有好处。”\n你几乎没有选择。", "acts": [{"t": "go", "to": 108, "label": "要放弃抵抗"}, {"t": "go", "to": 176, "label": "要弄塌他们头上的一段屋顶"}]}, "165": {"text": "光线照射到房间里，你可以辨认书名了。壁龛里的书和图书室的书有很大区别：这里的书要旧得多，很多都是手写的，更有不少用奇特的文字写成，你根本不认识。仅仅浏览这些奇异的书卷，就足够你在这里花去一星期的时间。但你失败后，可以孤注一掷，重新尝试掷骰。）", "sp": "libuse_push", "tail": "进行一次「图书馆使用」检定。如果你成功了，前往[177]。如果你失败了，前往[184]。如果你的孤注一掷失败，前往[190]。（译注：如果你首次检定掷出大失败，不能孤注一掷。前往[184]。", "refs": [177, 184, 190]}, "166": {"text": "梅的家里好像没有自来水，但有一个陶坛子，里面积了一些水。你在盥洗室梳洗一番，走进屋子里。梅又做了一顿丰盛的早餐，让你安心享用。差不多七点半的时候，你付了钱，打点好行李，准备继续上路。你向梅告别，她祝愿你在阿卡姆工作顺利。\n（译注：每个技能左边只能打一个勾。）", "sp": "overnight", "tail": "如果你昨晚曾在技能检定中成功过，并想进一步勘查后果，前往[178]。否则，前往[192]。另外，这里跳转到[178]还需要你昨晚进行过理智检定。", "refs": [178, 192]}, "167": {"text": "就在你离道路还有差不多十步的时候，熊在你身后几寸远的地方咆哮一声，爪子撕破了你的夹克。\n熊会用双爪攻击，每一爪都是一次单独的攻击。它每次都有35%的概率击中你，造成3D6点伤害。若任一次攻击对你造成的伤害大于等于你最大耐久值的一半，你就受到了重伤。", "acts": [{"t": "go", "to": 179, "label": "在两爪都结算完成后，如果你受到了重伤"}, {"t": "go", "to": 186, "label": "否则"}]}, "168": {"text": "你四下里确认自己没有被监视，就往回看向大道尽头。整个村子的人都在专注地望着灯塔。他们的吟诵升到了狂热的新音调。你不太清楚为什么，但你模糊地感觉到有哪里出了差错。吟诵开始被打断，人群在动摇。然后——\n轰！！有什么白热的东西像雷霆一样劈进灯塔前面的人群，在你的视野里留下一道炽烈的印迹。你觉得自行车下的地面都在震颤。轰！！又有一发坠落附近，火星四射。吟诵支吾不清，逐渐被尖叫声压过。\n火焰扫过灯塔前的建筑物，烟雾顺着街巷翻滚。一个女子脚步蹒跚地走向你，放声哭号。她的手臂上着着火，在墙上不住地拍打着。\n轰！！又一发坠落到你的视线之外，向着村会堂而去。是时候离开了。", "acts": [{"t": "go", "to": 185, "label": "继续"}]}, "169": {"text": "阿博加斯特带着你穿过大道，躲过一座座房子。金属建筑物耸立在道路尽头。他说：“灯塔现在很安静，但它明天就会复活。”\n他领你到了村学校后面的壁凹里，往后扫视一圈，然后坐了下来。你挨着这个伤疤满脸的人，还是感觉不舒服。他抬起一只变形的眼皮。\n“你的时间不多了。听懂我的话。以前我是中转者，也是解密者。但后来文特斯这个蠢材用他的花言巧语改变了一切。来烬头村的东西才不理睬什么语言。那些白痴认为这是人祭仪式！”他向草地上吐了口痰。“这是控制的仪式。他们只懂得咒语，但他们不懂得自己召唤的是什么力量。”他抽了抽鼻子，坐了回去。“他们不懂！你没有时间问这问那。我来告诉你，在一切都要结束的时候，怎样让它终结。你可以把这山丘还给大地，送回四十年前造访过这里的死亡。我自己已经试过了。但……”他垂下头，“我已经没有那种集中力了。咒语很简单；我可以教给你。但你使用时必须有清晰的头脑，我已经失去它很久了。", "acts": [{"t": "go", "to": 175, "label": "如果你想学习这奇怪的咒语"}, {"t": "go", "to": 182, "label": "如果你已经受够阿博加斯特了"}]}, "170": {"text": "你转过一个街角，直接朝那个眼神凶狠的难对付女人冲了过去。她揪过你的肩膀，一下就把你扳倒。少年和拿着棍子的男人一齐冲上来，你很快就被制服了。", "acts": [{"t": "go", "to": 108, "label": "继续"}]}, "171": {"text": "你花了一个星期才学懂德比的诗作。他的诗作表述了宇宙核心的东西：振荡的、吞噬一切的质量，撕裂着宇宙的每一根纤维。它的信使，时而称作无面者，时而称作伏行的混沌，所触之处皆堕入混乱。他的文字风格独特：并非生动的联想，而是无望的揭示。\n学习诗集的时候，你还注意到诗篇之间潜藏的联系，令你开始心绪不宁。如果你成功了，失去1点理智值。如果你失败了，失去1D4点理智值。你可以增加4点「克苏鲁神话」技能。你将再也难以轻松入眠。\n【剧终】", "end": {"kind": "mad", "title": "剧终 · 无望的揭示"}}, "172": {"text": "你逐渐靠近那个男人。他回头怒视着你。“你这混账，”他啐道，放慢了脚步。“你能离开我吗？”\n你向他保证自己对他没有恶意。\n他说：“我们不能在这里说话。跟我来。", "acts": [{"t": "go", "to": 142, "label": "继续"}]}, "173": {"text": "熊并没有被你的勇气打动。它立起身，挥爪向你袭来。\n处理近身战斗时，参照第二卷第18～19页。你需要先阅读第二卷第8页来查询自己的伤害加值。\n参战者中“敏捷”最高的最先行动。你每个战斗轮可以进行一个动作。熊每向你攻击一次，你都可以选择反击（投掷「格斗(斗殴)」）或者闪避（投掷「闪避」）。战斗技能检定是对抗检定：谁的成功度高，谁得手。\n黑熊的“敏捷”为58，耐久值为20。它浓密厚实的皮毛会吸收你每轮造成伤害的前3点。它第一轮会用两只爪子各攻击一次。它的「爪击」技能为35%（半值17%/五分之一值7%），每次攻击成功后都能造成2D6点伤害。第二轮它会用一只爪子攻击并用嘴咬。它的「啃咬」技能是25%（半值12%/五分之一值5%），造成1D8点伤害。第三轮它会再次使用双爪攻击。\n如果你带着小刀或类似的武器，你每次攻击成功都会造成1D4点加上伤害加值点数的伤害。如果你赤手空拳，伤害是1D3点加上伤害加值点数。）", "sp": "combat_bear", "tail": "如果你受了重伤，进行一次“体质”检定。如果你失败了，前往[193]。如果你在三轮结束以后仍然没有倒下，前往[201]。（译注：如果你没有受过重伤但HP归零，前往[193]；如果你将熊的HP归零，前往[201]。", "refs": [193, 201]}, "174": {"text": "你听到的刺耳噪声当然可以表征引擎的故障，但这也可能和选错档位或者离合器故障有关。即使已经连续驾驶了一天，有经验的公交车司机也几乎不可能突然搞错这种事情。\n如果这是个诡计，为了让你花钱花时间在路上的商店买东西的话，西拉斯会因为你空荡的钱包而非常失望的。\n在你的调查员角色卡上「汽车驾驶」左边的小方框里打勾。如果你成功完成了本次冒险，你有机会通过这次和西拉斯的经历，学到一些东西。", "acts": [{"t": "go", "to": 194, "label": "继续"}], "eff": [{"k": "tick", "v": "汽车驾驶"}]}, "175": {"text": "天色已晚，你坐在学校后面的悬崖顶上，跟着一个疯子学他背下来的咒语，颇有脱离现实之感。阿博加斯特小心翼翼地一段一段教你。\n他望了一眼天空。“现在没有用。云挡住了星星。”但他仍然特别留心，不会一次说出整句咒语。它的开头很有韵律，还有各种精巧的设计，但最核心的是重复三次的段落：\nPh'ngluimglw'nafhCthughaFomalhautn'ghaghaanaf'lthagn!Iä!Cthugha!\n最后，阿博加斯特听了你的背诵，点点头。“每个字都要记住。但只要你在这地上还有活路，就千万不要念出它。”\n你发现了一个秘密。如果有朝一日你的状况绝望到需要用到阿博加斯特的仪式，这段文字可以提供你施法的机会。到那时，如果你想尝试，在你所在的条目号上加10，前往对应的条目。阿博加斯特侧回身。", "sp": "learn_spell", "tail": "“它会让你变成和活——”前往[188]。", "refs": [45, 188]}, "176": {"text": "尽管你转来转去寻找薄弱点，但你也知道这个计划过于痴心妄想。不到两天之前你还在长途车上赴任新职，现在你却呆在破教堂里还打算毁了它。\n你在一段塌了一部分的房顶下发现了一根已经弯曲的木柱子。你抓起一段坏掉的铁棍。", "acts": [{"t": "go", "to": 189, "label": "如果你成功了"}, {"t": "go", "to": 183, "label": "如果你失败了"}]}, "177": {"text": "绝大多数的书对你来说都太过晦涩，除非能在好的图书馆驻留多日，否则你根本读不懂。一个厚重的书套吸引了你，书套上压印着一个暗红色的三角形。它的内文字形细长，但版面很洁净，你可以勉强读懂。\n它好像来自一套讨论基本元素的书：全书共有七卷，分别讨论地、水、风、火、盐、硫、汞。这本书讨论的是火。你翻开书页，书里有各种天文图表、炼金符号、引用自但丁的诗句，还有对天罚原理的猜测。\n书的末尾讨论火焰祭祀，还转录了两篇关键仪式：“召唤天之火”和“号令天之火”。你能够记住其中一篇，但是需要时间。这些到底是无稽之谈，还是值得冒险一记呢？\n你可以在「图书馆使用」技能左边的小方框里打勾。\n如果你觉得你已经够走运了，把书放回去然后离开。", "acts": [{"t": "go", "to": 197, "label": "要记住“召唤天之火"}, {"t": "go", "to": 202, "label": "要记住“号令天之火"}, {"t": "go", "to": 120, "label": "继续"}]}, "178": {"text": "你循着昨晚的脚印找过去。在你拖着行李，沿路穿行在北面的悬崖上时，几个村民看着你，向你投去礼貌而好奇的目光。不久你认为你找到了那个地方。你伸出悬崖张望，心脏在胸膛里扑腾扑腾地跳。\n什么都没有。\n借着阳光帮助，你看见悬崖并没有你想象的那样深不见底；它底下是差不多20码深的岩盘。但人若一跤跌下去，肯定会摔个半死。但你没见到尸体，也看不见血迹。", "acts": [{"t": "check", "skill": "侦查", "diff": "regular", "ok": 112, "fail": 192}]}, "179": {"text": "温热的鲜血从你的后背汩汩流出。你一阵头晕目眩。", "acts": [{"t": "check", "skill": "体质", "diff": "regular", "ok": 186, "fail": 193}]}, "180": {"text": "天色渐晚，你回到莱德贝特家，简单地吃了一顿晚饭。梅反常地沉默。吃饭时，露丝轻轻瞟了你几眼，似乎有一种你难以理解的急迫感。吃完饭，梅就拉着女儿回了屋。你在烬头村已经停留将近一整天了，这里从地理到社会无不给你一种闭塞的感觉。这一晚似乎没有什么事可做。如果你之前和人有约，现在是时候赴约了。", "sp": "appointment", "tail": "要到外面眺望星空，前往[131]。要试着和露丝说说话，前往[138]。", "refs": [131, 138, 200]}, "181": {"text": "几乎是巧合之下，你发现两块岩石之间有一道狭窄的通道通往悬崖之内。借着日光，你勉强能发现一片凹进去的石洞，那个男人无声无息地蹲在里面瞪着你。他低吼道：“你这混账，我还没被耍够吗？”不过，他现在看起来平静了一些。", "acts": [{"t": "go", "to": 191, "label": "要进入他的避难所"}, {"t": "go", "to": 160, "label": "如果你不想冒险"}]}, "182": {"text": "你直起身来，阿博加斯特的眼中闪过警惕的神色，迅速化作炽烈的憎恨。他侧身贴近你的脸。“那你走吧。等到那个时候，记得我曾经给过你触碰永恒的机会。我不会再给你第二次。”他沿着东盘山路的方向大步离去了。在你返回莱德贝特的房子时，你觉得自己听到了一阵模糊的男人叫声，虚弱、绝望。但你没法断定声音的方向，而且你在阴暗的巷子里什么也看不见。", "acts": [{"t": "go", "to": 157, "label": "继续"}]}, "183": {"text": "你用尽全力砸向柱子。村民警觉地后退，但在发现你在做无用功以后，就放松了。他们把你逼到了教堂的墙边。你拼命地挥动棍子抵抗了几秒，但他们很快就压制住你，把铁棍从你手上夺走了。", "acts": [{"t": "go", "to": 108, "label": "继续"}]}, "184": {"text": "你被一本小开本、黑封面的奇怪诗集吸引了。它的封面写着《阿撒托斯及其他》，作者是爱德华·德比，1919年在波士顿出版。和其他的书不同，这本书你可以随身携带。\n德比的诗集需要研读约一星期才能完全掌握。如果你度过此次冒险，你可以阅读[171]得到关于它的更多信息。", "acts": [{"t": "go", "to": 120, "label": "继续"}]}, "185": {"text": "回忆起骑车的技能花了一点时间，但在第一个向东的转弯之后，烬头村外的道路一路向山下延伸。你听见头顶上方传来嘶吼和爆响，但你仍然拖着虚弱的身体集中精力保持平衡，不停地蹬着踏板。在整个村庄的恶意下，你已经有太多计划落空了。你头也不回地骑下去。\n二十分钟以后，你感觉没有被追赶的迹象，停在一片山坡的顶上喘口气。你向远处望去，抬头能看见烬头村。似乎整个村子已经化作火海，村子上方的浓烟聚集成灰暗的烟柱，数里之外都清晰可见——但如果这村庄真的和你见到的一样孤独，那么基本没有人能够及时施救。\n你就这样看着村子燃烧，大概停了五分钟。然后你重新蹬上自行车，向文明而行，向黎明而行。\n恭喜！你已经度过了这次冒险。你可以保留自己的角色卡，在其他的《克苏鲁的呼唤》冒险中使用它。如果你在技能左边的方框里打过勾，你可以从经历中得到提升它们的机会。\n【剧终】", "end": {"kind": "win", "title": "逃脱 · 向黎明而行"}}, "186": {"text": "你踉踉跄跄地走到路边，大口喘着粗气。你的双脚发软，几乎要站立不住。你一边跑一边冒险回头瞟。熊好像改变了想法，放弃追击，正在走回林子里。你停下脚步，调整呼吸。\n如果你后背受了伤，你不能有效使用「急救」技能，特别是还有一头敌对的熊在附近。还要再等一等。", "acts": [{"t": "go", "to": 79, "label": "继续"}]}, "187": {"text": "隐蔽的阶梯似乎是很明了的解释。这个人可以爬上阶梯，上到烬头村去。查看悬崖之后，你发现你大概往回走了四十码，但你还能完全看见他。", "acts": [{"t": "go", "to": 181, "label": "如果你成功了"}, {"t": "go", "to": 160, "label": "否则，放弃追逐"}]}, "188": {"text": "一个黑影突然从黑暗中穿出。它伸出手臂抱住阿博加斯特的咽喉，把他向后拽出了壁凹。他抓住那手臂，双脚向虚空踢去。你看见长刀在月色下闪烁的寒光。", "acts": [{"t": "check", "skill": "闪避", "diff": "regular", "ok": 195, "fail": 203}]}, "189": {"text": "你向柱子上弯曲得最厉害的部位猛然砸去。你听到断裂的声音，于是收回武器，又砸了一次。柱子被击垮，喀嚓一声断裂了。你的头顶开始发出雷鸣一般的巨响。你因喜悦而呆住了一瞬间，但追逐你的人不约而同地瞪大眼睛，恐惧地仰视。\n很快，天花板就坠落下来。", "acts": [{"t": "check", "skill": "幸运", "diff": "regular", "ok": 204, "fail": 196}]}, "190": {"text": "村会堂的大门哗啦一声打开，一群村民涌了进来，很快将你团团包围。一个穿西服打领带的中年绅士站在他们身后。\n他慢悠悠地说道：“哦，原来您在这里。我们还一直纳闷您到哪里去了呢。”他轻轻一挥手，村民就把你捉住了。", "acts": [{"t": "go", "to": 108, "label": "继续"}]}, "191": {"text": "你小心翼翼地迈步，挤进嶙峋的岩层之间，钻进了这个隐蔽的小洞，头顶几乎就要撞上低矮的洞顶了。那男人背靠岩壁，盯着你钻进来。然后他拉下了头巾。如果你失败了，失去1点理智值。", "sp": "san_191", "tail": "进行一次“理智”检定。然后前往[199]。", "refs": [199]}, "192": {"text": "你已经厌倦自己拖动沉重的行李了。希望西拉斯能修好长途车，这样你就能继续旅途。他虽然脾气够坏，但这个老司机看起来相当了解自己的车。你停下来看了看表——还早了二十分钟——然后转过了最后一个街角。\n长途车已经不见了。\n你放下行李开始四处搜索，走下坡道，又走上坡道；转过街角，又转回街角，一直不停地寻找。在村头，你也追着漫长的盘山公路找过了。八点钟到了又过去，但长途车连个影子都见不到。\n一个过路的村民看见了你的包。\n“你等公车？我听他天刚亮就走了。他应该三四天以后才回来。要是你没处去，梅·莱德贝特那里有房间可以住。”他向你抬了抬帽沿，漫步走进了村子。\n你低声诅咒着西拉斯。他也许是去找零部件了。但是你怀疑，这只老狐狸是故意把你扔在这里的。", "acts": [{"t": "go", "to": 218, "label": "继续"}]}, "193": {"text": "你的膝盖一软，身体瘫倒在路边几步远的地上。鲜血充满了你的口腔。你翻身的时候，视线正撞到熊的脸，模糊而重叠。它露出利齿，向你扑来——\n你失去了意识，被熊撕碎了。可能性并没有站在你这一边。\n为何不重新尝试这次冒险呢？\n【剧终】", "end": {"kind": "death", "title": "被熊撕碎"}}, "194": {"text": "西拉斯打开了引擎舱盖，把头伸了进去。这块烧热的铁疙瘩砰砰作响，咝咝有声。他把各个部位都戳了几下，然后伸出头来，擦了擦额头，额头上沾上了漆黑的油污。\n“我不知道是哪的问题。也许是油压不行。也许是刚才摔了一下的时候什么东西摔坏了。得两个气缸都凉下来才能修。天也晚了……我觉得我们应该在这里过夜。”他一边用破布擦手一边说。\n你四周的影子都已经很长，空气中也有了寒意。你因为旅途而感到浑身酸痛，在这摇摇晃晃的长途车里过一夜可一点也不好受。西拉斯看出了你的沮丧。\n“这里叫烬头村。别的村子要走好几里。我每星期才来两次。但这里的人都是好人。梅·莱德贝特有间空房。她会让你留宿的。顺着这条巷子，右转，左边第一间房。”\n他挠了挠脸颊，又把头探进发动机舱，往地上吐了口痰。\n“明天早上八点回来找我，再看看车的情况。", "acts": [{"t": "go", "to": 267, "label": "要寻找梅·莱德贝特的房子"}, {"t": "go", "to": 251, "label": "要问西拉斯他在哪里过夜"}, {"t": "go", "to": 257, "label": "要向西拉斯怀疑这次故障"}]}, "195": {"text": "另一个黑影手持某种钝器向你砸来。你一把将它推开，跳起身来寻找更适合防御的位置。\n液体冒出的声音吸引了你的注意力。阿博加斯特用手捂着脖子。血从手指缝里、从他的嘴里淌下来。攻击他的人再次挥刀刺去。沾着血渍的刀刃切破了阿博加斯特紧紧按住颈部的手腕。现在你能看见攻击者的脸，他低着头，脸上涂着焦油一类的东西，眼中燃烧着仇恨。阿博加斯特挡开攻击者，蹒跚转身，更多的血液顺着他的手臂奔流而出。意志力支撑着这个不成人形的老头。他站直身体，抬起一只手。", "sp": "san_195", "tail": "进行一次“理智”检定。如果你成功了，前往[210]。如果你失败了，前往[217]。", "refs": [210, 217]}, "196": {"text": "庞大的重量将你猛然拍到石地板上。你的脖子啪嚓一声折断，头颅也被压得粉碎。\n你被坍塌的教堂屋顶砸死了！这计划虽然大胆，但风险太大了。为何不重新尝试这次冒险呢？\n【剧终】", "end": {"kind": "death", "title": "被坍塌的屋顶砸死"}}, "197": {"text": "你试着把“召唤天之火”的字词记到脑海里。根据说明，它只有在“群星归位时”才能成功。书上有图表来计算日期，但你现在没有时间计算这个。\n整篇咒语需要大概二十秒来朗读，需要一心一意集中精力，而且因为距离过于遥远，对施法者的精力消耗也非常巨大。\n你发现了一个秘密。如果情形适宜，这段文字可以提供你施法的机会。到那时，如果你想尝试这个仪式，在你所在的条目号上加40，前往对应的条目。", "sp": "secret_40", "tail": "现在前往[207]。", "refs": [80, 207]}, "198": {"text": "你感到，而不是看到，星辰从你头上的天顶坠落。你虽然被绑在燃烧的铁链上，却能号令群星。\n你每消耗1点魔法值，就有10%的概率成功——比如消耗6点，就要进行一次成功率60%的检定。检定结果为96～100必然失败。", "sp": "mp_roll", "tail": "比如你消耗了6点魔法值，你要进行一次成功率60%的检定。如果你施放“号令天之火”成功，前往[209]。如果你失败了，前往[65]。", "refs": [65, 209]}, "199": {"text": "男人的脸上有些东西：他从下颌到右眼眶的一带健康但苍白，看上去上了年纪。但左半边则被刺眼的伤疤完全铺满了。他的眼皮耷拉着，上面覆盖着熔融的血肉；半边鼻子也被扯开，留下一个敞口的坑洞。这个丑陋不堪的人用他仅剩的好眼审视着你。\n“我叫阿博加斯特。威拉德·阿博加斯特。猜我不用问你是怎么来的烬头村。", "acts": [{"t": "go", "to": 206, "label": "如果你坚称自己是来参加节日的"}, {"t": "go", "to": 214, "label": "如果你承认西拉斯把你撂到这里了"}]}, "200": {"text": "阿博加斯特并不在约定见面的地点。你等了他十分钟，但他还是没有出现。你骂了一句老怪物，转头返回梅的房子。\n“嘘——。”\n一扇门里面探出一只手，抓住了你的胳膊。你借着星光瞅到那只剩半张脸的面孔，不由得跳了起来。\n“他们有人过来了，”他轻声说道。“看着点儿。和我来。", "acts": [{"t": "go", "to": 169, "label": "继续"}]}, "201": {"text": "熊退后几步，漆黑的眼珠直瞪着你。它从喉咙深处发出低沉的咕哝声，转头蹒跚返回了树林。\n不管怎样，你已经在和熊的搏斗当中活了下来。你可以在你的「格斗(斗殴)」技能左边的小方框里打勾。", "sp": "bear_after", "tail": "如果熊击伤了你，你还可以尝试进行一次「急救」检定，若成功可以回复1点耐久值。现在前往[79]。", "refs": [79]}, "202": {"text": "你试着把“号令天之火”的字词记到脑海里。这篇文字里尽是些奇怪的字眼，至于它们的发音你只能按最靠谱的猜测来。整篇咒语需要大概二十秒来朗读。注释里提供了一些建议：\n“当其热中取水之时，万不可直视其火。欲行其道则务须身心俱入，以免自误于审判之中。”\n你发现了一个秘密。如果情形适宜，这段文字可以提供你施法的机会。到那时，如果你想尝试这个仪式，在你所在的条目号上加50，前往对应的条目。", "sp": "secret_50", "tail": "现在前往[207]。", "refs": [90, 207]}, "203": {"text": "有什么东西砸中了你的太阳穴，打得你晕头转向。你听到阿博加斯特的呼喊，看到刀刃的寒光：一刀、两刀、三刀，刀锋染上了殷红的鲜血。又有什么东西击中了你，在你倒下的时候，火焰从地上燃起，将夜空照得通亮。火光照出了三个黑影……\n（你）受到1D6点伤害。", "acts": [{"t": "go", "to": 45, "label": "继续"}], "eff": [{"k": "dmg", "v": "1D6"}]}, "204": {"text": "屋顶如你所愿向袭击者倾倒过去。它猛撞到地面上，把他们从视野中遮蔽了。你附近的空气翻腾起大量烟尘。你没法仔细辨认情况，但你可以听见苦痛的哀号。而且，不止一声。坍塌使得石墙上裂了个口子。你用精巧的动作挤出了教堂。村民从四面八方往教堂赶来。你匍匐爬到墓碑之间，靠茂盛的杂草掩盖身形，向路口挪去。哨兵也加入了教堂的人群，所以你能沿着东盘山路逃走。", "acts": [{"t": "go", "to": 152, "label": "继续"}]}, "205": {"text": "外面越来越暗，你的小牢房也变黑了。你可以听到房子四周的各种声音，偶尔还会有橘黄的光芒掠过小窗。束缚之下你唯一舒适的姿势可能就是坐在床头，让手臂自然悬垂。你需要集中精力想个办法，想要挣脱束缚明显是不可能了。你搞不明白他们抓住你想要做什么，但有件事你无法忽略——他们用一整天的时间架起了一堆巨大的篝火。", "acts": [{"t": "go", "to": 27, "label": "继续"}]}, "206": {"text": "他那肿胀的嘴唇向上歪了一点点。“哎呀？你从哪儿听说这里的？”你含糊其辞地向他描述了报纸上的一篇报道。“我不读报这么长时间，报纸真的变了。”他的语调里带着些你不喜欢的东西。", "acts": [{"t": "go", "to": 221, "label": "继续"}]}, "207": {"text": "你非常想拿走这本书，但它太大了根本无法裹藏。你把它推回架子里，将书架滑回原位。马上你就听到会堂大门传来钥匙划动的声音。你冲向打开的窗户。", "acts": [{"t": "check", "skill": "敏捷", "diff": "regular", "ok": 213, "fail": 190}]}, "208": {"text": "这带着回响的嗥叫再次响起，这次有什么离你更近的东西在呼应着嗥叫。看起来现在是个逃离地面的好机会。你找到一棵有明显立足点的树，选了大概两人高的一个坚实枝杈。你慢慢挪动上去，可你的衣服并不适合爬树。", "sp": "climb_208", "tail": "进行一次「攀爬」检定。如果你掷出大失败（结果为96或更高），前往[222]。否则前往[228]。", "refs": [222, 228]}, "209": {"text": "群星活了过来。它们从天上看见了你，身处熊熊大火的中心。它们也看见了由灯塔延伸出的烬头村，窄小的高地直面夜空。它们也听见村民开始吟诵你刚刚吟诵过的咒语。失去1D3点理智值。", "sp": "order_stars", "tail": "如果这使你的理智值归零，前往[220]。要号令群星返回原位，前往[255]。要号令群星放你解脱，前往[243]。要号令群星烧尽村民，前往[231]。", "refs": [220, 231, 243, 255]}, "210": {"text": "阿博加斯特用哽咽嘶哑的声音嚎叫着。他的手掌直指前方，手指扭曲成怪异的手势。火焰从他的脚下涌出，化作闪光的蓝色热浪。这火焰像流水般涌出，就如同沿着一束煤油在延烧，直朝两个攻击者而去。火苗饥渴地攀上了他们的衣服，啃噬着他们的皮肉，他们惊叫起来。阿博加斯特单膝跪了下去。火焰的光芒照亮了他惨白的脸。他的头向前倾着；尽管手上震颤不止，眼中却仍然靠着桀骜的意志迸发光芒。\n刺杀者尖叫着四散奔逃，所到之处怪异的光芒映射到屋墙上。转眼人就不见踪影，只余下皮肉烧焦的刺鼻恶臭。草地上还有些小火苗在舞动，但几秒钟后就消失了。阿博加斯特扑倒在地。", "acts": [{"t": "go", "to": 236, "label": "继续"}]}, "211": {"text": "你躲到你能找到最粗的树干后面。两匹马越来越近，马车的车夫举着提灯。马车所过之处，枝干投射出游移的阴影，像迷宫一般在你面前晃动。刹那间你看到了其中一个车夫的脸。他面目憔悴，神色紧张。然后他们一直向东离开了。\n当你确信再也听不到马车的声响时，就继续穿越树林赶路。看起来躲开大路要更加明智一些。\n你可以在「潜行」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 223, "label": "继续"}], "eff": [{"k": "tick", "v": "潜行"}]}, "212": {"text": "你迫不及待地想现在就尝试这道阶梯。但你又想起西拉斯说过，他每星期只来烬头村两次，而且第二次来的时候很可能是往回开的。万一错过长途车，滞留在这里，你就有麻烦了。", "acts": [{"t": "go", "to": 192, "label": "继续"}]}, "213": {"text": "你猛然加速，疾速跑过村会堂；在听到大门打开的一瞬间，跳出了打开的窗户。你没有时间掩饰侵入的迹象，但你认为你还没被发现。", "acts": [{"t": "go", "to": 120, "label": "继续"}]}, "214": {"text": "他那肿胀的嘴唇向下歪了一点点。\n“王八蛋，烂到骨子里了。”他攥紧了拳头。", "acts": [{"t": "go", "to": 221, "label": "继续"}]}, "215": {"text": "虽然在黑暗中一直赶路听起来不怎样，但野兽聚集在树下盘算着杀了你，自己却在树上躲躲藏藏的主意更加让人不快。这条路迟早会领你到下一个村庄。你加快了步伐。", "acts": [{"t": "go", "to": 264, "label": "继续"}]}, "216": {"text": "你躲到你能找到最粗的树干后面。两匹马越来越近，马车的车夫举着提灯。马车所过之处，枝干投射出游移的阴影，像迷宫一般在你面前晃动。\n令你失望的是，一个车夫突然停住了他的马。\n“看！在那儿！”他用手指着你。", "acts": [{"t": "go", "to": 229, "label": "要逃进树林"}, {"t": "go", "to": 235, "label": "要和车夫搏斗"}]}, "217": {"text": "突然有一张面孔逼近你，沾满血渍，还在熊熊燃烧。有人用利爪挠抓着你，撕扯着你的皮肉，他恐惧的眼中有火焰在跳动。你向后退缩——\n（你）失去1D3点理智值。失去1D2点耐久值。", "acts": [{"t": "go", "to": 45, "label": "继续"}], "eff": [{"k": "san", "v": "-1D3"}, {"k": "dmg", "v": "1D2"}]}, "218": {"text": "梅正在洗衣服，看到你回来了有点吃惊。“落下东西了？”当你解释了情况之后，她让你在寻找其他交通方式时，暂时把行李寄存下来。你卸下了重荷，十分感激。\n梅摸摸下巴，眯起双眼：“这村里没人有汽车。也许你能找到有马的人，还有马车装你的行李。我一会儿也四处问问。你可以试着去问村会堂的文特斯先生，他会知道谁愿意借的。或者问问那些工匠。他们的工坊在锡尔伯里街左边第一个门。”她凑过来握住你的双手，“不要担心，不管你有没有钱，我都不会让你睡在马路上的。”\n你谢过梅，转头面向村子。", "acts": [{"t": "go", "to": 6, "label": "继续"}]}, "219": {"text": "你靠近烬头村西北角房子的后面。早上的这个时候你预计工匠的工坊里会有人活动，但那些工作台和铁砧前都根本没有人在工作，只有周围的墙壁在反射你脚步的回声。有一间工坊关着门，挂着锁。你从门缝往里窥探，但什么也看不见。", "acts": [{"t": "go", "to": 225, "label": "要尝试撬开挂锁"}, {"t": "go", "to": 232, "label": "要暴力闯入这间上锁的工坊"}, {"t": "go", "to": 120, "label": "要移动到其他地方"}]}, "220": {"text": "你终于彻悟，你在地球上的存在只不过是个假象，因为你从来都是一颗星星；你隐藏身形行走在人群之中，收敛着自己的光和热，怕把他们统统烧焦。你微笑着直视天空。你在灯塔上被烧死了！为何不重新尝试呢？选择不同的选项，你也许就能逃脱甚至智胜烬头村的村民了。【剧终】", "end": {"kind": "death", "title": "在灯塔上被烧死"}}, "221": {"text": "阿博加斯特用尖锐的目光睨视着你。“你来找我的，嗯？”他抬头望向洞顶。“谁跟你说的我？我不介意，没关系。其实，他们害怕我知道的东西。他们从来不敢正面接触我。可不要落得和老阿博加斯特一样的结局。”他咯咯笑起来。高亢的笑声从浮肿溃烂的嘴唇中发出，显得格外丑陋怪诞。可是他的眼神突然变得像铁一样犀利。“烬头村四十年以前就死了。被火焰毁灭，被星星吞噬。古老的山坡被地狱之火洗了个干净。新生命来到烧焦的土地上，一切周而复始。阿布纳基人知道。”阿博加斯特用衣袖抹了下鼻子。“只是没发生过这种事罢了。火焰被送走了。必须的牺牲推迟了一年，又一年。现在上面的那些家伙——”他用枯瘦的手指向上戳了戳洞顶——“觉得自己是村庄的拯救者。妄想他们可以打败旧日支配者！Iä！Cthugha！”他摇晃着脑袋。“在诡异的万古中他们的小命不过是一眨眼的事。”他的目光里燃烧着狂暴的智慧。但你觉得阿博加斯特可能疯得不轻。只要他情绪有一点变化，他可很容易就能抓起崖壁上松脱的岩石，用它把你的脑壳打得粉碎。", "acts": [{"t": "go", "to": 227, "label": "要问阿博加斯特有关阿布纳基人的事"}, {"t": "go", "to": 237, "label": "要问阿博加斯特有关旧日支配者的事"}, {"t": "go", "to": 245, "label": "要问阿博加斯特有关烬头村村民的事"}, {"t": "go", "to": 253, "label": "要趁还来得及赶快离开"}]}, "222": {"text": "你爬到半截，手从长满青苔的树枝上滑脱，跌落在地。肺里的空气直冲出你的喉咙。受到1点伤害。否则你可以一边留意脆弱的树枝一边继续攀爬。", "sp": "fall_1hp", "tail": "如果你因此而HP归零，前往[13]。前往[228]。", "refs": [13, 228]}, "223": {"text": "你走上一片小山的山顶，歇息片刻确认自己的方位。夕阳西下，在烬头村的后面落山，所以你要朝——当你望向几里外的村庄时，能看到灯塔在燃烧；橘黄色的光芒照亮了夜空，也照亮了四周的树林。翻腾的烟雾直冲天际，群星点缀在深邃的午夜蓝上，就成了闪耀的天篷。\n你对着那里看了几分钟，然后转身回去，继续你的旅程。有一瞬间给你留下了奇怪的印象；你觉得当你转身时，村子上方有一颗星星在移动。\n但那只意味着疯狂。\n恭喜！你已经度过了这次冒险。你可以保留自己的角色卡，在其他的《克苏鲁的呼唤》冒险中使用它。如果你在技能左边的方框里打过勾，你可以从经历中得到提升它们的机会。\n【剧终】", "end": {"kind": "win", "title": "逃脱 · 身后的火光"}}, "224": {"text": "你的眼皮在打架，不管怎么保持清醒你都很快就睡着了。\n你又一次梦见壁炉里的火焰，这里是辉煌的小小剧院，上演着火光的小小戏剧。这火焰似乎没有燃料，几乎是悬浮在空中的。片刻之后，它们来到床边，围到你身旁，把房间填满飘忽不定的色彩：蓝、黄、红、紫。它们在你身上跳动，在你身旁跳动。", "acts": [{"t": "go", "to": 26, "label": "小小的火舌刷过你的皮肉……"}]}, "225": {"text": "你检查了这个挂锁。它很老旧，也不是特别坚固。附近有很多金属碎片可以当作简易开锁器使用。但你真的会开锁吗？", "sp": "lock_225", "tail": "进行一次“锁匠”检定。如果你成功了，在你技能左边的小方框里打勾并前往[244]。如果你失败了，前往[238]。", "refs": [238, 244]}, "226": {"text": "你说道，你要到圣玛丽医院去担任实习医生。这是所顶尖的医院，会接触到各种各样的病人和病例；这使你不仅激动，还有一点点不安。不过，就像你的一位老教授说过的那样，“只有实践才能让人成为专家。”\n“医生，哈？人们总是需要这些家伙。”\n你莫非在西拉斯的声音中听出了不信任的语气？或者只是你多虑了？\n你的「信用评级」技能是30%。\n你的本职技能是：\n「急救」，\n「外语（拉丁文）」，\n「医学」，「心理学」，「科学（生物学）」，「科学（药学）」，你还可以选择除了「克苏鲁神话」以外的其他任意两项技能作为学术专长或个人专长。将以下数值分配到各项本职技能当中，写到旁边的大方格里：70%，60%，60%，50%，50%，50%，40%，40%。分配时忽略调查员角色卡上已写出的初始值。", "sp": "career_doctor", "tail": "然后前往[128]。", "refs": [128]}, "227": {"text": "他皱皱眉：“阿布纳基人？他们了解这片土地，爱护这片土地。他们在指定的时间里和谐地生活在这里。空气、大地、水流和火焰。他们将每天的黎明都当成恩赐，走路都轻声慢步。但我们来了，我们结果了他们。他们的时代结束了。现在我们的也要结束。”\n阿博加斯特用手撩了撩头发。他左边的头发缺了一大片，只有伤疤留在上面。他直起身来。", "acts": [{"t": "go", "to": 259, "label": "继续"}]}, "228": {"text": "你小心翼翼地能爬到见到的最宽阔的树枝上。上面不是很舒服，但在这么高的位置至少你能感觉安全一些。\n夜幕慢慢降临身边。树林发出窸窸窣窣的声响，好像活过来了一样：近处的刨抓声、远处的鸟鸣声，还有树叶轻轻摇动的沙沙声。虽然你已经听天由命，准备好过一个漫长乏味的不眠之夜，但几个小时以后你还是打起了呵欠。你解开腰带把自己的衣服和树枝系在一起，尽量固定住自己的身体，然后闭上了眼睛。", "acts": [{"t": "go", "to": 246, "label": "继续"}]}, "229": {"text": "你在阴翳之中逃亡，枝叶拍打着你的脸颊。你身后亮起提灯的光线，在树干之间摇曳。但你已经无牵无挂、不顾一切，毫不费力就甩掉了他们。最后，你看着他们消失在树林的另一侧。你听到远远传来模糊的骂声，尔后他们就一去不返。", "acts": [{"t": "go", "to": 223, "label": "继续"}]}, "230": {"text": "强大的睡意向你袭来。你不停地眨着眼睛，翻身坐起来，试图思考自己的处境。烬头村的一切东西好像都在阻止你离开。也许唯一的答案是明天天一亮就主动出击，走得越远越好。以后你随时都能回来取走你的财物，就算这些财物都没有了，也没有什么是不可替代、特别值钱的东西。\n房间另一边咯吱响了一下，吸引了你的注意力。\n门把手在慢慢地、悄悄地转动。", "acts": [{"t": "go", "to": 248, "label": "要抓住门把手，把门拉开"}, {"t": "go", "to": 254, "label": "要假装睡下"}]}, "231": {"text": "烟雾飘动了一下，你看到村民们披着披风，脸上涂着荒诞的彩绘，眼睁睁看着你被牺牲。这是些诱骗你、玩弄你、谋杀你的小人。你命令群星送去你的愤怒。\n突然之间如同有万千光点在他们当中散开，从天而降的高热将它们照得透亮，遥远恒星的光辉让它们闪闪发光。村民们的脸上现出惊奇而喜悦的神情，抬起手去触碰光芒——但是，光点碰到什么，什么就开始燃烧。\n恐慌在人群中播散。他们边跑边号叫，皮肉烧得焦黑，从骨骼上剥落；迈向死亡的步伐在地面上刻下灰烬的印痕。没有人不在燃烧。无情的星辰在他们之中穿行，他们无人生还。\n火焰侵蚀着你的身体，你痛苦地颤抖。但你死之前至少做了件欣慰的小事：烬头村永远也不会烧死更多的受害者了。\n你在灯塔上被烧死了。但你用整个村子的人为你做了陪葬！\n【剧终】", "end": {"kind": "death", "title": "在灯塔上被烧死 · 全村陪葬"}}, "232": {"text": "你检查了这间工坊。它的结构完整无缺，但多年的日晒雨淋让木材变得脆弱；你只要猛然冲击就可能把它打破。但你必须手脚利落，如果重复尝试引人注意，就得不偿失了。", "acts": [{"t": "check", "skill": "力量", "diff": "regular", "ok": 244, "fail": 238}]}, "233": {"text": "司机把他的烟卷弹进排水沟，走进了车厢。发动机咳嗽着开始运转。你也上了车，非常庆幸自己至少在旅程开始时是唯一的乘客。你怀着复杂的感情，隔着窗户看着那些早已看厌的街道缓缓退远，慢慢滑到你身后。最初几分钟你还能看见山坡顶上教堂的尖顶，但道路开始下坡，很快连尖顶也看不到了。\n阿卡姆将是你的新家。你会到那里，开始新的生活。\n你在每个属性值的右侧会看见两个小方格。将每个属性值的一半舍去小数，填在右上角的小格里。再将每个属性值的五分之一也舍去小数，填在右下角的小格里。我们后面会用到这些数值。如果你正在使用交互PDF版本的调查员角色卡，你会发现PDF已经为你计算完成了！\n在属性的下面几行你会看到记录理智值和魔法值的示数轨。你的初始理智值等于你的意志值，初始的魔法值等于你刚刚算出意志值的五分之一。在示数轨上圈出对应的数值。", "sp": "derive", "tail": "前往[134]。", "refs": [134]}, "234": {"text": "又一声嗥叫划破黑暗。它和你进入第一片树林时听到的怪异叫声相类，但这次还混入了刺耳的低音，令你直打哆嗦。它似乎在接近。", "acts": [{"t": "go", "to": 208, "label": "要爬上树暂避一宿"}, {"t": "go", "to": 215, "label": "要继续前行"}]}, "235": {"text": "一个车夫下车时出了状况，你对着另一个车夫摆好架势。他是个上年纪的男人，作出以命相搏的眼神。\n处理近身战斗时，参照第二卷第18～19页。你需要先阅读第二卷第8页来查询自己的伤害加值。\n参战者中“敏捷”最高的最先行动。你和车夫每个战斗轮各可进行一个动作。工匠每向你攻击一次，你都可以选择反击（投掷「格斗(斗殴)」）或者闪避（投掷「闪避」）。战斗技能检定是对抗检定：谁的成功度高，谁得手。\n车夫的“敏捷”为31，格斗(斗殴)技能值为30%（半值15%/五分之一值6%），耐久值为9。每轮投掷一次1D6。如果投出单数，他会攻击；如果投出双数，他会闪避你的攻击。他的「闪避」技能为15%（半值7%/五分之一值3%）。他手持一支短棍，能造成1D6点伤害。如果你带着小刀或类似的武器，你每次攻击成功都会造成1D4点加上伤害加值点数的伤害。如果你赤手空拳，伤害是1D3点加上伤害加值点数。车夫的敏捷值原为32，有修正。）", "sp": "combat_driver", "tail": "如果你将他的耐久值减少到4点或更低，前往[241]。如果你的耐久值归零，前往[247]。（译注：如果你因为重伤而昏迷，前往[247]。", "refs": [241, 247]}, "236": {"text": "阿博加斯特伤口的血流已经减缓，成了涓涓细流。他的呼吸既浅浮又短促，你明白他已经没救了。随着生命力的流逝，他的眼皮微微翕动，最终还是合上了。你向他默哀片刻。可是，攻击者还有可能回来。这村子里又有谁值得信任呢？", "acts": [{"t": "go", "to": 242, "label": "要带梅来这里"}, {"t": "go", "to": 157, "label": "要返回莱德贝特的房子，但对这件事闭口不提"}]}, "237": {"text": "阿博加斯特被疤痕覆盖的脸上浮现出病态的狂喜笑容。\n“旧日支配者？风行者、克苏鲁、伏行混沌。你，和其他那些人一样，地上爬来爬去的蚊蠓而已，你觉得你做的事很重要，是吗？你活着就是全部意义了。”他摇摇头。“我们不过是尘土浮沫，风一吹就飘起来，太阳一照就不见了。你什么也不是。我们都什么也不是。”\n他沉默起来。正当你以为他的说教要结束时，他又兴奋起来。\n“在这里你可以离活火焰最近。不是金斯波特人痴迷的那种喷火的绿焰柱。我是说它比地球上所有活物都早！开天辟地时是它点燃了虚空！它有无穷的燃料，无限的耐心。它会烧尽我们所有人！”\n阿博加斯特用手撩了撩头发。他左边的头发缺了一大片，只有伤疤留在上面。他直起身来。\n你可以在你的「克苏鲁神话」技能上永久增加2点。", "acts": [{"t": "go", "to": 259, "label": "继续"}], "eff": [{"k": "cm", "v": 2}]}, "238": {"text": "你从门口连退几步，沮丧着注视着它。嘎吱嘎吱的声音打断了你，有一个人影投射到附近的墙上。有人过来了。你换个方向溜走了。", "acts": [{"t": "go", "to": 120, "label": "继续"}]}, "239": {"text": "你说道，你的职业是记者，靠着在本地报纸上投送的几篇自由稿件获得了《阿卡姆公报》的稳定职位。远离了无趣味的社会专栏和异想天开的故事，绝对是令人欣慰的事！你晓得，《公报》从密斯卡托尼克大学研究员们的最新成果，到本地酒囊饭袋们做出的龌龊丑行，几乎无所不包。不管怎样，这都将是值得你为之全身心投入的工作。\n“写文的？给报纸？”西拉斯显得很困惑，就好像他认为那些故事都是自己凭空出现的一样。\n你的「信用评级」技能是20%。\n你的本职技能是：「艺术/手艺（摄影）」，「历史」，「图书馆使用」，「母语」，「心理学」，还有「魅惑」、「话术」、「恐吓」、「说服」四项中其中一项。你还可以选择除了「克苏鲁神话」以外的其他任意两项技能作为个人专长。\n将以下数值分配到各项本职技能当中，写到旁边的大方格里：70%，60%，60%，50%，50%，50%，40%，40%。分配时忽略调查员角色卡上已写出的初始值。", "sp": "career_reporter", "tail": "然后前往[128]。", "refs": [128]}, "240": {"text": "你听到身后的路上传来什么声音。是沉闷的喀嚓声——可能是枯枝坠落的声音。你停下脚步，但声音并没有再次响起。你往回走了几步，沿路望去，但什么也看不到。\n你可以在「聆听」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 234, "label": "继续"}]}, "241": {"text": "你把第一个车夫打翻在地，气喘吁吁地转过身来面对他的同伴。另一个车夫提起提灯，检查一下倒在地上的朋友，审视着你脸上坚决的表情。然后他回头望向烬头村，左右摆着头，透过树荫观望。\n他说道：“你赢了。我估计现在也已经太晚了。”\n他放下提灯，架起他的同伴，嘿地一下把他搭到马背上。你喘着粗气看着他驾车离开。提灯的光芒越来越暗，最后隐没了。\n你可以在「格斗(斗殴)」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 223, "label": "继续"}]}, "242": {"text": "梅穿着一身朴素的睡衣开了门。你开始讲述关于鲜血和火焰的故事，她愣了一下，几乎马上就退回去，关上卧室门，不让露丝听到。\n她摇摇头：“阿博加斯特？你是着了什么魔，要听他的疯话？”她抓起外套，提上油灯，跟着你穿越夜幕下的村庄。当你们来到现场时，你只能看见草地上的血迹和焦糊印。但没有尸体。\n梅注视着你看了很长时间：“我们明早再详细地谈吧。我不能留下露丝一个人。”她转身离去。\n你没有多少选择余地，只能跟上。", "acts": [{"t": "go", "to": 157, "label": "继续"}]}, "243": {"text": "群星回应了你的号令，降落汇聚在灯塔上。你感到超脱尘世的光荣，你的身体在白炽的光和热中湮灭无存。\n你在世间罕有的炼狱之火中被烧死了！你想再尝试一次吗？\n【剧终】", "end": {"kind": "death", "title": "湮灭于白炽"}}, "244": {"text": "你推开门，走进了工坊。你的脸上有凉风拂过，还能看到屋檐里漏出光线。屋子正中有一块垫高的石板，略带坡度。石板下面有个豁口，表明里面放着什么东西。也许是盆？还有些东西盖着红布，平躺着堆在对面的墙上。看上去……像是人……", "acts": [{"t": "go", "to": 250, "label": "看上去……像是人……要深入调查"}, {"t": "go", "to": 120, "label": "如果你已经看腻了"}]}, "245": {"text": "阿博加斯特的表情扭曲起来，带着疤的脸颊起了皱褶。\n“呸！他们的父母知道真相。他们听过。他们知道自己的结局，也知道自己在结局时的处境。他们理解自己内心的想法，做的都是不能形容的事。现在的人像小孩一样狂妄自大。所有事情都给他们准备好了，他们就以为永远会这样。”他瞪着洞顶。“他们说我要么就滚，要么就死。所以我把古老的咒语也带走了。但记住我说的话。站得越高，摔得越狠。”\n阿博加斯特用手撩了撩头发。他左边的头发缺了一大片，只有伤疤留在上面。他直起身来。", "acts": [{"t": "go", "to": 259, "label": "继续"}]}, "246": {"text": "在你的梦中，树木在挪动位置，它们的根须从地上拔起，拖着步子走到别处，又自己固定下来。这看上去完全正常，甚至算是友善。它们开始发光，是黄绿色的光，还有火舌在舔食——火？树木开始尖叫。\n闪烁的火舌蜿蜒爬上树，朝你扑来。你的腰带成了拴在火葬堆上的累赘。", "sp": "san_246", "tail": "你拼命撕扯着腰带，咳嗽着，浓烟充斥着你的咽喉，令你窒息——进行一次“理智”检定。如果你成功了，前往[252]。如果你失败了，前往[258]。", "refs": [252, 258]}, "247": {"text": "你倒在了落叶和烂泥覆盖的地面上。你晕乎乎的感觉自己被拖到马车旁，搭上了马背。浓郁的动物气味腔充满了你的鼻腔。你在马车上待了一小会儿，感觉十分恶心，意识时断时续……然后马停住了。你在马屁股的间隙看到了奇异的色彩。\n第一个车夫问道：“现在只好这样了，我们要拿这家伙怎么办？”\n“我想我们得把人藏起来。”他的伙伴用不确定的口气回答。\n你用余下的一点力气滑下马背，跌跌撞撞地摸进树林。树干歪歪扭扭地向你迫近，你的双腿没法支撑你走太远。你摔倒了。抓你的两个人哗啦啦穿过枝叶，来到你身后。\n“……别管了。我们走。”\n车夫的声音越来越远，很快你就又听到了马蹄哒哒的响声。你趴在长满青苔的地上，动弹不得。等到早晨，你才挣扎着站起身来，看着晨曦透过树丛，宣示着太阳的升起。\n恭喜！你已经度过了这次冒险。你可以保留自己的角色卡，在其他的《克苏鲁的呼唤》冒险中使用它。如果你在技能左边的方框里打过勾，你可以从经历中得到提升它们的机会。\n【剧终】", "end": {"kind": "survive", "title": "生还 · 林中的清晨"}}, "248": {"text": "你一把拉开门，准备好面对门外的家伙。\n门外的是梅，穿着她的睡衣外套。她警觉地后退了一步。\n她结结巴巴地说：“你看上去……不太对劲，我想看看你是不是不舒服。”\n你向梅保证自己非常健康，看着她回到了自己的卧室。卧室门一关，你就去厨房搬了一把椅子，把它顶在你的房门后面。这样的防御措施也许会令你安心睡上几个小时。", "acts": [{"t": "go", "to": 58, "label": "继续"}]}, "249": {"text": "你没有按通常的方式讲述自己的专业，而是兜了个圈子，只说自己帮助警察解决过各种各样的问题。一想到你得到了布莱克伍德侦探事务所的职位，你的心跳就会稍稍加速。你已经受够了婚姻不忠和银行职员受贿之类的调查；听上去布莱克伍德事务所恰好可以提供机会，让你积累起和真正的坏人斗争的经验。\n西拉斯眯起了眼睛，但什么话也没说。\n你的「信用评级」技能是20%。\n你的本职技能是：「艺术/手艺（摄影）」，「乔装」，「法律」，「图书馆使用」，「心理学」，「侦查」，还有「魅惑」、「话术」、「恐吓」、「说服」四项中其中一项。你还可以选择除了「克苏鲁神话」以外的其他任意一项技能作为学术专长或个人专长。\n将以下数值分配到各项本职技能当中，写到旁边的大方格里：70%，60%，60%，50%，50%，50%，40%，40%。分配时忽略调查员角色卡上已写出的初始值。", "sp": "career_detective", "tail": "然后前往[128]。", "refs": [128]}, "250": {"text": "你走近红布覆盖的人体，唯恐他们会一下子坐起来抓住你。人体有三具。每具人体的脚趾都系着一个标签：\n本杰明·克拉默，1927.1.19\n亚伯拉罕·霍林斯沃思，1927.4.22\n玛利安·菲普斯，1927.8.6\n你掀开苫布的一角。苫布下面毫无疑问是人体，枯瘦如柴，用绷带紧紧包裹。你正在看的是三具尸体。做过防腐的尸体。如果你失败了，失去1D2点理智值。", "sp": "san_250", "tail": "进行一次“理智”检定。前往[256]。", "refs": [256]}, "251": {"text": "你问西拉斯他要怎么办。他烦厌地看了一眼发动机，才回答道：\n“我村里有认识的人。希望他们能还我个人情。不管怎样我都有地方睡，还管早饭。”他注视着自己肮脏的手，“热水澡恐怕指望不上。”你似乎没有什么选择。你从长途车顶取下了自己的行李。你最不希望发生的就是在陌生人的棚屋过了一夜之后，发现自己的全部家当不翼而飞了。", "acts": [{"t": "go", "to": 267, "label": "继续"}]}, "252": {"text": "这里有些东西不太对劲。即使你的手摸到、解开了腰带扣，你头脑中的一点理性还记得这火焰的样子并不自然。而且树不会自己挪动。腰带已经松脱，你从高空坠落。你能看到下面的影子吗？它们从黑暗中出现——失去1D3点耐久值。", "acts": [{"t": "go", "to": 13, "label": "继续"}], "eff": [{"k": "dmg", "v": "1D3"}]}, "253": {"text": "你直起身来，向后退到阳光下。阿博加斯特看着你退出，狂野地微笑。“又是个不敢听下去的家伙。被真相吓坏了。我给你最后一条忠告吧。”他蹲在地下的阴影里，阳光灼到他布满伤疤的脸上。“不要睡觉，陌生人。不要睡觉。", "acts": [{"t": "go", "to": 160, "label": "继续"}]}, "254": {"text": "你悄悄溜回床上侧身躺下，闭上眼睛。门打开的时候，合页也跟着发出响声。然后好一会儿没有动静。屋里响起一阵脚步声，然后又是一阵。这声音很谨慎，像是女人的脚步。你稍等片刻，把眼睛睁开了一条缝。梅正背朝你蹲着。她在壁炉里摆弄着什么东西。", "acts": [{"t": "go", "to": 260, "label": "要和梅对质"}, {"t": "go", "to": 266, "label": "要静观其变"}]}, "255": {"text": "你的命令阻止了群星下落的步伐，它们停滞不前，在村庄上空光芒流转，然后次第开始飘升。你听到村民喘息、倒抽气的声音，突然间一股深深的悲伤袭上你心头。然而，火势丝毫不减，火焰吞噬了你的身体。你在灯塔上被烧死了！\n但是，你确实已经短暂触碰到了超越地球的力量。为何不重新尝试呢？\n【剧终】", "end": {"kind": "death", "title": "在灯塔上被烧死"}}, "256": {"text": "“哟！我看你怎么偷偷摸摸的啊？喜不喜欢你的发现啊？”\n一个结实的村民堵住了屋门，把太阳光差不多都挡住了。你能辨认出深色的围裙和一副大胡子。他向前迈步，抬起了拳头。", "acts": [{"t": "go", "to": 108, "label": "要不战而降"}, {"t": "go", "to": 262, "label": "要和工匠搏斗"}]}, "257": {"text": "你当面对西拉斯讲出你的怀疑。他的脸色阴沉下来，张开嘴露出一口七扭八歪的牙齿。\n“这车跟你们城里货能一样？”他啐道。“我累了一路，你倒享了一路福！想想吧，真是糟透了！”他大步趟到长途车后面，从行李架上扯下你的包裹，把它摔到你脚边的地上。“拿走！我怕你明天早上又要告我偷包！”\n他怒气难平地迈进了黑暗之中。这事本来应该解决得更好的。", "acts": [{"t": "go", "to": 267, "label": "继续"}]}, "258": {"text": "腰带松脱了，你跌入熊熊烈焰之中。地面瞬间撞上了你。\n失去1D2点理智值和1D3点耐久值。", "acts": [{"t": "go", "to": 13, "label": "继续"}], "eff": [{"k": "san", "v": "-1D2"}, {"k": "dmg", "v": "1D3"}]}, "259": {"text": "阿博加斯特在阴影中停顿了一下：“你有以前那些人没有过的东西。也许你能挺过去。如果你想知道更多，今天晚上再来找我。九点钟，在另一边的坟地。”他举起一根枯瘦的手指。“不要被人跟踪了，不然我就不去。这段时间可不是最后决战的时候。”\n阿博加斯特又用袖子抹了抹鼻子。“走吧。他们一直监视着我。还有，陌生人？别想着逃走。你成功不了的。”\n你退回阳光下。阳光刺目，你十分地动摇。\n你发现了一个秘密。今天晚些时候，会有文字提示你去继续之前的约定。到那时，如果你想再和阿博加斯特见面，在你所在的条目号上加20，前往对应的条目。", "sp": "appointment_set", "tail": "现在，前往[160]。", "refs": [160, 200]}, "260": {"text": "你抬起腿下了床，和梅说话。梅吃惊跳了起来。\n她磕磕绊绊地说：“我……我觉得你可能会冷，我想我需要生个火……”\n她在背后用手抹掉了什么东西。\n你盯着她身后看，但壁炉里什么也看不到。\n“我不该吵醒你。对不起。”她着急要走。", "acts": [{"t": "check", "skill": "恐吓", "diff": "regular", "ok": 19, "fail": 32}]}, "261": {"text": "你被一阵绝望的叫喊惊醒了。司机猛打方向盘，长途车跌出了路沿，你感觉自己从座位上往下滑。你紧紧抓住前面的座位，不及时的话，肯定会摔得生疼。长途车发出一声闷响，停了下来。\n现在你才看到发生了什么事。一辆福特森拖拉机停在了路中央，你的司机刚才必须紧急转弯躲避这只铁皮拦路虎。他从座位上跳下马路，对开拖拉机的农民吐出一连串咒骂。\n你花了一会儿工夫才喘过气来。也许你可以帮帮忙？但是司机已经回来了。他往后倒了倒车，绕开了拖拉机，对农民怒目而视。", "acts": [{"t": "go", "to": 71, "label": "继续"}]}, "262": {"text": "你和这个巨汉开始争斗。他的拳头如铁锤一般从暗处砸来。\n处理近身战斗时，参照第二卷第18～19页。你需要先阅读第二卷第8页来查询自己的伤害加值。\n参战者中“敏捷”最高的最先行动。你和工匠每个战斗轮各可进行一个动作。工匠每向你攻击一次，你都可以选择反击（投掷「格斗(斗殴)」）或者闪避（投掷「闪避」）。战斗技能检定是对抗检定：谁的成功度高，谁得手。\n工匠的“敏捷”为41，格斗(斗殴)技能值为35%（半值17%/五分之一值7%），耐久值为12。他每轮会攻击你一次，每次攻击成功会造成1D3+1D4点伤害。\n如果你带着小刀或类似的武器，你每次攻击成功都会造成1D4点加上伤害加值点数的伤害。如果你赤手空拳，伤害是1D3点加上伤害加值点数。\n在第三轮结束后，你可以尝试绕过这个人逃跑。）", "sp": "combat_artisan", "tail": "这需要进行一次困难难度的「闪避」检定，如果你没有检定成功，他会再攻击一次。如果你将他的耐久值减少到6点或更低，前往[268]。如果你的耐久值归零，前往[2]。如果你成功逃跑，前往[12]。（译注：如果你因为重伤而昏迷，前往[2]。", "refs": [2, 12, 268]}, "263": {"text": "两个面有愠色的年轻男人走下了长途车。一个人从头到脚打量了你一遍，才转头离去。司机也下了车，瞟了你一眼，穿过马路进了烟草店。等他回来的时候，他正用泛黄的手指搓着烟卷。他卷完了最后一下，一边伸手寻找火柴盒，一边仔细地观察你。他身材瘦削，约莫五十多岁，身上穿的衬衫有公共汽车公司的徽标，沾着不少污渍。但他的眼神仍然锐利地从深陷的眼眶里透出来。\n“去哪儿？”\n你把你去奥西皮(Ossipee)的票拿给他看。从那里你可以前往罗切斯特、朴次茅斯，再沿海岸线到达纽伯里波特，最后抵达阿卡姆。你也许买得起至少一部分旅程的火车票，否则这将是很多段长途汽车旅程的第一站。\n“嗯——哼。”司机擦着火柴，点燃了他的香烟。他吸了一口，烟头开始闪光。然后他又吐了一口烟，用手指了指车尾。\n“行李架在上边。”\n看看你的调查员角色卡。卡的顶部有八项属性的空位：力量(STR)、体质(CON)、意志(POW)、敏捷(DEX)、外貌(APP)、体形(SIZ)、智力(INT)和教育(EDU)。\n将以下数值分配给各项属性，写在旁边的大方格里：40、50、50、50、60、60、70、80。如果你想了解这些属性的更多信息，请阅读第二卷第7页。\n（译注：奥西皮、罗切斯特、朴次茅斯，美国新罕布什尔州城镇。纽伯里波特，美国马萨诸塞州城镇。）", "sp": "attrs", "tail": "做完这些以后，前往[8]。", "refs": [8]}, "264": {"text": "诡异的嗥叫越来越近。你的前面、后面，都有这种声音。一声嗥叫必然有阴冷的齐声回应，低沉而饥饿。它们的声调奇异而绝望。\n你现在在以最快的速度赶路。你听到自己的呼吸声越来越急促。这片地区的树不够老，支撑不住你的重量。可能你需要跑起来。但你在被迫停步之前，又能跑多久呢——\n一群矮小黑暗的动物从树上溜下来，挡住了前面的路。每个黑影都竖着长长的尖耳朵。它们的双眼在月色下发着荧荧的光。", "acts": [{"t": "check", "skill": "理智", "diff": "regular", "ok": 269, "fail": 5}]}, "265": {"text": "你解释说，你正要加入著名的密斯卡托尼克大学成为研究员。虽然这只是个初级职位，主要任务是教课和辅导，但这所学校久负盛名。谁又知道此后会发生什么呢？参与座谈会、客座演讲甚至加入遍布世界的探险行动？\n“哼。”西拉斯缩了缩鼻子。“我小时候就把书读够了。但我觉得对喜欢学习的人来说，还不错。”\n你的「信用评级」技能是30%。\n你的本职技能是：\n「图书馆使用」，\n「外语」\n（选择一种），「母语」，「心理学」。你还可以选择除了「克苏鲁神话」以外的其他任意四项技能作为学术专长或个人专长。\n将以下数值分配到各项本职技能当中，写到旁边的大方格里：70%，60%，60%，50%，50%，50%，40%，40%。分配时忽略调查员角色卡上已写出的初始值。", "sp": "career_professor", "tail": "然后前往[128]。", "refs": [128]}, "266": {"text": "又过了几秒钟，梅环顾四周，瞟了你几眼。然后，你听到了火柴轻轻划燃的声音。她把火柴丢到壁炉里的什么东西上，踮着脚出了房间。\n你听到她的卧室门关上以后，马上悄悄摸到壁炉前。壁炉里面点着一小堆黑色粉末，最多只有顶针大小。它散发出令人陶醉的烟气。", "sp": "botany_266", "tail": "你可以进行一次困难难度的「科学(植物学)」检定。如果你成功了，前往[76]。你也可以扑灭炉火再睡觉：前往[58]；或者彻夜不眠：前往[52]；或者放松下来，好奇地吸一口烟气：前往[26]。", "refs": [26, 52, 58, 76]}, "267": {"text": "你拖着行李，走过这些阴郁的建筑物。你在车里坐了一整天，感觉疲惫不堪。按照西拉斯说的路走过去，有一座朴素的石板色房顶小楼。房前挂着名牌，上面写着“莱德贝特”，下面有一块洁净的铜牌，上面写着“住宿”。你四周的小巷昏暗无光，但窗户里有一盏灯火在闪烁。\n一阵冷风吹过你的脸颊。你还不想自己的新生活从露宿街头开始。你轻轻敲起了面前饱经风霜的房门。", "acts": [{"t": "go", "to": 4, "label": "继续"}]}, "268": {"text": "激烈的交锋过后，你终于打出致胜一击。他下盘不稳，砰的一声摔到地板上，血从围裙上滴下来。他的眼皮颤抖着。\n你可以在「格斗(斗殴)」技能左边的小方框里打勾。", "acts": [{"t": "go", "to": 20, "label": "要向他盘问防腐尸体的事"}, {"t": "go", "to": 120, "label": "要丢下他前往其他地方调查"}], "eff": [{"k": "tick", "v": "格斗(斗殴)"}]}, "269": {"text": "虽然这些野兽成扇形面对你排开阵势，你的胸中升起黑暗的绝望，但你仍感觉有不对劲的地方。兽群的动作急躁而怪异，不像你想象的捕食者那样耐心地接近。它们越靠越近，绕着你转圈。你听到它们喉咙里发出刺耳的嚓嚓声，闻着它们带着麝香气的浓重气味——\n它们身忽然猛烈燃烧起来。\n你瞠目结舌，烟雾灌进了你的口鼻。这些生物燃烧着，瞪着眼睛，毛皮闪耀着火光，流着涎的下颌里滴落的也是泛红的火浪。它们的嗥叫糅合成嘈杂刺耳的悲鸣，甚至有一只直扑向你，眼睛里满是疯狂的火焰。你想后退一步，却倒呛了一大口令人窒息的烟雾，身体直直倒下——失去1点理智值。", "sp": "san_1_13", "tail": "前往[13]。", "refs": [13]}, "270": {"text": "你身边旋转的火舌突然停在了半空。灯塔周围的人都僵住了，涂着黑颜料的面孔变白剥落，烬头村的上空如同有第二颗太阳突然开始照耀。顷刻之间，人群、村庄、山丘，一切都被摧毁了；它们离绝对的燃烧、烈焰的精华近到不可想象，瞬间就被焚化殆尽。\n尽管你的躯体被禁锢在灯塔上，但你的存在被解放了。你像星火一样直冲宇宙，弹射到广袤无垠的虚空之中。群星从你身边燃烧着掠过，速度快得不可理喻。它们就是你的家园。\n你将永远栖居于此，在这北落师门；火焰流过浩瀚太空，泛起涟漪，传导着宇宙的节奏；行星沿着不可言说的火焰之轮移转倾侧，无不处在活火焰那发条一般精确的混沌当中。\n而在这活火焰中，你将翩翩起舞。\n你以只手之力，将新罕布什尔州上方圆十六英里的一片地区毁了个干净！你也不能幸免。【剧终】", "end": {"kind": "death", "title": "焚尽 · 只手毁灭十六英里"}}}}</script>
<script>

const BASE_SKILLS = {
  "会计":5,"人类学":1,"估价":5,"考古学":1,"魅惑":15,"攀爬":20,"信用评级":0,
  "克苏鲁神话":0,"乔装":5,"闪避":null,"汽车驾驶":20,"电气维修":10,"话术":5,
  "格斗(斗殴)":25,"射击(手枪)":20,"急救":30,"历史":5,"恐吓":15,"跳跃":20,
  "母语":null,"法律":5,"图书馆使用":20,"聆听":20,"锁匠":1,"机械维修":10,
  "医学":1,"博物学":10,"导航":10,"神秘学":5,"说服":10,"精神分析":1,
  "心理学":10,"骑术":5,"科学(生物学)":1,"科学(植物学)":1,"科学(药学)":1,
  "妙手":5,"侦查":25,"潜行":20,"生存":10,"游泳":20,"投掷":20,"追踪":10,
  "艺术/手艺(摄影)":5,"外语(拉丁文)":1,"外语":1
};

/* ---------- 骰子 ---------- */
const ri = n => Math.floor(Math.random()*n)+1;
function rollDice(expr){
  // 支持 1D3 / 1D4 / 2D6 / 1D6 / 1D8 等
  const m = /^(\d*)D(\d+)(?:\+(\d+))?$/.exec(expr);
  if(!m) return 0;
  const cnt = m[1]?parseInt(m[1]):1, sides = parseInt(m[2]), plus = m[3]?parseInt(m[3]):0;
  let t = plus;
  for(let i=0;i<cnt;i++) t += ri(sides);
  return t;
}
function rollD100(mods){
  mods = mods || {};
  const unit = Math.floor(Math.random()*10);
  const n = Math.max(mods.bonus||0, mods.penalty||0);
  const tensRolls = [];
  for(let i=0;i<=n;i++) tensRolls.push(Math.floor(Math.random()*10));
  let tens;
  if((mods.bonus||0) > 0) tens = Math.min.apply(null,tensRolls);
  else if((mods.penalty||0) > 0) tens = Math.max.apply(null,tensRolls);
  else tens = tensRolls[0];
  let val = tens*10 + unit;
  if(val === 0) val = 100;
  return {value:val, tens:tens, unit:unit, tensRolls:tensRolls};
}
const GRADE_RANK = {fumble:0, fail:1, regular:2, hard:3, extreme:4, crit:5};
const GRADE_TXT = {fumble:"大失败", fail:"失败", regular:"常规成功", hard:"困难成功", extreme:"极难成功", crit:"大成功"};
function gradeOf(val, skill){
  if(val === 1) return "crit";
  const fumbleAt = skill < 50 ? 96 : 100;
  if(val >= fumbleAt) return "fumble";
  if(val <= Math.floor(skill/5)) return "extreme";
  if(val <= Math.floor(skill/2)) return "hard";
  if(val <= skill) return "regular";
  return "fail";
}
function needRank(diff){ return diff==="extreme" ? 4 : diff==="hard" ? 3 : 2; }
/* 执行一次技能检定 */
function doCheck(skillName, diff, opts){
  opts = opts || {};
  let val = getSkill(skillName);
  if(opts.double) val *= 2;
  /* 故事模式：骰子不掷了，成败是玩家刚在面板上点的那个。
     成功等级要给到与难度相称的那一档 —— 有些处理器用 grade 而不是 ok 来判断
     （"需要困难成功"那类），一律返回 regular 会让它们走失败分支。 */
  if(S.story && STORY_ANSWER != null){
    const ok = STORY_ANSWER; STORY_ANSWER = null;
    S.checks++; if(ok) S.passes++; S.rolls++;
    const g = ok ? (diff === "extreme" ? "extreme" : diff === "hard" ? "hard" : "regular") : "fail";
    return {roll:null, skill:val, grade:g, ok:ok, diff:diff, name:skillName,
            fumble:false, crit:false, mods:{}, story:true};
  }
  const mods = {};
  if(S.penalty && !opts.ignorePenalty) mods.penalty = 1;
  if(opts.bonus) mods.bonus = (mods.bonus||0) + opts.bonus;
  if(opts.penalty) mods.penalty = (mods.penalty||0) + opts.penalty;
  const r = rollD100(mods);
  const g = gradeOf(r.value, val);
  const ok = GRADE_RANK[g] >= needRank(diff);
  S.checks++; if(ok) S.passes++; S.rolls++;
  return {roll:r, skill:val, grade:g, ok:ok, diff:diff, name:skillName,
          fumble:(g==="fumble"), crit:(g==="crit"), mods:mods};
}
/* 对抗检定 */
function doOpposed(mine, myVal, foeName, foeVal){
  if(S.story && STORY_ANSWER != null){
    const win = STORY_ANSWER; STORY_ANSWER = null;
    S.rolls += 2; S.checks++; if(win) S.passes++;
    return {myRoll:null, myGrade:win?"regular":"fail", myVal:myVal,
            foeRoll:null, foeGrade:win?"fail":"regular", foeVal:foeVal,
            foeName:foeName, win:win, story:true};
  }
  const foeRoll = rollD100({});
  const foeGrade = gradeOf(foeRoll.value, foeVal);
  const myRoll = rollD100(S.penalty?{penalty:1}:{});
  const myGrade = gradeOf(myRoll.value, myVal);
  let win;
  const a = GRADE_RANK[myGrade], b = GRADE_RANK[foeGrade];
  if(a > b) win = true; else if(a < b) win = false; else win = myVal >= foeVal;
  S.rolls += 2; S.checks++;
  return {myRoll:myRoll, myGrade:myGrade, myVal:myVal, foeRoll:foeRoll, foeGrade:foeGrade, foeVal:foeVal, foeName:foeName, win:win};
}
function getSkill(n){
  if(S.skills[n] !== undefined) return S.skills[n];
  const b = BASE_SKILLS[n];
  if(b !== null && b !== undefined) return b;
  if(n === "闪避") return Math.floor((S.attrs.DEX||0)/2);
  if(n === "母语") return S.attrs.EDU||0;
  return 0;
}
function dmgBonus(str, siz){
  const t = (str||0)+(siz||0);
  if(t <= 64) return [0,"0"]; if(t <= 84) return [-1,"-1"]; if(t <= 124) return [ri(4),"1D4"];
  if(t <= 164) return [ri(6),"1D6"]; return [ri(6)*2,"2D6"];
}
const fmtMod = m => (m.bonus?"＋"+m.bonus+"奖励骰 ":"") + (m.penalty?"＋"+m.penalty+"惩罚骰":"");
