const $ = id => document.getElementById(id);
function go(id, opt){
  opt = opt || {};
  if(id == null || !N[id]){ toast("没有通往那里的路。"); return; }
  S.cur = parseInt(id,10);
  if(S.seen.indexOf(S.cur) < 0) S.seen.push(S.cur);
  if(!opt.back){
    S.visited.push(S.cur);
    if(S.visited.length > 400) S.visited.shift();
  }
  render();
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function para(t){
  return t.split(/\n+/).filter(x=>x.trim()).map(p=>{
    let h = esc(p);
    h = h.replace(/“([^”]{1,240})”/g, '<span class="said">“$1”</span>');
    return "<p>"+h+"</p>";
  }).join("");
}

/* ---------- 主渲染 ---------- */
let pending = null;   // 当前节点待执行的动作
let CUR = null;       // 当前节点对象
/* 特殊页局部重绘。左栏要一起刷新 —— 车卡每一步都在改属性/技能/职业，
   只重绘中间那一块，侧栏就会一直停在"尚未骰出属性"。 */
function refreshSp(){
  if(CUR && CUR.sp){ renderSpecial(CUR); drawSide(); }
}
function render(){
  const node = N[S.cur];
  const stage = $("entry");

  // 进入节点时执行一次性效果
  const already = S.effDone && S.effDone[S.cur];
  let effHtml = "";
  if(!already){
    const res = applyEffects(node);
    if(res.length){ effHtml = res.map(x=>'<div class="rule">'+x+'</div>').join(""); }
    S.effDone = S.effDone || {}; S.effDone[S.cur] = 1;
  }

  let head = '<div class="num"><b>条目 '+S.cur+'</b></div>';
  if(S.visited.filter(x=>x===S.cur).length > 1) head += '<div class="revisit">你曾到过这里</div>';

  // 结局节点
  if(node.end){ renderEnd(node, head); drawSide(); return; }

  // 特殊节点
  if(node.sp){ pending = {kind:"sp", id:node.sp}; }
  else { pending = {kind:"acts", acts:node.acts||[]}; }

  stage.innerHTML = head + '<div id="bodyText">' + para(node.text||"") + '</div>'
                  + '<div id="rollBox"></div>' + effHtml
                  + '<div id="spBox"></div>';
  $("scroll").scrollTop = 0;
  CUR = node;

  if(node.sp) renderSpecial(node);
  else renderActs(node);

  const actsEl = $("acts");
  if(actsEl) actsEl.scrollTop = 0;
  updateMore();
  drawSide();
  // 布局落定后再测一次，避免因字体/换行尚未完成而误判"没有下文"
  requestAnimationFrame(updateScrollCue);
  setTimeout(updateScrollCue, 80);
}

/* 选项溢出提示：绝不让"还有选项"变成需要玩家自己猜的事 */
function updateMore(){
  const a = $("acts"), h = $("moreHint");
  if(!a || !h) return;
  const box = a.getBoundingClientRect();
  const below = Array.prototype.filter.call(
      document.querySelectorAll("#actsBox .choice"),
      el => el.getBoundingClientRect().bottom > box.bottom - 3).length;
  if(below > 0){ h.textContent = "↓ 还有 " + below + " 个选项（可滚动 / 直接按数字键）"; h.classList.add("on"); }
  else h.classList.remove("on");
}

/* 正文没读完 / 下方压着东西时的浮标。
   两种情况都在这里判：正文自身溢出（长条目）与 spBox 被折叠线压住。
   另外给没读完的正文加一道底边渐隐 —— 否则最后一行会被面板齐刷刷切掉半截，
   看着像渲染出错，而不是"还能往下滚"。 */
function updateScrollCue(){
  const sc = $("scroll"), cue = $("scrollCue"), sp = $("spBox");
  if(!sc || !cue) return;
  const over = sc.scrollHeight - sc.clientHeight;
  const atBottom = over <= 8 || sc.scrollTop >= over - 10;
  const moreText = over > 8 && !atBottom;

  const fe = $("fadeEdge");
  if(fe){
    /* 渐变条挂在 #main 上、贴着面板顶边。放进 #actsWrap 里会被它的
       overflow:hidden 裁掉 —— 这正是它第一次没出现的原因。 */
    const aw = $("actsWrap");
    fe.style.bottom = (aw ? aw.offsetHeight : 0) + "px";
    fe.classList.toggle("on", moreText);
  }

  let need = false, txt = "";
  if(moreText){ need = true; txt = "↓ 继续阅读"; }
  if(sp && sp.offsetHeight > 120){
    const sr = sc.getBoundingClientRect(), er = sp.getBoundingClientRect();
    if(er.bottom > sr.bottom - 12){ need = true; txt = "↓ 下方还有内容"; }
  }
  if(need) cue.textContent = txt;
  cue.classList.toggle("on", need);
}

/* ---------- 行动按钮 ---------- */
function renderActs(node){
  const box = $("actsBox"), ttl = $("actsTitle");
  const acts = (node.acts||[]).slice();
  let html = "";
  // 计数出口（探索够数才出现）
  acts.forEach(a=>{
    if(a.cond != null){
      const hub = node.hub;
      const cnt = hub ? hub.targets.filter(t=>S.hubSeen.indexOf(String(t)) >= 0).length : 0;
      a.__shown = (cnt >= a.cond);
    }
  });
  if(node._rule) html += '<div class="rule">'+node._rule+'</div>';

  let idx = 0;
  const shown = acts.filter(a=>a.__shown !== false);
  if(node.hub && node.hub.need < 90){
    const hub = node.hub;
    const cnt = hub.targets.filter(t=>S.hubSeen.indexOf(String(t)) >= 0).length;
    html += '<div class="rule">你已探索 '+cnt+' 处'
          + (cnt >= hub.need ? "——<b>该动身了，天黑前得离开这里。</b>" : "（村中还有地方可以走一趟）") + '</div>';
  }
  ttl.innerHTML = (shown.length > 1 ? "抉择" : "继续")
    + (shown.length > 1 ? '<span class="kb">按 ' + (shown.length <= 9 ? "1–" + shown.length : "1–9") + ' 或 ↑↓ 选择</span>' : '');

  if(shown.length === 0){
    html += '<div class="rule">这里没有出口了。若这是意外，可重新开始。</div>'
         +  '<button class="choice warn" data-act="restart"><span class="k">↺</span><span>重新开始</span></button>';
  }
  shown.forEach(a=>{
    if(a.t === "check"){
      const v = getSkill(a.skill);
      const dl = a.diff==="hard"?"困难":a.diff==="extreme"?"极难":"";
      html += '<button class="choice skill" data-ci="'+acts.indexOf(a)+'">'
           +  '<span class="k">检定</span>'
           +  '<span>进行'+dl+'「'+esc(a.skill)+'」检定'
           +  (a.push?' <span class="hl">（可孤注一掷）</span>':'') + '</span>'
           +  '<span class="cost">'+v+'%</span></button>';
    } else if(a.t === "opposed"){
      html += '<button class="choice skill" data-ci="'+acts.indexOf(a)+'">'
           +  '<span class="k">对抗</span><span>'+esc(a.label||("与"+((a.opp||{}).name||"对手")+"对抗"))+'</span></button>';
    } else {
      const seenAlready = HUB_NODES[S.cur] && S.hubSeen.indexOf(String(a.to)) >= 0;
      /* 只有一个出口时不显示"1"，用箭头 —— 编号只在需要按数字键时才有多义 */
      const mark = shown.length > 1 ? String(++idx) : "→";
      html += '<button class="choice" data-ci="'+acts.indexOf(a)+'">'
           +  '<span class="k">'+mark+'</span><span>'+esc(a.label||"继续")+'</span>'
           +  (seenAlready ? '<span class="cost">已探索</span>' : '') + '</button>';
    }
  });
  box.innerHTML = html;
  box.querySelectorAll(".choice").forEach(b=>{
    if(b.dataset.act === "restart"){
      b.onclick = restart;
      return;
    }
    b.onclick = ()=> chooseAct(parseInt(b.dataset.ci,10));
  });
}
function chooseAct(i){
  const node = N[S.cur];
  if(node.sp) return;                        // 特殊节点自己处理
  const acts = node.acts||[];
  const a = acts[i];
  if(!a) return;
  if(a.t === "go"){
    // 村中探索菜单：记录去过哪些地点（原书的“试过几个”机制）
    if(HUB_NODES[S.cur] && S.hubSeen.indexOf(String(a.to)) < 0) S.hubSeen.push(String(a.to));
    return go(a.to);
  }
  if(a.t === "check"){
    /* 故事模式：先把成败交给玩家，选完再重进这里，doCheck 会取走那个结果 */
    if(S.story && STORY_ANSWER == null){
      return askStory(()=>chooseAct(i), "「" + (a.skill||"技能") + "」检定");
    }
    const r = doCheck(a.skill, a.diff, {double:a.double, push:false});
    showRoll(r, null, a);
    if(a.__once) return;
    stepAfterCheck(r, a);
  } else if(a.t === "opposed"){
    // 由特殊节点接管
  }
}
/* 「强行成功」按钮统一外壳：普通检定、特殊节点、对抗检定共用一份，
   免得同一句话在三个地方各写一版。id 固定为 __force，方便各处挂 onclick */
function forceBtnHtml(sub){
  return '<button class="choice force" id="__force"><span class="k">✦</span>'
    + '<span class="lbl"><span>强行成功 —— 按成功的结果继续</span>'
    + '<span class="sub">'+(sub || "这次掷骰作废，直接走成功那条线")+'</span></span></button>';
}

function stepAfterCheck(r, a){
  // 允许玩家点“继续”按钮
  const box = $("actsBox");
  const next = r.ok ? a.ok : a.fail;
  const label = r.ok ? "成功 —— 继续" : "失败 —— 继续";
  let html = '<button class="choice" id="contBtn"><span class="k">'+(r.ok?r.grade==="crit"?"大成功":"成功":(r.grade==="fumble"?"大失败":"失败"))+'</span><span>'+esc(label)+'</span></button>';

/* ---------- 掷骰展示 ---------- */
function showRoll(r, extra, act){
  const box = $("rollBox") || $("entry");
  /* 故事模式没有点数可展示，硬套骰面会让人以为系统掷过了 */
  if(r.story){
    const ok = r.ok;
    const html = '<div class="roll story">'
      + '<div class="rh"><span>'+esc(r.name)+' · 故事模式</span></div>'
      + '<div class="rb"><span class="big v-'+(ok?"ok":"bad")+'">'+(ok?"成":"败")+'</span>'
      + '<span class="verdict v-'+(ok?"regular":"fail")+'">'+GRADE_TXT[r.grade]+'</span>'
      + '<span class="meta">成败由你决定</span></div>'
      + (extra ? '<div class="dmgline">'+extra+'</div>' : "")
      + '</div>';
    const w = document.createElement("div");
    w.innerHTML = html;
    box.appendChild(w);
    scrollRollIntoView(w);
    return;
  }
  let dice = "";
  if(r.roll){
    const tr = r.roll.tensRolls||[];
    if(tr.length > 1){
      const chosen = r.roll.tens;
      const kept = tr.indexOf(chosen);
      tr.forEach((t,i)=>{
        dice += '<div class="die'+(i===kept?"":" drop")+(i===kept?"":"")+'">'+t+'0</div>';
      });
      dice += '<div class="die u">'+r.roll.unit+'</div>';
    } else {
      dice = '<div class="die">'+r.roll.tens+'0</div><div class="die u">'+r.roll.unit+'</div>';
    }
  }
  let html = '<div class="roll">'
    + '<div class="rh"><span>'+esc(r.name)+' 检定'+(r.diff!=="regular"?' · '+(r.diff==="hard"?"困难":"极难"):"")
    + (r.mods&&(r.mods.bonus||r.mods.penalty)?' · '+fmtMod(r.mods):"") + '</span>'
    + '<span class="dice">'+dice+'</span></div>'
    + '<div class="rb"><span class="big v-'+(r.grade==="fail"||r.grade==="fumble"?"bad":"ok")+'">'+(r.roll?r.roll.value:"—")+'</span>'
    + '<span class="verdict v-'+r.grade+'">'+GRADE_TXT[r.grade]+'</span>'
    + '<span class="meta">目标 '+(r.skill<0?"":r.skill)+'% ｜ 常规 ≤'+(r.skill)+' 困难 ≤'+Math.floor(r.skill/2)+' 极难 ≤'+Math.floor(r.skill/5)+'</span></div>';
  if(extra) html += '<div class="dmgline">'+extra+'</div>';
  html += '</div>';
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  box.appendChild(wrap);
  scrollRollIntoView(wrap);
}

/* 掷骰结果几乎总在正文末尾，而正文区底部被选项面板压着 ——
   scrollIntoView 在 #main{overflow:hidden} 这套布局里会被吞掉（实测 scrollTop 纹丝不动），
   于是最关键的“点数／成功等级”正好藏在折叠线下。这里自己算差值，手动补滚。 */
/* 把创建向导的表格滚进视野。263 这一页正文五百多字，属性表整个在折叠线以下，
   玩家点"还有 8 个数值没有分配"却没东西可点时，得把他送到表前面去。 */
function scrollSp(){
  const sc = $("scroll"), sp = $("spBox");
  if(!sc || !sp) return;
  requestAnimationFrame(()=>{
    const over = sp.getBoundingClientRect().top - sc.getBoundingClientRect().top - 10;
    if(over > 0) sc.scrollTop += over;
  });
}

function scrollRollIntoView(el){
  const sc = $("scroll");
  if(!sc) return;
  requestAnimationFrame(()=>{
    const over = el.getBoundingClientRect().bottom - sc.getBoundingClientRect().bottom;
    if(over > 0) sc.scrollTop += over + 12;
  });
}

/* ---------- 效果 ---------- */
function applyEffects(node){
  const out = [];
  (node.eff||[]).forEach(e=>{
    if(e.on === "fail") return;   // 条件效果由特殊节点处理
    out.push(applyOne(e));
  });
  return out.filter(Boolean);
}
function applyOne(e, silent){
  if(e.k === "hp"){
    const v = typeof e.v === "number" ? e.v : parseInt(String(e.v).replace("+",""),10);
    S.hp = Math.max(0, Math.min(S.hpMax, S.hp + v));
    return v>0 ? "你回复了 "+v+" 点耐久值。" : "你失去了 "+Math.abs(v)+" 点耐久值。";
  }
  if(e.k === "san"){
    let n;
    if(typeof e.v === "number"){ n = e.v; }
    else {
      const s = String(e.v).trim();
      if(/^[+-]?\d+$/.test(s)) n = parseInt(s,10);                                  // 固定值，可带符号
      else n = rollDice(s.replace(/^[+-]/,"")) * (s.charAt(0) === "-" ? -1 : 1);    // 骰式（如 "1D3"）
    }
    const cap = S.sanMax > 0 ? S.sanMax : Infinity;
    S.san = Math.max(0, Math.min(cap, S.san + n));
    return n>0 ? "你回复了 "+n+" 点理智值。" : "你失去了 "+Math.abs(n)+" 点理智值。";
  }
  if(e.k === "dmg"){
    let n = e.v;
    if(typeof n === "string"){ n = rollDice(n.replace("-","")); }
    n = Math.abs(n);
    S.hp = Math.max(0, S.hp - n);
    if(S.hp === 0) sDeathFlag = true;
    return "你受到了 "+n+" 点伤害。（耐久 " + S.hp + " / " + S.hpMax + "）";
  }
  if(e.k === "tick"){ S.ticks[e.v] = true; return null; }
  if(e.k === "skill"){
    S.skills[e.v[0]] = getSkill(e.v[0]) + e.v[1];
    return "「"+e.v[0]+"」永久 +"+e.v[1]+"。";
  }
  if(e.k === "cm"){ S.skills["克苏鲁神话"] = getSkill("克苏鲁神话") + e.v; return "「克苏鲁神话」+ "+e.v+"。"; }
  if(e.k === "penalty"){ S.penalty = true; return "今日所有技能检定受一颗惩罚骰。"; }
  return null;
}

const CHARS_KEY = "aaltf_chars";
const FONT_KEY  = "aaltf_font";
/* 三档字体只换正文栈，UI 的 --sans 不受影响，免得按钮跟着一起变形 */
const FONTS = [["song","宋","宋体"],["kai","楷","楷体"],["ya","雅","雅宋"]];

const rndInt  = n => Math.floor(Math.random()*n);
const pickOne = a => a[rndInt(a.length)];
function shuffled(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=rndInt(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function setFont(f, quiet){
  if(!FONTS.some(x=>x[0]===f)) f = "song";

  if(!quiet){

}
function cycleFont(){

/* ---------- 随机属性 / 技能 ---------- */
function randomAttrs(){
  const pool = shuffled(ATTR_POOL);
  const out = {};
  ATTRS.forEach(([k], i)=>{ out[k] = pool[i]; });
  return out;
}
function randomSkills(attrs, career){
  const c = CAREERS[career];
  const need = 1 + (c.free||0);
  const cand = c.pick1.slice();
  Object.keys(BASE_SKILLS).forEach(x=>{
    if(x === "克苏鲁神话") return;
    if(c.job.indexOf(x) >= 0 || cand.indexOf(x) >= 0) return;
    cand.push(x);
  });
  /* pick1 不够填满 need 时（比如教授的 free 有 4 项），从候补里随机补齐 */
  const picks = shuffled(cand).slice(0, need);
  const chosen = c.job.concat(picks);
  const pool = shuffled(MAIN_POOL);
  const sk = {};
  chosen.forEach((x, i)=>{ sk[x] = pool[i] != null ? pool[i] : 50; });
  sk["信用评级"] = c.credit;
  sk["闪避"] = Math.floor(attrs.DEX/2);
  sk["母语"] = attrs.EDU;
  /* 四项兴趣：从还没拿到的技能里随机，各 +20（与 128 页规则一致） */
  const rest = Object.keys(BASE_SKILLS).filter(x=>{
    if(x === "克苏鲁神话" || x === "闪避" || x === "母语") return false;
    return chosen.indexOf(x) < 0 && sk[x] === undefined;
  });
  shuffled(rest).slice(0,4).forEach(x=>{ sk[x] = (BASE_SKILLS[x] || 0) + 20; });
  return {skills:sk, picks:picks, free:rest};
}
const GIVEN = ["埃利亚斯","玛莎","霍华德","艾格尼丝","塞缪尔","克拉拉","奥蒂斯","露西尔",

/* 把一张卡按规则落到当前状态上（随机车卡与载入旧卡共用）。

function applyChar(c, fresh){
  S.attrs = Object.assign({}, c.attrs);
  S.career = c.career;
  S.skills = Object.assign({}, c.skills);
  S.name = c.name || S.name || "";
  S.age = c.age || 25;
  S.hpMax = c.hpMax || Math.floor((S.attrs.CON + S.attrs.SIZ)/10);
  S.sanMax = c.sanMax || S.attrs.POW;
  S.mpMax = c.mpMax || Math.floor(S.attrs.POW/5);
  const pick = (v, max) => (fresh || v == null) ? max : Math.min(v, max);
  S.hp = pick(c.hp, S.hpMax);
  S.san = pick(c.san, S.sanMax);
  S.mp = pick(c.mp, S.mpMax);
  S.luck = c.luck != null ? c.luck : rollDice("3D6")*5;
  const db = dmgBonus(S.attrs.STR, S.attrs.SIZ);
  S.db = db[0]; S.dbTxt = db[1];
  S.autoChar = true;
}

/* 一键随机（整张卡）：属性、职业、本职技能、兴趣技能一次摇完。
   then 不传就留在当前这一步刷新 —— 后面的职业页、兴趣页都有正文与算式说明，
   直接跳到 8 等于把它们吞掉，玩家连自己是什么职业都来不及看清。 */
function randomChar(then){
  const attrs = randomAttrs();
  const career = pickOne(Object.keys(CAREERS));
  const built = randomSkills(attrs, career);
  applyChar({
    name: randomName(), age: 22 + rndInt(24), career: career,
    attrs: attrs, skills: built.skills
  });
  /* 整卡随机不改玩法：故事模式里摇一张卡，仍然是"不掷骰、自选成败" */
  if(!S.mode) S.mode = "classic";
  S.story = S.mode === "story";
  TMP = null;
  rememberChar();
  toast("已生成调查员：" + S.name + "（" + career + "）");
  if(then != null) go(then);
  else if(CUR && CUR.sp) refreshSp();
  else go(8);
}

/* 不车卡：直接给一张随机调查员，从此所有检定由玩家自己定成败。
   属性技能照样生成 —— 侧栏的血量、伤害加值都要有数可算，
   只是"能不能过"这件事不再由骰子说了算。
   仍然从条目 1 读起：那是故事的开头，跳过它等于让人从第二幕进场。 */
function startStory(){
  const attrs = randomAttrs();
  const career = pickOne(Object.keys(CAREERS));
  const built = randomSkills(attrs, career);
  applyChar({name: randomName(), age: 22 + rndInt(24), career: career,
             attrs: attrs, skills: built.skills});
  S.mode = "story"; S.story = true;
  TMP = null;
  rememberChar();
  toast("故事模式：骰子交给你，成败自己定");
  go(1);
}

/* ---------- 人物卡：留在本机，下次直接沿用 ---------- */
function charSnapshot(){
  return {
    ts: Date.now(), name: S.name, career: S.career, age: S.age,
    attrs: S.attrs, skills: S.skills,
    hp: S.hp, hpMax: S.hpMax, san: S.san, sanMax: S.sanMax,
    mp: S.mp, mpMax: S.mpMax, luck: S.luck, db: S.db, dbTxt: S.dbTxt,
    story: !!S.story, cur: S.cur
  };
}
function loadChars(){
  try{ const a = JSON.parse(localStorage.getItem(CHARS_KEY)); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function saveChars(list){
  try{ localStorage.setItem(CHARS_KEY, JSON.stringify(list.slice(0,8))); }catch(e){}
}
/* 同一个调查员（职业+名字）只留最新的一份，避免存档刷一次就多一条 */
function rememberChar(){
  if(!S.career || !S.attrs || !S.attrs.STR) return;
  const list = loadChars();
  const i = list.findIndex(x=>x && x.name === S.name && x.career === S.career);
  if(i >= 0) list.splice(i,1);
  list.unshift(charSnapshot());
  saveChars(list);
}
function fmtDate(ts){
  const d = new Date(ts || Date.now());
  const p = n => String(n).padStart(2,"0");
  return (d.getMonth()+1) + "月" + d.getDate() + "日 " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function exportChar(){
  if(!S.career){ toast("先建一个调查员再导出。"); return; }
  const blob = new Blob([JSON.stringify({v:1, char:charSnapshot()}, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "调查员-" + (S.name || "无名") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("人物卡已导出。");
}
function importChar(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const o = JSON.parse(fr.result);
      const c = o.char || (Array.isArray(o) ? o[0] : o);
      if(!c || !c.attrs || !c.career) throw new Error("不是人物卡文件");
      applyChar(c);
      TMP = null;
      rememberChar();
      toast("已导入：" + (c.name || "无名") + "（" + c.career + "）");
      go(8);
    }catch(e){ toast("导入失败：" + e.message); }
  };
  fr.readAsText(file);
}

let STORY_RUN = null;      // 待执行的检定处理器
let STORY_ANSWER = null;   // 玩家刚选的结果，下一次 doCheck/doOpposed 取走

/* 把"先选成败、再执行原处理器"做成一步。
   run 里第一句必然是 doCheck/doOpposed —— 所以先记下它，选完再调用一次即可，
   不需要把 25 处检定各写一版。 */
function askStory(run, label){
  STORY_RUN = run;
  const box = $("actsBox");
  const who = label ? '<div class="storyq">'+esc(label)+'</div>' : "";
  box.innerHTML = who
    + '<div class="storyPick">'
    + '<button class="choice ohline" id="__ok"><span class="k">成</span>'
    + '<span class="lbl"><span>判定成功</span><span class="sub">按成功的结果继续</span></span></button>'
    + '<button class="choice badline" id="__no"><span class="k">败</span>'

    + '</div>';

  $("__no").onclick = fire(false);

}

const SP = {};

/* ---------- 通用 UI 渲染 ---------- */
function renderSpecial(node){
  const sp = $("spBox");
  sp.innerHTML = "";
  const fn = SP[node.sp];
  const r = (fn ? fn(node) : {buttons:[]}) || {buttons:[]};
  const box = $("actsBox");
  $("actsTitle").innerHTML = (r.title || "行动")
    + ((r.buttons && r.buttons.length > 1)
        ? '<span class="kb">按 1–' + Math.min(r.buttons.length, 9) + ' 或 ↑↓ 选择</span>' : '');
  /* 兜底说明只在"这一页没有按钮"时才补：有按钮的页面再顶一句
     "此条目为规则说明"纯属噪音（158 那类检定页就是这样）。 */
  if(!sp.innerHTML && (!r.buttons || !r.buttons.length)){
    sp.innerHTML = '<div class="rule">'+(r.sc || r.hint || "（此条目为规则说明，按提示继续。）")+'</div>';
  }
  /* 快捷区属于「创建向导」这一步的入口，跟着 special 一起渲染，
     放在操作面板顶部 —— 无论正文多长，它都在第一屏 */
  const qs = $("quickSlot");
  if(qs) qs.innerHTML = r.quick || "";
  if(r.quick) bindQuick();
  if(!r.buttons || !r.buttons.length){
    if(!r.keep) box.innerHTML = "";
    return;
  }
  box.innerHTML = r.buttons.map((b,i)=>
    '<button class="choice '+(b.cls||"")+'" data-bi="'+i+'">'
    + '<span class="k">'+(b.k||"→")+'</span>'
    + '<span class="lbl"><span>'+esc(b.label)+'</span>'
    + (b.sub?'<span class="sub">'+b.sub+'</span>':'')
    + '</span>'
    + (b.cost?'<span class="cost">'+esc(b.cost)+'</span>':'') + '</button>'
  ).join("");
  const bs = r.buttons;
  box.querySelectorAll(".choice").forEach(el=>{
    el.onclick = ()=>{
      const b = bs[parseInt(el.dataset.bi,10)];
      if(!b) return;
      /* 故事模式：检定按钮不掷骰，先问玩家这一下算成功还是失败。
         b.click 是普通函数对象而不是 DOM 事件，选完直接调用它即可，
         不会绕回这里造成二次询问。 */
      if(S.story && b.chk) return askStory(()=>b.click(), null);
      b.click();
    };
  });
}
function spBtn(label, click, o){ return Object.assign({label:label, click:click}, o||{}); }
function line(cls, txt){ return '<div class="'+cls+'">'+txt+'</div>'; }

/* 车卡页顶部的快捷区。
   kind 决定"本页随机"要摇什么 —— 每页能摇的东西不一样，
   按钮上直接写出来，玩家不必先点一下才知道会动哪里。
   两个层级：【本页随机】只填空当前这一步，剩下的仍然自己选；
   【整卡随机】八个数值、职业、十项技能一次摇完。 */
const RAND_WORD = {attrs:"属性", career:"职业", cskills:"加点", interests:"兴趣"};
function quickBarHtml(kind){
  const chars = loadChars();
  let h = '<div id="quickBar" data-kind="'+(kind||"")+'">';
  if(kind){
    h += '<button class="qbtn prim" data-q="page"><span class="qi">骰</span>本页随机 · '
       + (RAND_WORD[kind]||"这一页") + '</button>'
       + '<button class="qbtn" data-q="all"><span class="qi">骰</span>整张卡随机</button>';
  }
  if(S.mode !== "story") h += '<button class="qbtn" data-q="story"><span class="qi">书</span>改用故事模式 · 重摇一张卡</button>';
  if(chars.length) h += '<button class="qbtn" data-q="chars"><span class="qi">旧</span>上次的卡 '+chars.length+'</button>';
  h += '<button class="qbtn" data-q="import"><span class="qi">入</span>从文件导入</button></div>';
  if(chars.length){
    h += '<div id="charList" style="display:none"><div class="cl-h">留在本机的调查员 · 点一行直接沿用</div>'
      + chars.slice(0,6).map((c,i)=>
          '<div class="charRow" data-c="'+i+'">'
        + '<span class="cn">'+esc(c.name || "无名")+'</span>'
        + '<span class="cj">'+esc(c.career || "")+'</span>'
        + '<span class="cd">'+fmtDate(c.ts)+'</span></div>').join("")
      + '</div>';
  }
  return h;
}
function bindQuick(){
  const bar = $("quickBar");
  if(!bar) return;
  bar.querySelectorAll("[data-q]").forEach(b=>{
    b.onclick = ()=>{
      const q = b.dataset.q;
      if(q === "page")  return pageRandom(bar.dataset.kind);
      if(q === "all")   return randomChar();
      if(q === "story") return startStory();
      if(q === "import") return openImport();
      if(q === "chars"){
        const l = $("charList");
        if(l) l.style.display = (l.style.display === "none" || !l.style.display) ? "" : "none";
      }
    };
  });
  const list = $("charList");
  if(list){
    const chars = loadChars();
    list.querySelectorAll(".charRow").forEach(r=>{
      r.onclick = ()=>{
        const c = chars[parseInt(r.dataset.c,10)];
        if(!c) return;
        applyChar(c, true);          // 新旅程：属性照搬，伤势回满
        S.story = S.mode === "story";
        TMP = null;
        rememberChar();
        toast("已载入：" + (c.name || "无名") + "（" + c.career + "）");
        go(8);
      };
    });
  }
}

/* 本页随机：只把当前这一步该填的填上，玩家还能接着改。
   职业那一步没有"选中态"（选了就走），所以摇完直接进下一站。 */
function pageRandom(kind){
  if(kind === "career"){
    const n = pickOne(Object.keys(CAREERS));
    S.career = n;
    S.skills["信用评级"] = CAREERS[n].credit;
    TMP = null;
    toast("随机职业：" + n);
    return go(CAREERS[n].end);
  }
  if(kind === "attrs"){
    if(!TMP || TMP.k !== "attrs") TMP = {k:"attrs", got:{}, gotIdx:{}, sel:null};
    /* 打乱的是**索引**而不是数值：池子里 50 有三个、60 两个，
       直接塞数值会让"已用"标记对不上任何一个格子。 */
    const idx = shuffled([0,1,2,3,4,5,6,7]);
    TMP.got = {}; TMP.gotIdx = {}; TMP.sel = null;
    ATTRS.forEach(([k], i)=>{
      TMP.got[k] = ATTR_POOL[idx[i]];
      TMP.gotIdx[k] = idx[i];
    });
    toast("八项属性已随机分配，可以继续微调");
    return refreshSp();
  }
  if(kind === "cskills"){
    if(!TMP || TMP.k !== "cskills") return;
    const c = CAREERS[TMP.career];
    if(!c) return;
    const need = 1 + (c.free||0);
    const cand = [];
    c.pick1.forEach(x=>cand.push(x));
    Object.keys(BASE_SKILLS).forEach(x=>{
      if(x === "克苏鲁神话" || c.job.indexOf(x) >= 0 || cand.indexOf(x) >= 0) return;
      cand.push(x);
    });
    TMP.picks = shuffled(cand).slice(0, need);
    const chosen = TMP.fixed.concat(TMP.picks);
    const pool = shuffled(MAIN_POOL);
    TMP.got = {}; TMP.gotIdx = {}; TMP.sel = null;
    chosen.forEach((x, i)=>{ TMP.got[x] = pool[i]; TMP.gotIdx[x] = i; });
    toast("已随机选好专长并分配数值");
    return refreshSp();
  }
  if(kind === "interests"){
    if(!TMP || TMP.k !== "interests") return;
    const own = Object.keys(S.skills);
    const cand = Object.keys(BASE_SKILLS).filter(x=>x !== "克苏鲁神话" && own.indexOf(x) < 0);
    TMP.picks = shuffled(cand).slice(0, 4);
    toast("已随机选好 4 项兴趣技能");
    return refreshSp();
  }
}
function openImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = ()=>{ if(inp.files && inp.files[0]) importChar(inp.files[0]); };
  inp.click();
}

/* 263 — 属性分配 */
SP.attrs = function(){
  /* 人物已经建好（故事模式开局，或刚点过整卡随机）：
     这一页的正文照读，但八行空格子已经没有意义，只留摘要与出口。 */
  if(S.autoChar && S.career){
    const a = S.attrs;
    $("spBox").innerHTML =
      '<div class="stmt"><i class="rtag">已建立</i>'
      + '正文照读，人物已经定下：<b>'+(S.name || "无名")+'</b>（'+S.career+'）。'
      + '属性与派生数值都按规则算好，左侧面板可以逐项核对。</div>'
      + '<div class="pool">' + ATTRS.map(([k,zh])=>
          '<span class="chip" style="cursor:default">'+zh+' '+a[k]+'</span>').join("") + '</div>'
      + '<div class="stmt"><i class="rtag">派生</i>'
      + '耐久 <b>'+S.hp+' / '+S.hpMax+'</b>　理智 <b>'+S.san+' / '+S.sanMax+'</b>　'
      + '魔法 <b>'+S.mp+' / '+S.mpMax+'</b>　幸运 <b>'+S.luck+'</b>　'
      + '伤害加值 <b>'+S.dbTxt+'</b></div>';
    return {title:"调查员 · 已就绪", buttons:[
      spBtn("用这张卡上路", ()=>go(8), {k:"→", cls:"skill"}),
      spBtn("换一张（重摇整张卡）", ()=>randomChar(), {k:"骰"})
    ], quick:quickBarHtml("attrs")};
  }
  if(!TMP || TMP.k !== "attrs"){
    TMP = {k:"attrs", got:{}, gotIdx:{}, sel:null};
  }
  if(!TMP.gotIdx) TMP.gotIdx = {};
  /* used 一律从 gotIdx 现推。单独维护一份“已用”标记，只要有一条路径忘了回滚
     （点 ✕ 清除、改主意重配），就会同时出两种错：同一个数值能被派两次，
     清空后数值又永久显示为已用。推导出来的状态没有漂移的余地。 */
  TMP.used = {};
  Object.keys(TMP.gotIdx).forEach(k=>{ if(TMP.got[k] != null) TMP.used[TMP.gotIdx[k]] = true; });

  const all = ATTRS.every(a => TMP.got[a[0]] != null);
  let html = '<div class="stmt"><i class="rtag">规则</i>'
           + '把 <b>40、50、50、50、60、60、70、80</b> 分给八项属性，'
           + '每一项都会影响你将来的检定与生死。先点一个数值，再点一项属性。</div>';
  html += '<div class="pool">' + ATTR_POOL.map((v,i)=>
    '<span class="chip '+(TMP.used[i]?"used":(TMP.sel===i?"sel":""))+'" data-p="'+i+'">'+v+'</span>'
  ).join("") + '</div>';
  ATTRS.forEach(([k,zh])=>{
    const v = TMP.got[k];
    html += '<div class="arow"><div class="an">'+zh+' <i>'+k+'</i></div>'
          + '<div class="aw">'+ (v!=null
              ? '<span class="chip sel">'+v+'</span><span class="chip" data-clr="'+k+'" style="padding:7px 9px">✕</span>'
              : '<span style="color:var(--ink3);font-family:var(--sans);font-size:12px">点此放入选中的数值</span>')
          + '</div>'
          + '<div class="av">'+(v!=null?v:"—")+'</div></div>';
  });
  html += '<div class="stmt" style="margin-top:16px"><i class="rtag">公式</i>'
        + '耐久 HP =（体质 + 体型）÷10 ｜ 理智 SAN = 意志 ｜ 魔法 MP = 意志÷5 ｜ 幸运 = 3D6×5</div>';
  $("spBox").innerHTML = html;
  // 交互
  $("spBox").querySelectorAll(".chip[data-p]").forEach(c=>{
    c.onclick = ()=>{
      const i = parseInt(c.dataset.p,10);
      if(TMP.used[i]){ toast("这个数值已经派出去了，先点它旁边的 ✕ 收回。"); return; }
      TMP.sel = i; refreshSp();
    };
  });
  $("spBox").querySelectorAll("[data-clr]").forEach(c=>{
    c.onclick = ()=>{
      const k = c.dataset.clr;
      delete TMP.got[k]; delete TMP.gotIdx[k];
      TMP.sel = null; refreshSp();
    };
  });
  $("spBox").querySelectorAll(".arow").forEach((row,i)=>{
    row.onclick = ()=>{
      if(TMP.sel == null) return;
      const key = ATTRS[i][0];
      if(TMP.got[key] != null) return;
      TMP.got[key] = ATTR_POOL[TMP.sel];
      TMP.gotIdx[key] = TMP.sel;
      TMP.sel = null; refreshSp();
    };
  });
  const btns = [];
  const remain = ATTR_POOL.length - Object.keys(TMP.got).length;
  btns.push(spBtn(all ? "确认属性，开始旅程" : "还有 "+remain+" 个数值没有分配", ()=>{

/* 102 / 226 / 239 / 249 / 265 — 本职技能分配 */
function careerSkillsHandler(name){
  return function(){
    const c = CAREERS[name];
    /* 角色已由随机生成：技能数值就位，不必再让玩家把 8 个数字挪一遍 */
    if(S.autoChar && S.career === name){
      const owned = Object.keys(S.skills).filter(x=>S.skills[x] != null);
      $("spBox").innerHTML = '<div class="stmt"><i class="rtag">已建立</i>'
        + '你的本职技能已经分配完毕（'+owned.length+' 项，'
        + '含信用评级、闪避与母语）。继续上路即可。</div>';
      return {title:"本职技能 · 已就绪", buttons:[
        spBtn("继续", ()=>go(128), {k:"→", cls:"skill"})],
        quick:quickBarHtml("cskills")};
    }
    if(S.career !== name){ S.career = name; S.skills["信用评级"] = c.credit; }
    if(!TMP || TMP.k !== "cskills" || TMP.career !== name){
      TMP = {k:"cskills", career:name, fixed:c.job.slice(), picks:[], got:{}, gotIdx:{}, sel:null};
    }
    if(!TMP.gotIdx) TMP.gotIdx = {};
    /* 与 263 同一套规则：已用标记从 gotIdx 现推，不单独维护 */
    TMP.used = {};
    Object.keys(TMP.gotIdx).forEach(k=>{ if(TMP.got[k] != null) TMP.used[TMP.gotIdx[k]] = true; });

    const need = 1 + (c.free||0);                      // 四选一 + 自由专长
    const cand = [];
    c.pick1.forEach(x=>cand.push(x));
    Object.keys(BASE_SKILLS).forEach(x=>{
      if(x === "克苏鲁神话") return;
      if(c.job.indexOf(x) >= 0) return;
      if(cand.indexOf(x) < 0) cand.push(x);
    });
    const chosen = TMP.fixed.concat(TMP.picks);
    /* 只认“选中的这 8 项都拿到了数值”。用 Object.keys(got).length === 8 判断会翻车：
       取消一个已分配的技能后 got 里仍留着它的旧值，长度照样是 8，
       于是把 undefined 写进 S.skills。 */
    const ready = chosen.length === 8 && chosen.every(x=>TMP.got[x] != null);

    let html = '<div class="stmt"><i class="rtag">规则</i>'
             + '你的职业是 <b>'+name+'</b>（信用评级 '+c.credit+'%）。'
             + '先把 8 项本职技能定下来，再把 <b>70、60、60、50、50、50、40、40</b> 分给它们。</div>';
    html += '<div class="rowlbl">① 本职技能</div>';
    TMP.fixed.forEach(x=>{ html += '<span class="flag">'+x+'</span>'; });
    c.pick1.forEach(x=>{
      const on = TMP.picks.indexOf(x) >= 0;
      html += '<span class="chip '+(on?"sel":"")+'" data-pick="'+x+'">'+x+'</span>';
    });
    html += '<div class="rowlbl">② 个人专长（还需选 '+Math.max(0,need-TMP.picks.length)+' 项）</div>';
    html += '<div class="pool">'+cand.filter(x=>c.pick1.indexOf(x)<0).map(x=>
      '<span class="chip '+(TMP.picks.indexOf(x)>=0?"sel":"")+'" data-pick="'+x+'">'+x+'</span>').join("")+'</div>';
    html += '<div class="rowlbl">③ 分配数值（先点数值，再点技能）</div>';
    html += '<div class="pool">'+MAIN_POOL.map((v,i)=>
      '<span class="chip '+(TMP.used[i]?"used":(TMP.sel===i?"sel":""))+'" data-p="'+i+'">'+v+'%</span>').join("")+'</div>';
    TMP.fixed.concat(TMP.picks).forEach(x=>{
      const v = TMP.got[x];
      html += '<div class="mrow '+(v!=null?"done":"")+'"><div class="mn">'+x
            + '<i>基础 '+BASE_SKILLS[x]+'%</i></div>'
            + '<div class="mv">'+(v!=null?v+"%"+' <span class="chip" data-clr2="'+x+'" style="padding:2px 7px;font-size:11px">✕</span>':"—")+'</div></div>';
    });
    $("spBox").innerHTML = html;

    $("spBox").querySelectorAll("[data-pick]").forEach(el=>{
      el.onclick = ()=>{
        const x = el.dataset.pick;
        const i = TMP.picks.indexOf(x);
        if(i >= 0){
          TMP.picks.splice(i,1);
          // 取消这一项的同时把它的数值收回，否则池子里少一个、got 里多一个
          delete TMP.got[x]; delete TMP.gotIdx[x];
        }
        else {
          if(TMP.picks.length >= need){ toast("已经选够了 " + need + " 项。"); return; }
          TMP.picks.push(x);
        }
        refreshSp();
      };
    });
    $("spBox").querySelectorAll(".chip[data-p]").forEach(el=>{
      el.onclick = ()=>{
        const i = parseInt(el.dataset.p,10);
        if(TMP.used[i]){ toast("这个数值已经派出去了，先点 ✕ 收回。"); return; }
        TMP.sel = i; refreshSp();
      };
    });
    $("spBox").querySelectorAll("[data-clr2]").forEach(el=>{
      el.onclick = ()=>{
        const k = el.dataset.clr2;
        delete TMP.got[k]; delete TMP.gotIdx[k];
        TMP.sel = null; refreshSp();
      };
    });
    $("spBox").querySelectorAll(".mrow").forEach((row,i)=>{
      row.onclick = ()=>{
        if(TMP.sel == null) return;
        const key = TMP.fixed.concat(TMP.picks)[i];
        if(!key || TMP.got[key] != null) return;
        TMP.got[key] = MAIN_POOL[TMP.sel];
        TMP.gotIdx[key] = TMP.sel;
        TMP.sel = null;
        refreshSp();
      };
    });

    return {title:"调查员速建 · 本职技能", buttons:[
      spBtn(ready ? "确认本职技能" : "尚有未完成的项目", ()=>{
        if(!ready){ toast("先把技能与数值都分配完。"); scrollSp(); return; }
        TMP.fixed.concat(TMP.picks).forEach(x=>{
          if(TMP.got[x] != null) S.skills[x] = TMP.got[x];
        });
        TMP = null; go(128);
      }, {k:"✓", cls:"skill"})
    ], quick:quickBarHtml("cskills")};
  };
}

/* =======================================================================
   二、路线与判定
   ======================================================================= */
/* 检定 → 结果 → 玩家自己决定走哪条线。
   失败时多给一个“强行成功”的出口：不给的话，一次运气就能把整条支线锁死。
   undo 用来撤销失败已经造成的数值代价（扣理智、上惩罚骰之类），
   否则玩家改判成功却仍带着失败的后遗症，比不改还乱。 */
function twoWay(r, okTo, failTo, extra, undo){
  showRoll(r, extra || null);
  if(r.ok || okTo === failTo) return goBtn(r.ok ? okTo : failTo);
  return goBtn(failTo, null, ()=>{
    if(undo) undo();
    toast("已改判为成功。");
    go(okTo);
  });
}

function sanHandler(okTo, failTo, dmg, autoTo){

          S.san = Math.max(0, S.san - n);
          note = "<b>失去 "+n+" 点理智值。</b>（理智 "+S.san+" / "+S.sanMax+"）";

        const undo = ()=>{ S.san = sanBefore; };
        /* 这类理智检定不论成败都去同一处，唯一区别是掉不掉理智 ——
           所以这里的“强行成功”是让理智不受损，而不是换一条路 */
        if(autoTo != null){
          showRoll(r, note);
          if(r.ok) goBtn(autoTo);
          else goBtn(autoTo, null, ()=>{ undo(); toast("已改判为成功，理智未受损。"); go(autoTo); });
        } else {
          twoWay(r, okTo, failTo, note, undo);
        }
      }, {chk:1, k:"🎲", cls:"skill", cost:S.attrs.POW+"%"}) ]};
  };
}

function showOpposed(r, note, to, winTo){
  const box = $("spBox");
  /* 故事模式没有骰面可画，r.myRoll 是 null —— 照原样取 tens 会直接抛错 */
  if(r.story){
    box.innerHTML += '<div class="roll story">'
      + '<div class="rh"><span>对抗检定 · '+esc(r.foeName)+' · 故事模式</span></div>'
      + '<div class="rb"><span class="big v-'+(r.win?"ok":"bad")+'">'+(r.win?"胜":"负")+'</span>'
      + '<span class="verdict v-'+(r.win?"regular":"fail")+'">'+GRADE_TXT[r.win?"regular":"fail"]+'</span>'
      + '<span class="meta">'+note+'</span></div>'
      + '<div class="dmgline">'+(r.win?"<b>你胜出。</b>":"<b>你落败了。</b>")+'</div></div>';
    scrollRollIntoView(box.lastElementChild || box);
    goBtn(to);
    return;
  }
  const html = '<div class="roll">'
    + '<div class="rh"><span>对抗检定 · '+esc(r.foeName)+'</span><span class="dice">'
    + '<div class="die">'+r.myRoll.tens+'0</div><div class="die u">'+r.myRoll.unit+'</div>'
    + '<div class="die" style="margin-left:8px">'+r.foeRoll.tens+'0</div><div class="die u">'+r.foeRoll.unit+'</div>'
    + '</span></div>'
    + '<div class="rb"><span class="big">'+r.myRoll.value+'</span>'
    + '<span class="verdict v-'+r.myGrade+'">你 '+GRADE_TXT[r.myGrade]+'</span>'
    + '<span class="verdict v-'+r.foeGrade+'">'+esc(r.foeName)+' '+GRADE_TXT[r.foeGrade]+'</span>'
    + '<span class="meta">'+note+'</span></div>'
    + '<div class="dmgline">'+(r.win?"<b>你胜出。</b>":"<b>你落败了。</b>")+'</div></div>';
  box.innerHTML += html;
  scrollRollIntoView(box.lastElementChild || box);
  // 落败时把“这条线不算”的出口摆出来；赢了就没必要
  goBtn(to, null, (r.win || winTo == null) ? null : ()=>go(winTo));
}

   三、战斗
   ======================================================================= */
const FOES = {
  bear: {name:"黑熊", dex:58, hpMax:20, armor:3, skill:35,
         plan:[
           [{n:"左爪",skill:35,dmg:"2D6"},{n:"右爪",skill:35,dmg:"2D6"}],
           [{n:"爪击",skill:35,dmg:"2D6"},{n:"啃咬",skill:25,dmg:"1D8"}],
           [{n:"左爪",skill:35,dmg:"2D6"},{n:"右爪",skill:35,dmg:"2D6"}]
         ],
         rounds:3, onWin:201, onLose:193, note:"浓密厚实的皮毛会吸收你每轮造成伤害的前 3 点。"},
  driver: {name:"车夫", dex:31, hpMax:9, armor:0, skill:30, dodgeSkill:15, plan:null,
         rounds:99, onWin:241, onLose:247, winAt:4, note:"他手持短棍，会造成 1D6 点伤害。"},
  artisan:{name:"工匠", dex:41, hpMax:12, armor:0, skill:35, plan:null,
         rounds:3, onWin:268, onLose:2, winAt:6, note:"他每轮攻击你一次，造成 1D3+1D4 点伤害；第三轮后你可以尝试绕过他逃跑。"}
};
let CB = null;

function startCombat(key){
  const f = FOES[key];
  const log = ["<div class='sys'>战斗开始。你的敏捷 "+S.attrs.DEX+"，"+f.name+"的敏捷 "+f.dex+"。</div>"];
  if(S.story) log.push("<div class='sys'>故事模式：你的攻击与闪避一律视为成功，"+f.name+"仍会掷骰。</div>");
  CB = {key:key, node:S.cur, f:f, hp:f.hpMax, round:0, over:false, weapon:"fist", log:log};
  return CB;
}
function combatUI(){
  const f = CB.f;
  const youFirst = (S.attrs.DEX||0) >= f.dex;
  let html = '<div class="fight"><div class="fh"><span>'+f.name+'</span>'
    + '<span class="fm">敏捷 '+f.dex+' · 格斗 '+f.skill+'%'+(f.armor?' · 护甲 '+f.armor:'')+'</span>'
    + '<span class="rnd">第 '+(CB.round+1)+' 轮 · '+(youFirst?"你先动":"它先动")+'</span></div>'
    + '<div class="fb">'
    + '<div class="fighter you"><div class="fn">你　耐久 '+S.hp+' / '+S.hpMax+'</div>'
    + '<div class="fbar"><i style="width:'+(S.hp/Math.max(1,S.hpMax)*100)+'%"></i></div></div>'
    + '<div class="vs">VS</div>'
    + '<div class="fighter"><div class="fn">'+f.name+'　耐久 '+Math.max(0,CB.hp)+' / '+f.hpMax+'</div>'
    + '<div class="fbar"><i style="width:'+(Math.max(0,CB.hp)/f.hpMax*100)+'%"></i></div></div></div>'
    + '<div class="flog">'+CB.log.slice(-8).join("")+'</div></div>';
  $("spBox").innerHTML = html;
  /* 战斗面板长在叙述之后，可能整个落在折叠线以下。
     但**首次绘制（刚进节点）不能滚** —— 那会把开头几段叙述顶出视野，
     玩家还没读就只看见血条。等第一轮动作打完再滚。 */
  if(CB.painted){
    const el = $("spBox").querySelector(".fight");
    if(el && el.scrollIntoView){
      try{ el.scrollIntoView({block:"nearest", behavior:"smooth"}); }catch(e){ el.scrollIntoView(false); }
    }
  }
  CB.painted = true;
}
function cLog(cls, txt){ CB.log.push("<div class='"+cls+"'>"+txt+"</div>"); }

function foeAttack(mode){
  const f = CB.f;
  let atk;
  if(f.plan){ atk = f.plan[Math.min(CB.round, f.plan.length-1)]; }
  else if(CB.key === "driver"){ atk = [{n:"短棍",skill:30,dmg:"1D6"}]; }
  else { atk = [{n:"重拳",skill:35,dmg:"1D3+1D4"}]; }
  let total = 0;
  atk.forEach(a=>{
    const foeRoll = rollD100({});
    const foeGrade = gradeOf(foeRoll.value, a.skill);
    const hit = GRADE_RANK[foeGrade] >= 2;
    if(!hit){ cLog("foe", esc(f.name)+" 的"+a.n+"落空了。"); return; }
    // 玩家动作
    if(CB.playerAction === "dodge"){
      const myRoll = S.story ? null : rollD100(S.penalty?{penalty:1}:{});
      const myVal = getSkill("闪避");
      const myGrade = S.story ? "regular" : gradeOf(myRoll.value, myVal);
      S.rolls += 2;
      const win = S.story || GRADE_RANK[myGrade] > GRADE_RANK[foeGrade] ||
                 (GRADE_RANK[myGrade] === GRADE_RANK[foeGrade] && myVal >= a.skill);
      if(win){ cLog("you","你侧身闪开了"+a.n+"。"+(S.story?"":"（闪避 "+myRoll.value+" ≤ "+myVal+"）")); return; }
      cLog("sys","闪避失败（"+myRoll.value+" vs "+myVal+"）。");
    } else {
      // 你选择了攻击 → 与它对抗
      const myRoll = S.story ? null : rollD100(S.penalty?{penalty:1}:{});
      const myVal = getSkill("格斗(斗殴)");
      const myGrade = S.story ? "regular" : gradeOf(myRoll.value, myVal);
      S.rolls += 2;
      const win = S.story || GRADE_RANK[myGrade] > GRADE_RANK[foeGrade] ||
                 (GRADE_RANK[myGrade] === GRADE_RANK[foeGrade] && myVal >= a.skill);
      if(win){
        cLog("you","你抢在"+a.n+"之前出手，逼退了它。"+(S.story?"":"（格斗 "+myRoll.value+" ≤ "+myVal+"）"));
        return;
      }
    }
    let dmg = rollDice(a.dmg);
    total += dmg;
    S.hp = Math.max(0, S.hp - dmg);
    cLog("foe", esc(f.name)+"的"+a.n+"命中：<b>"+dmg+"</b> 点伤害。（你的耐久 "+S.hp+"）");
  });
  return total;
}
function youAttack(){
  const f = CB.f;
  const myVal = getSkill("格斗(斗殴)");
  /* 故事模式：这一拳的成败由玩家决定过，直接算命中 */
  const myRoll = S.story ? null : rollD100(S.penalty?{penalty:1}:{});
  const myGrade = S.story ? "regular" : gradeOf(myRoll.value, myVal);
  let foeVal = f.skill, foeGrade;
  if(CB.key === "driver" && CB.foeDodge){
    const fr = rollD100({}); foeGrade = gradeOf(fr.value, f.dodgeSkill); foeVal = f.dodgeSkill;
  } else {
    const fr = rollD100({}); foeGrade = gradeOf(fr.value, f.skill);
  }
  S.rolls += 2;
  const win = S.story || GRADE_RANK[myGrade] > GRADE_RANK[foeGrade] ||
             (GRADE_RANK[myGrade] === GRADE_RANK[foeGrade] && myVal >= foeVal);
  if(myGrade === "fumble"){ cLog("foe","你的拳头砸在了石头般的毛皮上——大失败。"); return; }
  if(!win){ cLog("foe","你的攻击被"+f.name+"挡住了。（你 "+myRoll.value+"，它 "+foeGrade+"）"); return; }
  let dmg = (CB.weapon === "knife" ? rollDice("1D4") : rollDice("1D3")) + S.db;
  dmg = Math.max(0, dmg);
  /* 故事模式不吃护甲：玩家刚刚亲手判定"这一击成功"，
     再让熊皮把 1D3 全吸收掉，等于把选择权又要回去了。
     代价是伤害仍随机 —— 成功不等于必杀。 */
  let dealt = S.story ? Math.max(1, dmg) : Math.max(0, dmg - f.armor);
  CB.hp -= dealt;
  cLog("you","你命中"+f.name+"：造成 <b>"+dealt+"</b> 点伤害"
    + (f.armor && !S.story ? "（皮毛吸收 "+f.armor+" 点）" : "") + "。它的耐久 "+Math.max(0,CB.hp)+"。");
}
function combatRound(){
  if(CB.over) return;
  const f = CB.f;
  const youFirst = (S.attrs.DEX||0) >= f.dex;
  if(CB.key === "driver"){
    const d = rollDice("1D6");
    CB.foeDodge = (d % 2 === 0);
    cLog("sys","(车夫掷出 "+d+" —— "+(CB.foeDodge?"他选择闪避":"他选择攻击")+")");
  }
  const doYou = ()=>{ if(CB.playerAction === "attack") youAttack(); else cLog("you","你收拢身体，准备闪开它的下一击。"); };
  if(youFirst){ doYou(); if(CB.hp <= 0) return endCombat(true); foeAttack(); }
  else { foeAttack(); if(S.hp <= 0) return endCombat(false); doYou(); if(CB.hp <= 0) return endCombat(true); }
  CB.round++;
  const winAt = f.winAt || 1;
  if(CB.hp <= winAt) return endCombat(true);
  if(S.hp <= 0) return endCombat(false);
  if(CB.key !== "driver" && CB.round >= f.rounds) return endCombat("timeout");
  combatUI();
  renderCombatButtons();
}
function endCombat(result){
  CB.over = true;
  const f = CB.f;
  if(result === true){ cLog("you","<b>"+f.name+"倒下了。</b>"); renderCombatButtons(); }
  else if(result === false){ cLog("foe","<b>你倒下了。</b>"); renderCombatButtons(); }
  else { cLog("sys","<b>三轮过去了。</b>"); renderCombatButtons(); }
}
function renderCombatButtons(){
  const f = CB.f;
  const box = $("actsBox");
  const btns = [];
  if(CB.over){
    if(S.hp <= 0){ btns.push(spBtn("（你倒下了）", ()=>go(f.onLose), {k:"✝", cls:"warn"})); }
    else if(CB.hp <= (f.winAt||1)){ btns.push(spBtn("继续", ()=>go(f.onWin), {k:"→", cls:"skill"})); }
    else { btns.push(spBtn("三轮已过，你还站着", ()=>go(f.onWin), {k:"→", cls:"skill"})); }
    box.innerHTML = btns.map((b,i)=>'<button class="choice '+(b.cls||"")+'" data-bi="'+i+'"><span class="k">'+(b.k||"→")+'</span><span>'+esc(b.label)+'</span></button>').join("");
    box.querySelectorAll(".choice").forEach(el=>{ el.onclick = ()=>btns[parseInt(el.dataset.bi,10)].click(); });
    return;
  }
  const b2 = [];
  b2.push(spBtn(CB.weapon === "knife" ? "挥刀攻击（1D4 + 伤害加值）" : "赤手攻击（1D3 + 伤害加值）", ()=>{
    CB.playerAction = "attack"; combatRound();
  }, {k:"攻", cls:"skill"}));
  b2.push(spBtn("闪避（不造成伤害）", ()=>{ CB.playerAction = "dodge"; combatRound(); }, {k:"避", cls:"skill"}));
  if(CB.key === "artisan" && CB.round >= 2){
    b2.push(spBtn("冒险绕过他逃走（困难「闪避」）", ()=>{
      const r = doCheck("闪避","hard");
      if(r.ok){ showRoll(r,"你从他身边挤了过去！"); goBtn(12); }
      else {
        /* 战斗里没有“等一等”的余地：失败后必须先问一句，
           否则一轮结算已经打出去了，改判就变成回滚伤害的烂账 */
        showRoll(r,"他趁机又打了你一下。");
        const box = $("actsBox");
        box.innerHTML = '<button class="choice" id="__cont"><span class="k">→</span><span>接受失败 —— 再撑一轮</span></button>'
          + forceBtnHtml("这次闪避作废，直接挤出门去");
        $("__cont").onclick = ()=>{ CB.playerAction="dodge"; combatRound(); };
        $("__force").onclick = ()=>go(12);
      }
    }, {chk:1, k:"逃", cls:"skill"}));
  }
  box.innerHTML = b2.map((b,i)=>'<button class="choice '+(b.cls||"")+'" data-bi="'+i+'"><span class="k">'+(b.k||"→")+'</span><span>'+esc(b.label)+'</span></button>').join("");
  box.querySelectorAll(".choice").forEach(el=>{ el.onclick = ()=>b2[parseInt(el.dataset.bi,10)].click(); });
}
function combatHandler(key){
  return function(){
    if(!CB || CB.key !== key || CB.node !== S.cur) startCombat(key);   // 重新进入同一战斗节点 = 重开该场战斗
    if(S.attrs.DEX == null){ toast("你还没有创建角色。"); }
    if(!CB.started){
      CB.started = true;
      combatUI();
      // 武器选择
      const box = $("actsBox");
      const w = [
        spBtn("你摸到口袋里那把狩猎小刀", ()=>{ CB.weapon = "knife"; CB.log.push("<div class='sys'>你握着狩猎小刀。</div>"); combatUI(); renderCombatButtons(); }, {k:"刀", cls:"skill"}),
        spBtn("赤手空拳", ()=>{ CB.weapon = "fist"; CB.log.push("<div class='sys'>你只能用拳头。</div>"); combatUI(); renderCombatButtons(); }, {k:"拳", cls:"skill"})
      ];
      box.innerHTML = '<div class="rule">处理近身战斗时：参战者中“敏捷”最高的最先行动；每个战斗轮你可以进行一次攻击或闪避 —— '
        + '攻击是与你对手的格斗技能对抗，谁的成功等级高谁得手。'+esc(CB.f.note||"")+'</div>'
        + w.map((b,i)=>'<button class="choice '+(b.cls||"")+'" data-bi="'+i+'"><span class="k">'+(b.k||"→")+'</span><span>'+esc(b.label)+'</span></button>').join("");
      box.querySelectorAll(".choice").forEach(el=>{ el.onclick = ()=>w[parseInt(el.dataset.bi,10)].click(); });
      return {title:"战斗", keep:true};
    }
    combatUI(); renderCombatButtons();
    return {title:"战斗", keep:true};
  };
}
SP.combat_bear = combatHandler("bear");
SP.combat_driver = combatHandler("driver");
SP.combat_artisan = combatHandler("artisan");

/* 52 — 无眠之夜 */
SP.tough_52 = function(){
  return {title:"一夜没合眼", sc:"你身体僵硬、心烦意乱。进行一次「体质」检定 —— 失败则今日所有技能检定受一颗惩罚骰。",
    buttons:[ spBtn("进行「体质」检定", ()=>{
      const before = S.penalty;
      const r = doCheck("体质","regular");
      if(!r.ok) S.penalty = true;
      showRoll(r, r.ok ? "你顶住了。" : "<b>今日所有技能检定受一颗惩罚骰。</b>");
      if(r.ok) goBtn(64);
      else goBtn(64, null, ()=>{ S.penalty = before; toast("已改判为成功，惩罚骰取消。"); go(64); });
    }, {chk:1, k:"🎲", cls:"skill", cost:S.attrs.CON+"%"}) ]};
};


/* =========================================================================
   启动
   ========================================================================= */
function restart(){
  /* TMP 是车卡向导的临时状态。不清它，重开后会带着上一局分配好的属性和技能，
     玩家想建新角色却被迫沿用旧数值。 */
  if(confirm("重新开始？当前进度将丢失，并且要重新选择玩法。")){
    S = freshState(); CB = null; TMP = null;
    renderModePick();
  }
}
function boot(){
  S = freshState();
  $("btnFont").onclick = cycleFont;
  let savedFont = "song";
  try{ savedFont = localStorage.getItem(FONT_KEY) || "song"; }catch(e){}
  setFont(savedFont, true);
  $("btnSave").onclick = save;
  $("btnLoad").onclick = load;
  $("btnNew").onclick = restart;
  /* 移动端：抽屉 + 遮罩，点遮罩关闭，选中条目后自动收起 */
  const drawer = on=>{
    $("side").classList.toggle("on", on);
    $("scrim").classList.toggle("on", on);
  };
  $("mob").onclick = ()=> drawer(!$("side").classList.contains("on"));
  $("scrim").onclick = ()=> drawer(false);
  $("trailBox").addEventListener("click", e=>{ if(e.target.tagName === "A") drawer(false); });
  const raw = localStorage.getItem("aaltf_save");
  if(raw){
    try{
      const o = JSON.parse(raw);
      const s = Object.assign(freshState(), o.s);
      // 存档可能来自旧版本或已损坏：目标条目必须真实存在，否则从头发车
      if(s.cur && N[s.cur]){ S = s; S.startTime = o.t || Date.now(); }
      else toast("存档已失效，从头开始。");
    }catch(e){ toast("存档损坏，从头开始。"); }
  }
  addEventListener("resize", updateMore);
  addEventListener("resize", updateScrollCue);
  $("acts").addEventListener("scroll", updateMore, {passive:true});
  $("scroll").addEventListener("scroll", updateScrollCue, {passive:true});
  wheelRelay();
  bindKeys();
  /* 老存档里没有 mode 字段：只要已经进过正文或建过卡，就当经典模式接着玩，
     别把人拦回开局页。真·新开一局（什么都没做过）才问一句怎么玩。 */
  if(!S.mode && (S.cur > 1 || S.career)) S.mode = "classic";
  if(S.mode) go(N[S.cur] ? S.cur : 1);
  else renderModePick();
}

/* 滚动接力：正文与选项是兄弟滚动容器，浏览器不会自己串起来。
   玩家在正文里滚到底，想继续看下面的选项 —— 这时把滚动交给面板，
   反之面板滚到顶再上滚就还给正文。少了这一段，就是"选项在下面却滑不到"。 */
function wheelRelay(){
  const sc = $("scroll"), a = $("acts");
  if(!sc || !a) return;
  const step = d => d > 60 || d < -60 ? d : d * 1.6;
  sc.addEventListener("wheel", e=>{
    if(e.ctrlKey || e.metaKey || e.deltaY <= 0) return;
    if(a.scrollHeight <= a.clientHeight + 1) return;
    if(sc.scrollTop + sc.clientHeight < sc.scrollHeight - 2) return;
    const b = a.scrollTop;
    a.scrollTop = Math.min(a.scrollHeight, b + step(e.deltaY));
    if(a.scrollTop !== b) e.preventDefault();
  }, {passive:false});
  a.addEventListener("wheel", e=>{
    if(e.ctrlKey || e.metaKey || e.deltaY >= 0) return;
    if(a.scrollTop > 1) return;
    const b = sc.scrollTop;
    sc.scrollTop = Math.max(0, b + step(e.deltaY));
    if(sc.scrollTop !== b) e.preventDefault();
  }, {passive:false});
}

/* 键盘交互：数字键直选、上下移动焦点 —— 选项不再只能靠鼠标 */
function bindKeys(){
  addEventListener("keydown", e=>{
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||"")) return;
    const btns = Array.prototype.slice.call(document.querySelectorAll("#actsBox .choice"));
    if(!btns.length) return;
    if(/^[1-9]$/.test(e.key)){
      const b = btns[parseInt(e.key,10)-1];
      if(b){ e.preventDefault(); b.focus(); b.click(); }
      return;
    }
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const at = btns.indexOf(document.activeElement);
      let n = at < 0 ? (e.key === "ArrowDown" ? 0 : btns.length-1)
                     : at + (e.key === "ArrowDown" ? 1 : -1);
      n = Math.max(0, Math.min(btns.length-1, n));
      btns[n].focus();
      return;
    }
    if((e.key === "Enter" || e.key === " ") && btns.length === 1
       && btns.indexOf(document.activeElement) < 0){
      e.preventDefault(); btns[0].click();
    }
  });
}
boot();
