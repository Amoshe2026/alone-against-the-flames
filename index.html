<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>向火独行 · Alone Against the Flames</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1411'/%3E%3Cpath d='M16 5c3 5-3 6 0 11 2-1 3-3 3-3s3 3 3 7a6 6 0 0 1-12 0c0-4 3-6 3-9 1 1 2 2 3 2-1-3-2-5 0-8z' fill='%23e2b475'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#090706; --bg2:#100c0a;
  --panel:#1a1411; --panel2:#231b15;
  --line:#2c211a; --line2:#463425; --line3:#5d452f;
  --ink:#f6f0e4; --ink2:#cbbca5; --ink3:#9b8972; --ink4:#7b6a58;
  --ember:#ff9147; --ember2:#d9561c; --ember3:#8a3a12;
  --gold:#e2b475;
  --blood:#a13325; --good:#8fb45c; --bad:#d9594b;
  /* 三套正文栈，可用顶栏「字」按钮切换（选择存 localStorage）。
     宋体：SimSun 打头 —— 屏幕上的字面比思源宋小一号，靠 19px 字号 + 轻描边补偿；
     楷体：KaiTi 打头，笔画细，字号再抬一档；
     雅宋：思源宋（装有则用），字形最匀，作为"不想看点阵宋"时的退路。 */
  --song:"SimSun","宋体","STSong","Songti SC","Noto Serif SC",serif;
  --kai:"KaiTi","楷体","STKaiti","华文楷体","Kaiti SC","SimSun",serif;
  --ya:"Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong",serif;
  --serif:var(--song);
  /* 正文的字号/行高随字体档位变化（见 body[data-font] 规则） */
  --fs:20px; --lh:1.98;
  --sans:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --rail:316px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* 整页永不滚动：所有滚动都发生在正文区/选项面板内部。
   否则一旦内部溢出，body 的 overflow:hidden 会把底部选项直接裁掉 —— 且滚不到。 */
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink); font-family:var(--serif);
  font-size:var(--fs); line-height:var(--lh); letter-spacing:.02em; overflow:hidden;
  text-rendering:optimizeLegibility; font-kerning:normal;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
/* 楷体的笔画更细、字面更窄，同一字号看着比宋体小，这里抬 0.5px 补回来 */
body[data-font="kai"]{--serif:var(--kai);--fs:20.5px;--lh:2.02}
body[data-font="ya"]{--serif:var(--ya);--fs:19px;--lh:2}
/* SimSun 是点阵骨架的轮廓字，深底细笔画容易"断"，
   给一点点同色描边把笔画压住 —— 0.2px 已经够，再多就糊了 */
body[data-font="song"] #entry,
body:not([data-font]) #entry{ -webkit-text-stroke:.2px currentColor }
/* 环境光：暖色余烬从左上渗入，冷色沉在右下，纯黑不至于发闷 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1200px 680px at 18% -12%, rgba(255,145,71,.115), transparent 60%),
    radial-gradient(900px 560px at 94% 114%, rgba(217,86,28,.075), transparent 58%),
    radial-gradient(760px 760px at 54% 46%, rgba(122,74,42,.045), transparent 72%);
}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)'/%3E%3C/svg%3E");}

/* ---------- 布局骨架 ---------- */
#app{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:var(--rail) 1fr}
#side{
  border-right:1px solid var(--line); background:linear-gradient(180deg,#120e0c,#0a0807 72%);
  overflow-y:auto; padding:15px 15px 44px; scrollbar-gutter:stable;
}
/* min-height:0 是关键：flex/grid 子项默认 min-height:auto 会被内容撑破本行，
   于是 #main 高过视口、底部溢出被裁 —— 这正是"看得到选项却滑不到"的元凶 */
#main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;position:relative}

/* ---------- 顶栏 ---------- */
#topbar{
  display:flex;align-items:center;gap:16px;height:60px;padding:0 22px;
  border-bottom:1px solid var(--line); flex-shrink:0; position:relative;
  background:linear-gradient(180deg,rgba(17,13,10,.96),rgba(11,8,7,.84));
  backdrop-filter:blur(10px);
}
/* 顶栏下沿：一段从余烬色渐隐到透明的 hairline，替代生硬的通栏描边 */
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,145,71,.55),rgba(255,145,71,.14) 24%,transparent 58%)}
#topbar .brand{min-width:0}
#topbar .ttl{font-size:17px;line-height:1.16;letter-spacing:.26em;color:var(--ember);
  text-shadow:0 0 26px rgba(255,145,71,.42);white-space:nowrap}
#topbar .sub{font-size:9.5px;line-height:1.4;color:var(--ink4);letter-spacing:.26em;
  font-family:var(--sans);margin-top:2px;white-space:nowrap;text-transform:uppercase}
#topbar .sp{flex:1}
#topbar .tools{display:flex;gap:7px;flex-shrink:0}
.btn{
  background:rgba(26,20,17,.7);border:1px solid rgba(70,52,37,.8);color:var(--ink2);
  height:29px;padding:0 12px;border-radius:3px;cursor:pointer;font-family:var(--sans);
  font-size:11.5px;letter-spacing:.1em;transition:.16s;line-height:1;
}
.btn:hover{background:rgba(255,145,71,.11);border-color:var(--ember2);color:var(--ember)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.34;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* ---------- 阅读区 ---------- */
/* min-height 90px：矮窗口时正文必须肯让位给选项，否则整体溢出不是滚动 */
/* flex-basis:0 —— 正文不按内容高度参与尺寸竞争，只吃剩余空间。
   若用 auto，正文的巨长内容会拖着选项面板一起被收缩，面板白白损失几十像素。 */
#scroll{flex:1 1 0;min-height:90px;overflow-y:auto;padding:22px 0 28px;scroll-behavior:smooth;
  scrollbar-gutter:stable}
/* min-height:100% + 居中：短条目（村中菜单这类只有两三行）不会在阅读区顶部
   缩成一小块，下方留出一大片空洞；长条目因 #stage 随内容增高，居中自然失效，不影响滚动。
   注意用 min-height 而不是 height —— 否则内容超高时居中对齐会把开头几行顶出可视区。 */
#stage{max-width:680px;margin:0 auto;padding:0 30px;min-height:100%;
  display:flex;flex-direction:column;justify-content:center}
/* 正文下方还有操作面板时的浮标（sticky 贴住可视区底）。
   #spBox 里的战斗面板、属性分配器都长在整段叙述之后，没有提示玩家会以为页面到头了。
   做成小药丸而不是通栏渐变条 —— 通栏会吃掉最后一行字。 */
#scrollCue{position:sticky;bottom:7px;display:none;z-index:6;pointer-events:none;
  width:max-content;max-width:calc(100% - 24px);margin:0 8px 0 auto;
  padding:4px 11px;border-radius:20px;
  font-family:var(--sans);font-size:10px;letter-spacing:.08em;color:var(--ember);
  background:rgba(32,24,19,.97);border:1px solid var(--ember3);
  box-shadow:0 10px 28px -12px #000, 0 0 0 4px rgba(9,7,6,.8)}
#scrollCue.on{display:block}
/* 正文没读完时压在面板顶边的一道渐隐。
   直接把最后一行齐刀切断，看起来像渲染坏了；淡出则明确表示"下面还有"。
   不能用 mask 加在 #scroll 上 —— #scrollCue 是它的子元素，会一起被隐掉。 */
#fadeEdge{position:absolute;left:0;right:0;bottom:0;height:52px;pointer-events:none;
  z-index:4;opacity:0;transition:opacity .18s;
  background:linear-gradient(180deg,transparent,rgba(9,7,6,.62) 46%,rgba(9,7,6,.99))}
#fadeEdge.on{opacity:1}

/* ---------- 正文 ---------- */
/* 深底上的细笔画会"发虚"，加 0.45px 同色描边把笔画压实，显著提升可读性 */
#bodyText{text-shadow:0 0 .45px rgba(255,247,235,.3)}
/* 注意：不要用 fill-mode:both —— 那会让元素在动画开始前就应用 from 的 opacity:0，
   一旦动画没跑起来（无渲染帧、减少动态效果、低端设备），正文就永久隐形。 */
#entry{animation:fade .5s ease}
/* 入场动画只改位置，绝不改 opacity。
   凡是"用动画决定可见性"的写法（opacity:0 起 + fill-mode），
   一旦动画处于"已启动但推进不了"的状态（无帧产出的环境、低端设备、某些省电模式），
   元素就会永久停在 opacity:0 —— 正文、弹窗、结局卡片全都消失。
   位移动画卡住最多是位置偏几像素，内容始终可读可点。 */
@keyframes fade{from{transform:translateY(10px)}to{transform:none}}
#entry .num{
  font-family:var(--sans);font-size:10.5px;letter-spacing:.3em;color:var(--ink4);
  margin-bottom:15px;display:flex;align-items:center;gap:10px;
}
#entry .num::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(70,52,37,.9),rgba(70,52,37,.15) 62%,transparent)}
#entry .num b{color:var(--ember);font-weight:500;font-family:var(--serif);font-size:13.5px;
  letter-spacing:.08em;font-variant-numeric:tabular-nums}
/* 首行缩进 2em（中文书排惯例）；条目开头那一段则齐头，避免一上来就缩进去。
   段距压到 .62em —— 段落已经有缩进做区隔，再给大间距会散成一堆短块，
   读者分不清"这段结束了"和"这里换了个话题"。 */
#entry p{margin-bottom:.62em;text-align:justify;text-justify:inter-ideograph;
  text-indent:2em;line-break:strict;word-break:normal;overflow-wrap:break-word}
#bodyText > p:first-child{text-indent:0}
#entry p:last-child{margin-bottom:0}
/* 正文与下方表单之间留一道空档。紧贴的话，规则说明会被读成正文的最后一段，
   前面换字体、加竖线全白费。 */
#spBox{margin-top:17px}
#spBox:empty{display:none;margin-top:0}
#rollBox:empty{display:none}
#entry .said{color:#f4ebd9}
#entry .whisper{color:var(--ink2);font-style:italic}
#entry .epigraph{
  font-size:15.5px;color:var(--gold);border-left:2px solid var(--line3);
  padding:2px 0 2px 14px;margin:18px 0;text-indent:0;
}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:24px 0}
.revisit{font-family:var(--sans);font-size:10.5px;color:var(--ink3);
  border:1px dashed rgba(70,52,37,.9);border-radius:2px;padding:3px 9px;display:inline-block;
  margin-bottom:14px;letter-spacing:.12em}

/* ---------- 行动区 ---------- */
/* 面板高度按视口自适应：宁可让正文让位，也不能把选项藏进看不见的内滚动 */
/* 面板必须可压缩(flex:0 1 auto) + 有下限(118px)，高度上限由视口决定；
   容器自身 overflow:hidden，内层 #acts 才滚 —— 层级清晰，滚动条不会错位 */
#actsWrap{position:relative;flex:0 1 auto;min-height:118px;max-height:min(76vh,660px);
  display:flex;flex-direction:column;overflow:hidden;
  border-top:1px solid rgba(93,69,47,.8);
  background:linear-gradient(180deg,#161110,#0b0807 72%);
  box-shadow:0 -30px 70px -32px #000, inset 0 1px 0 rgba(255,145,71,.05);
  backdrop-filter:blur(10px)}
/* 顶部亮边：把"这是操作区"和"这是正文"在视觉上彻底分开 */
#actsWrap::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,145,71,.36) 20%,rgba(255,145,71,.36) 80%,transparent)}
#acts{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#acts::-webkit-scrollbar{width:10px}
#acts::-webkit-scrollbar-track{background:transparent}
#acts::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
#acts::-webkit-scrollbar-thumb:hover{background:var(--ember2);background-clip:content-box}
#actsInner{max-width:680px;margin:0 auto;padding:16px 30px 20px}
#actsTitle{font-family:var(--sans);font-size:10.5px;letter-spacing:.28em;color:var(--ink4);
  margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
#actsTitle .kb{margin-left:auto;letter-spacing:.06em;font-size:10px;color:var(--ink4)}
#moreHint{position:absolute;left:0;right:0;bottom:0;height:48px;display:none;align-items:flex-end;
  justify-content:center;padding-bottom:8px;pointer-events:none;z-index:3;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;color:var(--ember);
  background:linear-gradient(180deg,transparent,rgba(9,7,6,.97) 58%)}
#moreHint.on{display:flex}
.choice{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:linear-gradient(90deg,rgba(31,24,19,.92),rgba(24,18,15,.5));
  border:1px solid rgba(70,52,37,.72);border-left:2px solid var(--line3);
  color:var(--ink);padding:11px 15px;margin-bottom:8px;border-radius:4px;
  cursor:pointer;font-family:var(--serif);font-size:17px;line-height:1.62;
  transition:border-color .16s,background .16s,transform .16s,box-shadow .16s;
}
.choice:hover{border-left-color:var(--ember);border-color:rgba(255,145,71,.28);
  background:linear-gradient(90deg,rgba(50,34,23,.95),rgba(26,20,17,.5));
  transform:translateX(2px);box-shadow:-2px 0 22px -8px rgba(255,145,71,.55)}
.choice:active{filter:brightness(1.16)}
.choice:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.choice .k{
  font-family:var(--sans);font-size:10.5px;color:#8d7c68;background:rgba(0,0,0,.32);
  border:1px solid rgba(70,52,37,.95);border-radius:3px;padding:2px 6px;flex-shrink:0;margin-top:3px;
  min-width:23px;text-align:center;font-variant-numeric:tabular-nums;transition:.16s;
}
/* 选项可带一行副文案：让"这个选项意味着什么"出现在决策发生的地方，
   而不是藏在下方叙述里的说明块 */
.choice .lbl{display:flex;flex-direction:column;gap:3px;min-width:0}
.choice .sub{font-family:var(--sans);font-size:11px;line-height:1.65;color:var(--ink4);
  letter-spacing:.01em}
.choice:hover .k{color:var(--ember);border-color:var(--ember3);background:rgba(255,145,71,.08)}
.choice.skill{border-left-color:var(--ember2)}
.choice.skill .k{color:var(--ember);border-color:var(--ember3);background:rgba(255,145,71,.07)}
.choice.warn{border-left-color:var(--blood)}
/* 强行改判：给"这次掷骰不算"一个正经出口。
   刻意用虚线 + 金色，和常规选项的实线余烬色拉开层级；
   并且永远排在最后一位 —— 玩家按数字键连按时不会误踩。 */
.choice.force{
  border-style:dashed;border-color:rgba(226,180,117,.34);border-left:2px solid var(--gold);
  background:linear-gradient(90deg,rgba(40,31,19,.82),rgba(22,17,14,.4));
}
.choice.force .k{color:var(--gold);border-color:rgba(226,180,117,.42);background:rgba(226,180,117,.09)}
.choice.force:hover{border-color:rgba(226,180,117,.6);border-left-color:var(--gold);
  box-shadow:-2px 0 22px -8px rgba(226,180,117,.5)}
.choice.force .sub{color:rgba(226,180,117,.58)}

/* ---------- 创建向导·快捷区 ---------- */
/* 挂在操作面板顶部而不是正文里：263 的正文有五百多字，塞在正文后面的
   快捷入口要滚到底才看得见 —— 等于没有。 */
#quickSlot{margin-bottom:13px}
#quickSlot:empty{display:none}
/* 车卡页第一屏就该看见"不想填表"的出口。三个胶囊横排，滚不动就换行 */
#quickBar{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.qbtn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;line-height:1;
  padding:8px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;
  color:var(--ink2);background:rgba(0,0,0,.26);
  border:1px solid rgba(70,52,37,.85);transition:.16s;
}
.qbtn:hover{color:var(--ink);border-color:rgba(255,145,71,.5);background:rgba(255,145,71,.08)}
.qbtn:active{filter:brightness(1.18)}
.qbtn.prim{color:var(--ember);border-color:var(--ember3);background:rgba(255,145,71,.08)}
.qbtn.prim:hover{border-color:var(--ember);background:rgba(255,145,71,.14)}
.qbtn .qi{font-family:var(--serif);font-size:13px;line-height:1}

/* 历史人物卡：一行一张，属性/技能摘要压到第二行 */
#charList{margin:0 0 16px;border:1px solid rgba(70,52,37,.62);border-radius:4px;
  overflow:hidden;max-height:200px;overflow-y:auto}
#charList .cl-h{font-family:var(--sans);font-size:10px;letter-spacing:.22em;color:var(--ink4);
  padding:9px 12px 7px;border-bottom:1px solid rgba(70,52,37,.5);background:rgba(0,0,0,.2)}
.charRow{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;
  border-bottom:1px solid rgba(70,52,37,.32);transition:.14s}
.charRow:last-child{border-bottom:0}
.charRow:hover{background:rgba(255,145,71,.07)}
.charRow .cn{font-family:var(--serif);font-size:15px;color:var(--ink)}
.charRow .cj{font-family:var(--sans);font-size:10.5px;color:var(--ember);letter-spacing:.1em}
.charRow .cd{font-family:var(--sans);font-size:10px;color:var(--ink4);margin-left:auto;
  font-variant-numeric:tabular-nums}

/* 故事模式的成败选择：两张并排的大卡，别让玩家在"我到底选了什么"上犹豫 */
.storyPick{display:flex;gap:9px}
.storyPick .choice{flex:1 1 0;min-width:0;margin-bottom:0}
.choice.okline{border-left-color:var(--good)}
.choice.okline .k{color:var(--good);border-color:rgba(143,180,92,.4);background:rgba(143,180,92,.09)}
.choice.badline{border-left-color:var(--bad)}
.choice.badline .k{color:var(--bad);border-color:rgba(217,89,75,.4);background:rgba(217,89,75,.09)}
/* 故事模式的掷骰面板：没有点数，只有一句判定 */
.roll.story .rb .big{font-size:22px;letter-spacing:.1em}
/* 选成败之前先说明这是哪一项检定，否则玩家看到"成功/失败"不知道在选什么 */
.storyq{font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;color:var(--ink3);
  margin-bottom:9px}
/* 侧栏里的轻链接：导出人物卡、切回手动建卡这类次要动作 */
.sideLink{display:inline-block;margin-top:10px;font-family:var(--sans);font-size:10.5px;
  letter-spacing:.12em;color:var(--ink4);cursor:pointer;border-bottom:1px dashed rgba(70,52,37,.9);
  padding-bottom:2px;transition:.15s}
.sideLink:hover{color:var(--ember);border-bottom-color:var(--ember3)}
.sideLink + .sideLink{margin-left:14px}
.choice .cost{font-family:var(--sans);font-size:10px;color:var(--ink3);margin-left:auto;
  flex-shrink:0;padding:1px 8px;margin-top:4px;border:1px solid rgba(93,69,47,.85);
  border-radius:10px;letter-spacing:.06em;white-space:nowrap}
.choice .hl{font-family:var(--sans);font-size:11px;color:var(--ink4);letter-spacing:.04em}
.rule{
  position:relative;font-family:var(--sans);font-size:12px;line-height:1.75;color:var(--ink3);
  border:1px solid rgba(70,52,37,.5);border-left:2px solid var(--line3);border-radius:0 3px 3px 0;
  padding:9px 13px;margin-bottom:12px;background:rgba(26,20,17,.42);
}
.rule b{color:var(--ink2);font-weight:500}

/* ---------- 掷骰 ---------- */
.roll{margin:16px 0;border:1px solid rgba(70,52,37,.9);border-radius:5px;overflow:hidden;
  background:linear-gradient(180deg,#1e1713,#120e0c);animation:pop .3s ease;
  box-shadow:0 14px 36px -24px #000}
@keyframes pop{from{transform:scale(.97)}to{transform:none}}
.roll .rh{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);
  font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;color:var(--ink2)}
.roll .dice{display:flex;gap:7px;margin-left:auto}
.die{
  width:33px;height:33px;display:grid;place-items:center;border:1px solid rgba(70,52,37,.95);
  border-radius:3px;background:#0b0807;font-family:var(--sans);font-size:14.5px;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.die.drop{opacity:.3;text-decoration:line-through;border-color:var(--line)}
.die.u{border-color:var(--ember);color:var(--ember);box-shadow:0 0 16px -5px rgba(255,145,71,.9)}
.roll .rb{padding:13px 14px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.big{font-family:var(--sans);font-size:36px;font-weight:600;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big.v-ok{color:#a9cc74}
.big.v-bad{color:var(--bad)}
.verdict{font-family:var(--sans);font-size:12px;letter-spacing:.14em;padding:3px 10px;border-radius:2px}
.v-crit{background:rgba(143,180,92,.16);color:#b0d478;border:1px solid rgba(143,180,92,.45)}
.v-extreme{background:rgba(226,180,117,.14);color:var(--gold);border:1px solid rgba(226,180,117,.42)}
.v-hard{background:rgba(255,145,71,.13);color:var(--ember);border:1px solid rgba(255,145,71,.4)}
.v-regular{background:rgba(246,240,228,.09);color:var(--ink);border:1px solid var(--line2)}
.v-fail{background:rgba(217,89,75,.12);color:var(--bad);border:1px solid rgba(217,89,75,.4)}
.v-fumble{background:rgba(161,51,37,.26);color:#ff9080;border:1px solid var(--blood)}
.roll .meta{margin-left:auto;font-family:var(--sans);font-size:11px;color:var(--ink4);
  text-align:right;line-height:1.6;font-variant-numeric:tabular-nums}
.roll .dmgline{padding:0 14px 12px;font-family:var(--sans);font-size:12.5px;color:var(--ink2);line-height:1.7}

/* ---------- 侧栏 ---------- */
.sec{margin-bottom:19px}
.sec h3{
  font-family:var(--sans);font-size:10px;letter-spacing:.26em;color:var(--ink3);
  padding-bottom:8px;margin-bottom:11px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:7px;
}
.sec h3::before{content:"";width:3px;height:9px;border-radius:1px;background:var(--ember2);opacity:.85;flex-shrink:0}
.sec h3 em{font-style:normal;font-size:9px;letter-spacing:.04em;color:#6c5e4f;font-family:var(--sans)}
.sec h3 span{margin-left:auto;color:var(--ink4);letter-spacing:.04em;font-size:9.5px}

/* 角色卡 */
/* 角色卡：名字必须是视觉主角。职业用余烬色但压低字号，否则橙色会盖过名字 */
.who{display:grid;grid-template-columns:40px 1fr;gap:11px;align-items:center;
  padding:11px;border:1px solid var(--line);border-radius:5px;
  background:linear-gradient(135deg,rgba(31,24,19,.85),rgba(18,14,11,.7))}
.who .mono{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;color:var(--ember);border:1px solid var(--ember3);
  background:radial-gradient(circle at 50% 30%,rgba(255,145,71,.16),rgba(255,145,71,.02));
  text-shadow:0 0 14px rgba(255,145,71,.5)}
.who .who-name{font-size:16px;color:var(--ink);line-height:1.35;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .job{color:var(--ember);font-size:9.5px;font-family:var(--sans);letter-spacing:.14em;margin-top:2px;
  opacity:.88}
.who .meta{font-family:var(--sans);font-size:10px;color:var(--ink4);margin-top:5px;letter-spacing:.04em;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
/* 模式徽章：玩家随时能确认自己在哪一档规则下，不用回头翻开局页 */
.who .modeTag{
  font-family:var(--sans);font-size:8.5px;letter-spacing:.16em;line-height:1;
  padding:2px 6px;border-radius:2px;white-space:nowrap;
  color:var(--ember);border:1px solid rgba(255,145,71,.32);background:rgba(255,145,71,.08);
}
.who .modeTag.story{color:var(--gold);border-color:rgba(226,180,117,.32);background:rgba(226,180,117,.07)}

.bar{margin-bottom:9px}
.bar .lab{display:flex;align-items:baseline;font-family:var(--sans);font-size:10.5px;
  color:var(--ink2);margin-bottom:4px;letter-spacing:.06em}
.bar .lab .n{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px}
.bar .tr{height:7px;background:#0b0807;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.75)}
.bar .fl{height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1);border-radius:1px}
.bar.hp .fl{background:linear-gradient(90deg,#6e1f14,#cf4d31);box-shadow:0 0 9px -2px rgba(207,77,49,.85)}
.bar.san .fl{background:linear-gradient(90deg,#39536e,#6390b4);box-shadow:0 0 9px -2px rgba(99,144,180,.8)}
.bar.mp .fl{background:linear-gradient(90deg,#443164,#7f66b0);box-shadow:0 0 9px -2px rgba(127,102,176,.8)}
.bar.luck .fl{background:linear-gradient(90deg,#6f5a1c,#c9a842);box-shadow:0 0 9px -2px rgba(201,168,66,.8)}

.attrs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.attr{background:linear-gradient(180deg,rgba(30,23,18,.9),rgba(21,16,13,.9));
  border:1px solid var(--line);border-radius:4px;padding:7px 3px 6px;text-align:center}
.attr .k{font-family:var(--sans);font-size:9px;color:var(--ink3);letter-spacing:.02em}
.attr .v{font-family:var(--sans);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;
  line-height:1.3;letter-spacing:-.02em}
.attr .h{font-family:var(--sans);font-size:10.5px;color:var(--ink4);letter-spacing:.02em;
  font-variant-numeric:tabular-nums}

.skCollapse{margin-top:9px}
.sideMore{
  display:block;width:100%;text-align:center;font-family:var(--sans);font-size:10px;
  letter-spacing:.16em;color:var(--ink4);background:transparent;
  border:1px dashed rgba(70,52,37,.72);border-radius:3px;padding:5px 0;
  cursor:pointer;transition:.15s;
}
.sideMore:hover{color:var(--ember);border-color:var(--ember3);background:rgba(255,145,71,.05)}

.skills{max-height:none}
.sk{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:12px;
  padding:3.5px 4px 3.5px 6px;border-bottom:1px solid rgba(44,33,26,.6);cursor:default;
  border-left:2px solid transparent;transition:.15s}
.sk:last-child{border-bottom:none}
.sk .box{width:8px;height:8px;border:1px solid var(--line2);flex-shrink:0;border-radius:1px;
  transition:.15s;opacity:.45}
.sk.ticked{border-left-color:var(--ember);background:linear-gradient(90deg,rgba(255,145,71,.075),transparent 62%)}
.sk.ticked .box{background:var(--ember);border-color:var(--ember);box-shadow:0 0 8px rgba(255,145,71,.8)}
.sk .nm{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .vv{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:baseline}
.sk.on .nm{color:var(--ink)}
.sk .hl{color:var(--ink4);font-size:10px;margin-left:5px}
.sk .hl::before{content:"·";margin-right:4px;opacity:.6}
.sk .hl b{color:var(--ink4);font-weight:400}

.trail{font-family:var(--sans);font-size:10.5px;color:var(--ink3);line-height:1.95;
  font-variant-numeric:tabular-nums}
.trail a{color:var(--ink2);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--line2)}
.trail a:hover{color:var(--ember);border-bottom-color:var(--ember3)}
/* 行程方块 */
.trail .tn{display:inline-block;font-size:10px;line-height:1;padding:4px 6px 3px;
  margin:0 4px 4px 0;border:1px solid rgba(70,52,37,.72);border-radius:2px;
  color:var(--ink3);font-variant-numeric:tabular-nums;border-bottom:1px solid rgba(70,52,37,.72)}
.trail a.tn:hover{color:var(--ember);border-color:var(--ember3);background:rgba(255,145,71,.06)}
.trail .tn.on{color:var(--ember);border-color:var(--ember3);background:rgba(255,145,71,.09);font-weight:400}
.trail .tnMore{display:inline-block;font-size:9.5px;color:var(--ink4);margin:0 0 4px 2px}
.flag{display:inline-block;font-family:var(--sans);font-size:10px;color:var(--gold);
  border:1px solid rgba(226,180,117,.28);background:rgba(226,180,117,.07);
  padding:2px 8px;border-radius:2px;margin:0 5px 5px 0;letter-spacing:.02em}

.toast{
  /* 顶部而不是底部：底部正好是操作面板，提示一弹就把"判定成功/失败"
     这类必须看清的按钮盖住。往上放，遮的是刚到手的标题行，代价小得多。 */
  position:fixed;left:50%;top:72px;transform:translateX(-50%) translateY(-70px);
  background:#1e1713;border:1px solid var(--line2);border-left:2px solid var(--ember);
  color:var(--ink);padding:10px 18px;border-radius:3px;font-family:var(--sans);font-size:12.5px;
  z-index:60;opacity:0;transition:.35s;pointer-events:none;max-width:80vw;
  box-shadow:0 20px 50px -20px #000;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 创建向导（行内卡片） ---------- */
/* 车卡页的说明与规则：刻意换一套字体，和叙事正文分开。
   正文是宋体 20px 的书页排版，这些是"界面上的说明文字"，用无衬线、
   小两号、降一级颜色、左侧一道竖线 —— 四条线索同时区分，
   只换字体在 13px 下肉眼几乎看不出来。 */
.stmt{
  font-family:var(--sans);font-size:12.5px;line-height:1.95;color:var(--ink2);
  border-left:2px solid rgba(226,180,117,.34);border-radius:0 3px 3px 0;
  background:rgba(26,20,17,.46);
  padding:8px 12px 8px 13px;margin-bottom:12px;
}
.stmt b{color:var(--ember);font-weight:500}
/* 规则标签：一句话告诉玩家"这段不是故事，是规则" */
.rtag{
  font-style:normal;font-family:var(--sans);font-size:9px;letter-spacing:.2em;
  color:var(--gold);border:1px solid rgba(226,180,117,.34);border-radius:2px;
  padding:1px 5px 1px 6px;margin-right:8px;vertical-align:1.5px;white-space:nowrap;
}

/* ---------- 开局：模式选择 ---------- */
.modePick{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:20px 0 4px}
@media (max-width:780px){.modePick{grid-template-columns:1fr}}
.modeCard{
  border:1px solid var(--line);border-radius:6px;padding:15px 16px 13px;
  background:linear-gradient(180deg,rgba(30,23,18,.72),rgba(18,14,11,.5));
}
.modeCard h4{font-family:var(--serif);font-size:17px;font-weight:400;color:var(--ink);
  margin:0 0 2px;letter-spacing:.06em}
.modeCard .en{font-family:var(--sans);font-size:9px;letter-spacing:.24em;color:var(--ink4);
  text-transform:uppercase;margin-bottom:11px}
.modeCard ul{list-style:none;margin:0;padding:0}
.modeCard li{font-family:var(--sans);font-size:11.5px;line-height:1.9;color:var(--ink3);
  padding-left:13px;position:relative}
.modeCard li::before{content:"";position:absolute;left:2px;top:.85em;width:5px;height:1px;
  background:var(--ember2);opacity:.8}
.modeCard li b{color:var(--ink2);font-weight:500}
.pool{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.chip{
  font-family:var(--sans);font-size:14px;padding:7px 14px;border-radius:3px;cursor:pointer;
  background:rgba(26,20,17,.85);border:1px solid rgba(70,52,37,.85);color:var(--ink);transition:.14s;
  font-variant-numeric:tabular-nums;
}
.chip:hover{border-color:var(--ember);color:var(--ember);background:rgba(255,145,71,.1)}
.chip.used{opacity:.18;cursor:not-allowed;text-decoration:line-through;border-style:dashed}
.chip.sel{background:rgba(255,145,71,.16);border-color:var(--ember);color:var(--ember);
  box-shadow:0 0 16px -7px rgba(255,145,71,.9)}
.rowlbl{font-family:var(--sans);font-size:10px;letter-spacing:.24em;color:var(--ink4);margin:18px 0 9px}
.attrrow{display:grid;grid-template-columns:1fr;gap:6px}
.arow{display:grid;grid-template-columns:64px 1fr 44px;gap:10px;align-items:center;
  background:rgba(26,20,17,.7);border:1px solid var(--line);border-radius:4px;padding:8px 12px;
  transition:.15s;cursor:pointer}
.arow:hover{border-color:rgba(255,145,71,.35);background:rgba(40,29,21,.8)}
.arow .an{font-family:var(--sans);font-size:12px;color:var(--ink2)}
.arow .an i{font-style:normal;color:var(--ink4);font-size:10px}
.arow .aw{display:flex;gap:5px;flex-wrap:wrap}
.arow .av{font-family:var(--sans);font-size:17px;color:var(--ember);text-align:right;
  font-variant-numeric:tabular-nums}
.arow .av.half{display:block}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  background:rgba(26,20,17,.7);border:1px solid var(--line);border-radius:4px;
  padding:8px 12px;margin-bottom:6px}
.mrow .mn{font-family:var(--sans);font-size:12.5px;color:var(--ink)}
.mrow .mn i{font-style:normal;color:var(--ink4);font-size:10px;margin-left:6px}
.mrow .mv{font-family:var(--sans);font-size:16px;color:var(--ember);font-variant-numeric:tabular-nums}
.mrow.done{border-color:var(--line2)}
.mrow.done .mv{color:var(--ink2)}

/* ---------- 战斗 ---------- */
.fight{border:1px solid rgba(70,52,37,.9);border-radius:5px;
  background:linear-gradient(180deg,#1c1512,#100c0b);margin-bottom:14px;overflow:hidden;
  box-shadow:0 16px 44px -26px #000}
.fight .fh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--ink2);
  background:linear-gradient(90deg,rgba(161,51,37,.14),transparent 70%)}
.fight .fh .rnd{margin-left:auto;color:var(--ink4);font-size:11px;letter-spacing:.06em;white-space:nowrap}
.fight .fh .fm{font-size:10.5px;color:var(--ink4);letter-spacing:.04em;white-space:nowrap;
  padding-left:12px;border-left:1px solid var(--line)}
.fb{padding:13px 14px;display:grid;grid-template-columns:1fr auto 1fr;gap:13px;align-items:center}
.fighter{text-align:center}
.fighter .fn{font-family:var(--sans);font-size:11.5px;color:var(--ink2);margin-bottom:7px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.fighter .fbar{height:9px;background:#0b0807;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.fighter .fbar i{display:block;height:100%;background:linear-gradient(90deg,#6e1f14,#cf4d31);
  transition:width .4s;box-shadow:0 0 10px -3px rgba(207,77,49,.9)}
.fighter.you .fbar i{background:linear-gradient(90deg,#395c2b,#84ab55);
  box-shadow:0 0 10px -3px rgba(132,171,85,.9)}
.vs{font-family:var(--sans);font-size:10px;color:var(--ink4);letter-spacing:.2em}
.flog{padding:0 14px 13px;font-family:var(--sans);font-size:11.5px;color:var(--ink2);line-height:1.85;
  max-height:150px;overflow-y:auto}
.flog div{padding:3px 0;border-bottom:1px solid rgba(44,33,26,.6)}
.flog div:last-child{border-bottom:none}
.flog .you{color:#a9cc74}
.flog .foe{color:#e8907e}
.flog .sys{color:var(--ink4)}

/* ---------- 结局 ---------- */
.endcard{text-align:center;padding:24px 18px 6px;animation:fade .8s ease}
.endkind{font-family:var(--sans);font-size:10px;letter-spacing:.4em;margin-bottom:15px}
.endtitle{font-size:29px;letter-spacing:.12em;line-height:1.4;margin-bottom:22px}
.endtitle.death{color:#cf4d31;text-shadow:0 0 40px rgba(207,77,49,.38)}
.endtitle.win{color:var(--gold);text-shadow:0 0 40px rgba(226,180,117,.32)}
.endtitle.survive{color:#93bb6d;text-shadow:0 0 40px rgba(147,187,109,.28)}
.endtitle.mad{color:#8f84c4;text-shadow:0 0 40px rgba(143,132,196,.3)}
.endstats{display:inline-flex;border:1px solid var(--line);border-radius:4px;
  background:rgba(26,20,17,.5);overflow:hidden}
.endstats span{display:flex;flex-direction:column;gap:3px;padding:9px 20px;
  font-family:var(--sans);font-size:9.5px;color:var(--ink4);letter-spacing:.14em;
  border-right:1px solid var(--line)}
.endstats span:last-child{border-right:none}
.endstats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;
  font-size:15px;letter-spacing:0;font-family:var(--sans)}

.foot{margin-top:26px;padding-top:15px;border-top:1px solid var(--line);
  font-family:var(--sans);font-size:10.5px;color:var(--ink4);line-height:1.9;text-align:center}

/* 系统开启"减少动态效果"时彻底关掉位移/缩放，内容照常显示 */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}

/* ---------- 移动端 ---------- */
#mob{display:none}
#scrim{position:fixed;inset:0;z-index:39;display:none;background:rgba(4,3,2,.62);backdrop-filter:blur(2px)}
#scrim.on{display:block}
@media(max-width:880px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:296px;z-index:40;transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:26px 0 70px -24px #000}
  #side.on{transform:none}
  #mob{display:inline-block}
  #stage{padding:0 20px}
  #actsInner{padding:14px 20px 18px}
  #topbar{height:54px;padding:0 15px;gap:10px}
  #topbar .ttl{font-size:15px;letter-spacing:.18em}
  #topbar .sub{display:none}
  #entry{font-size:calc(var(--fs) - 1.5px);line-height:1.95}
  #entry p{text-indent:2em}
}
@media(max-width:520px){
  #topbar .tools .btn{padding:0 9px;font-size:11px}
  .endstats span{padding:8px 12px}
  .endtitle{font-size:23px}
}
/* 矮屏（笔记本 / 分屏）：压缩选项高度，保证 6–7 个选项一屏放得下 */
@media(max-height:840px){
  .choice{padding:10px 14px;margin-bottom:7px;font-size:16.5px;line-height:1.6}
  #actsInner{padding:13px 26px 15px}
  #actsTitle{margin-bottom:9px}
  #scroll{padding:16px 0 24px}
}
@media(max-height:690px){
  .choice{padding:9px 13px;margin-bottom:6px;font-size:16px;line-height:1.55}
  #actsInner{padding:11px 22px 13px}
  #scroll{padding:14px 0 26px}
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--line2)}
/* ---------- 访问计数（第三方，取不到数就整条隐藏，绝不占位） ---------- */
#hit{margin:24px 0 2px;padding-top:13px;border-top:1px solid var(--line);
  font-family:var(--sans);font-size:10px;letter-spacing:.13em;color:var(--ink4);
  display:flex;gap:8px;align-items:baseline;opacity:.7}
#hit[hidden]{display:none}
#hit b{font-weight:400;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.05em}
#hit .dot{color:var(--line3)}
</style>
</head>
<body>
<div class="grain"></div>

<div id="scrim"></div>
